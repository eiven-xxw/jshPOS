openapi: 3.1.0
info:
  title: 鲸熵汇统一异常中心 API
  version: 1.0.1-gate9b
x-contract-authority: CURRENT_RUNTIME
paths:
  /api/v1/operations/exceptions:
    get:
      operationId: listExceptionCases
      x-permission: operations:exception:read
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: state, in: query, required: false, schema: {$ref: '#/components/schemas/CaseState'}}
        - {name: severity, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: 可信租户与门店范围内案件}}
  /api/v1/operations/exceptions/scan:
    post:
      operationId: scanOwnerExceptions
      x-permission: operations:exception:scan
      description: 由服务端 Owner 端口产生权威观察；请求不得提供租户、来源摘要或严重级别。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses: {'200': {description: 扫描后案件列表}}
  /api/v1/operations/exceptions/{caseId}:
    get:
      operationId: getExceptionCase
      x-permission: operations:exception:read
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 案件详情}}
  /api/v1/operations/exceptions/{caseId}/claim:
    post:
      operationId: claimExceptionCase
      x-permission: operations:exception:claim
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 有期限认领租约}}
  /api/v1/operations/exceptions/{caseId}/start:
    post:
      operationId: startExceptionCase
      x-permission: operations:exception:operate
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: IN_PROGRESS}}
  /api/v1/operations/exceptions/{caseId}/transfer:
    post:
      operationId: transferExceptionCase
      x-permission: operations:exception:operate
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 受审计责任转派}}
  /api/v1/operations/exceptions/{caseId}/plan:
    post:
      operationId: planExceptionRepair
      x-permission: operations:exception:operate
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 保存处置计划，不直接改 Owner 事实}}
  /api/v1/operations/exceptions/{caseId}/repair:
    post:
      operationId: executeExceptionOwnerRepair
      x-permission: operations:exception:repair
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 返回原 Owner 命令观察}, '503': {description: Owner 端口或外部能力不可用}}
  /api/v1/operations/exceptions/{caseId}/review:
    post:
      operationId: reviewExceptionRepair
      x-permission: operations:exception:review
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 独立复核结果}}
  /api/v1/operations/exceptions/{caseId}/close:
    post:
      operationId: closeExceptionCase
      x-permission: operations:exception:close
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 基于可验证 Owner 结果关闭}}
  /api/v1/operations/exceptions/{caseId}/reopen:
    post:
      operationId: reopenExceptionCase
      x-permission: operations:exception:close
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses: {'200': {description: 只追加 REOPENED 历史}}
components:
  parameters:
    CaseId: {name: caseId, in: path, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 64}}
    CorrelationId: {name: X-Correlation-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
  schemas:
    CaseState: {type: string, enum: [OPEN, CLAIMED, IN_PROGRESS, WAITING_OWNER, RESOLVED, CLOSED, REOPENED, FAILED]}
