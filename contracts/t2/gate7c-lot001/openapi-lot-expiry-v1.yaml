openapi: 3.1.0
info:
  title: 鲸熵汇批次效期 API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /catalog/lot-policies:
    post:
      operationId: publishLotPolicy
      security: [{bearerAuth: []}]
      description: policyVersionId 即稳定幂等键，同版本异内容失败关闭。
      parameters: [{$ref: '#/components/parameters/CorrelationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublishPolicy'}}}
      responses: {'200': {description: 不可变策略版本}, '409': {description: 非社区超市或版本冲突}}
  /catalog/lot-policies/effective:
    get:
      operationId: getEffectiveLotPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: skuId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: effectiveAt, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {description: 当前可信策略}, '404': {description: 未启用}}
  /inventory/lots:
    get:
      operationId: listLots
      security: [{bearerAuth: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: warehouseId, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {name: skuId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: businessDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [AVAILABLE, NEAR_EXPIRY, EXPIRED, DEPLETED, BLOCKED]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses: {'200': {description: FEFO 稳定排序的批次投影}}
  /inventory/lots/alerts:
    get:
      operationId: listExpiryAlerts
      security: [{bearerAuth: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: warehouseId, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {name: businessDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses: {'200': {description: 版本化临期与过期投影}}
  /inventory/lots/package:
    get:
      operationId: downloadLatestSignedLotPackage
      security: [{bearerAuth: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: warehouseId, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
      responses: {'200': {description: 下载最后一次封存的 Ed25519 签名包}, '404': {description: 尚未发布}}
    post:
      operationId: publishSignedLotPackage
      security: [{bearerAuth: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: warehouseId, in: query, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses: {'200': {description: 独立单调版本的签名包}, '409': {description: 同键异内容或并发版本冲突}, '503': {description: KMS/HSM 签名端口未配置}}
  /inventory/lots/rebuild:
    post:
      operationId: rebuildLotProjection
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CorrelationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Rebuild'}}}
      responses: {'200': {description: 从只追加流水重建}, '409': {description: 并发或摘要冲突}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    CorrelationId: {name: X-Correlation-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 96}}
  schemas:
    PublishPolicy:
      type: object
      additionalProperties: false
      required: [policyVersionId, storeId, skuId, enabled, expiryBasis, nearExpiryDays, effectiveFrom]
      properties:
        policyVersionId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        storeId: {type: integer, minimum: 1}
        skuId: {type: integer, minimum: 1}
        enabled: {type: boolean}
        expiryBasis: {type: string, enum: [PRODUCTION_DATE, RECEIVED_DATE, EXPLICIT_EXPIRY_DATE]}
        shelfLifeDays: {type: [integer, 'null'], minimum: 1, maximum: 36500}
        nearExpiryDays: {type: integer, minimum: 0, maximum: 3650}
        effectiveFrom: {type: string, format: date-time}
    Rebuild:
      type: object
      additionalProperties: false
      required: [commandId, storeId, warehouseId, skuId, businessDate]
      properties:
        commandId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        storeId: {type: integer, minimum: 1}
        warehouseId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        skuId: {type: integer, minimum: 1}
        businessDate: {type: string, format: date}
