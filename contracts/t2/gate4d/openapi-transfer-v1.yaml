openapi: 3.0.3
info:
  title: 鲸熵汇基础调拨 API
  version: 1.0.0
  description: T2-TRF-001 Gate 4D 同租户基础调拨；tenant_id、库存前后量和成本均不得由客户端提交。
servers:
  - url: /api/v1
paths:
  /inventory/transfers:
    post:
      operationId: createTransfer
      summary: 创建调拨草稿
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTransferRequest'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}:
    get:
      operationId: getTransfer
      summary: 查询调拨及在途摘要
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TransferId'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /inventory/transfers/{transferId}/transit-reconciliation:
    get:
      operationId: reconcileTransferTransit
      summary: 从不可变在途流水核对在线数量投影
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      responses:
        '200': {$ref: '#/components/responses/TransitReconciliationResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /inventory/transfers/{transferId}/submit:
    post:
      operationId: submitTransfer
      summary: 提交调拨
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody: {$ref: '#/components/requestBodies/StateCommand'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}/approve:
    post:
      operationId: approveTransfer
      summary: 审批调拨
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody: {$ref: '#/components/requestBodies/StateCommand'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}/dispatch:
    post:
      operationId: dispatchTransfer
      summary: 来源仓整单发出
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}/receipts:
    post:
      operationId: receiveTransfer
      summary: 目的仓部分或最终收货
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiptRequest'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}/difference:
    post:
      operationId: resolveTransferDifference
      summary: 审批并结清少收差异
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DifferenceRequest'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers/{transferId}/cancel:
    post:
      operationId: cancelTransfer
      summary: 发出前取消调拨
      x-requirement-id: T2-TRF-001
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TransferId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {$ref: '#/components/responses/TransferResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    TransferId:
      name: transferId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
  requestBodies:
    StateCommand:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StateCommandRequest'}
  responses:
    TransferResponse:
      description: 调拨聚合视图
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TransferDetail'}
    TransitReconciliationResponse:
      description: 在途账本与在线投影的只读核对结果
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TransitReconciliation'}
    Conflict:
      description: 状态、幂等、数量、范围或权威来源冲突
    NotFound:
      description: 不存在或数据范围不可见
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    DecimalQuantity:
      type: string
      pattern: '^[0-9]{1,13}(\.[0-9]{1,6})?$'
    CommandBase:
      type: object
      required: [commandId, correlationId, expectedVersion]
      properties:
        commandId: {$ref: '#/components/schemas/Ulid'}
        correlationId: {type: string, minLength: 1, maxLength: 96}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TransferLineInput:
      type: object
      additionalProperties: false
      required: [transferLineId, skuId, unitId, requestedQuantity]
      properties:
        transferLineId: {$ref: '#/components/schemas/Ulid'}
        skuId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        unitId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        requestedQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [transferId, sourceStoreId, destinationStoreId, sourceWarehouseId, destinationWarehouseId, reason, correlationId, lines]
      properties:
        transferId: {$ref: '#/components/schemas/Ulid'}
        sourceStoreId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        destinationStoreId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        sourceWarehouseId: {$ref: '#/components/schemas/Ulid'}
        destinationWarehouseId: {$ref: '#/components/schemas/Ulid'}
        correlationId: {type: string, minLength: 1, maxLength: 96}
        reason: {type: string, minLength: 1, maxLength: 256}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/TransferLineInput'}}
    StateCommandRequest:
      type: object
      additionalProperties: false
      required: [commandId, correlationId, expectedVersion, reason]
      properties:
        commandId: {$ref: '#/components/schemas/Ulid'}
        correlationId: {type: string, minLength: 1, maxLength: 96}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 256}
    DispatchRequest:
      type: object
      additionalProperties: false
      required: [dispatchId, eventId, expectedVersion, correlationId]
      properties:
        dispatchId: {$ref: '#/components/schemas/Ulid'}
        eventId: {$ref: '#/components/schemas/Ulid'}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        correlationId: {type: string, minLength: 1, maxLength: 96}
    ReceiptLineInput:
      type: object
      additionalProperties: false
      required: [receiptLineId, transferLineId, quantity]
      properties:
        receiptLineId: {$ref: '#/components/schemas/Ulid'}
        transferLineId: {$ref: '#/components/schemas/Ulid'}
        quantity: {$ref: '#/components/schemas/DecimalQuantity'}
    ReceiptRequest:
      type: object
      additionalProperties: false
      required: [receiptId, eventId, expectedVersion, finalReceipt, lines, correlationId]
      properties:
        receiptId: {$ref: '#/components/schemas/Ulid'}
        eventId: {$ref: '#/components/schemas/Ulid'}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        finalReceipt: {type: boolean}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/ReceiptLineInput'}}
        correlationId: {type: string, minLength: 1, maxLength: 96}
    DifferenceLineInput:
      type: object
      additionalProperties: false
      required: [transferLineId, differenceQuantity, differenceReason]
      properties:
        transferLineId: {$ref: '#/components/schemas/Ulid'}
        differenceQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        differenceReason: {enum: [SHORTAGE, DAMAGED, REJECTED, TRANSIT_LOSS]}
    DifferenceRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion, lines, reason, correlationId]
      properties:
        commandId: {$ref: '#/components/schemas/Ulid'}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 256}
        correlationId: {type: string, minLength: 1, maxLength: 96}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/DifferenceLineInput'}}
    CancelRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandBase'}
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 256}
    TransferHead:
      type: object
      required: [transferId, sourceStoreId, sourceWarehouseId, destinationStoreId, destinationWarehouseId, status, creatorUserId, version]
      properties:
        transferId: {$ref: '#/components/schemas/Ulid'}
        sourceStoreId: {type: integer, format: int64}
        sourceWarehouseId: {$ref: '#/components/schemas/Ulid'}
        destinationStoreId: {type: integer, format: int64}
        destinationWarehouseId: {$ref: '#/components/schemas/Ulid'}
        status: {enum: [DRAFT, SUBMITTED, APPROVED, IN_TRANSIT, PARTIALLY_RECEIVED, DIFFERENCE_PENDING, CLOSED, CANCELLED]}
        reason: {type: string}
        creatorUserId: {type: integer, format: int64}
        approverUserId: {type: integer, format: int64, nullable: true}
        approvedAt: {type: string, format: date-time, nullable: true}
        dispatchedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
    TransferLineView:
      type: object
      required: [transferLineId, transferId, skuId, requestedUnitId, conversionNumerator, conversionDenominator, inputQuantity, baseUnitId, requestedQuantity, dispatchedQuantity, receivedQuantity, differenceQuantity]
      properties:
        transferLineId: {$ref: '#/components/schemas/Ulid'}
        transferId: {$ref: '#/components/schemas/Ulid'}
        skuId: {type: integer, format: int64}
        requestedUnitId: {type: integer, format: int64}
        conversionNumerator: {type: integer, format: int64, minimum: 1}
        conversionDenominator: {type: integer, format: int64, minimum: 1}
        inputQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        baseUnitId: {type: integer, format: int64}
        requestedQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        dispatchedQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        receivedQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        differenceQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
    TransferDetail:
      type: object
      required: [head, lines]
      properties:
        head: {$ref: '#/components/schemas/TransferHead'}
        lines: {type: array, items: {$ref: '#/components/schemas/TransferLineView'}}
    TransitLineReconciliation:
      type: object
      required: [transferLineId, dispatchedLedgerQuantity, receivedLedgerQuantity, differenceLedgerQuantity, openTransitQuantity, consistent]
      properties:
        transferLineId: {$ref: '#/components/schemas/Ulid'}
        dispatchedLedgerQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        receivedLedgerQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        differenceLedgerQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        openTransitQuantity: {$ref: '#/components/schemas/DecimalQuantity'}
        consistent: {type: boolean}
    TransitReconciliation:
      type: object
      required: [transferId, consistent, lines]
      properties:
        transferId: {$ref: '#/components/schemas/Ulid'}
        consistent: {type: boolean}
        lines: {type: array, items: {$ref: '#/components/schemas/TransitLineReconciliation'}}
