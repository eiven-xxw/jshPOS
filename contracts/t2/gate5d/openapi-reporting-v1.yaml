openapi: 3.1.0
info:
  title: JSH POS Reporting Owner API
  version: 1.0.0-gate5d
  description: >-
    T2-RPT-001 销售收银库存成本可重建投影与安全导出，以及
    T2-RPT-002 Provider 无关支付退款内部合成对账契约。
    tenant_id 只从可信认证或受控任务上下文注入，接口不得接受租户覆盖。
paths:
  /api/v1/reporting/source-events:
    post:
      operationId: ingestReportingSourceEvent
      x-requirement: T2-RPT-001
      x-permission: report:projection:ingest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/report-source-event.v1.schema.json" }
      responses:
        "200": { description: 已应用或同摘要幂等返回 }
        "409": { description: 同事件异摘要、来源序列或守恒冲突 }
  /api/v1/reports/sales-daily:
    get:
      operationId: querySalesDailyReport
      x-requirement: T2-RPT-001
      x-permission: report:operation:read
      parameters:
        - { $ref: "#/components/parameters/FromDate" }
        - { $ref: "#/components/parameters/ToDate" }
        - { $ref: "#/components/parameters/StoreId" }
        - { name: terminalId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: cashierId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: 可信租户与门店范围内的销售收银日投影 }
  /api/v1/reports/inventory-cost-daily:
    get:
      operationId: queryInventoryCostDailyReport
      x-requirement: T2-RPT-001
      x-permission: report:operation:read
      parameters:
        - { $ref: "#/components/parameters/FromDate" }
        - { $ref: "#/components/parameters/ToDate" }
        - { $ref: "#/components/parameters/StoreId" }
        - { name: warehouseId, in: query, schema: { type: string, maxLength: 26 } }
        - { name: skuId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: 精确数量和成本日投影 }
  /api/v2/reports/sales-daily:
    get:
      operationId: querySalesDailyReportV2
      x-requirement: T2-RPT-001
      x-change-request: CR-T2G10A-013
      x-permission: report:operation:read
      x-legacy-compatible-operation: querySalesDailyReport
      parameters:
        - { $ref: "#/components/parameters/FromDate" }
        - { $ref: "#/components/parameters/ToDate" }
        - { $ref: "#/components/parameters/StoreId" }
        - { name: terminalId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: cashierId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 }, description: 服务端签名且绑定租户、筛选与投影版本的游标 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: 有界销售 keyset 页；金额字段继续沿用原投影口径
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesPage" }
        "400": { description: 日期、行数或签名游标无效 }
        "403": { description: 门店超出可信数据范围 }
  /api/v1/reporting/rebuilds:
    post:
      operationId: rebuildReportingProjection
      x-requirement: T2-RPT-001
      x-permission: report:projection:rebuild
      x-requires-tenant-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rebuildId, projectionVersion, fromDate, toDate, correlationId]
              properties:
                rebuildId: { $ref: "#/components/schemas/Ulid" }
                projectionVersion: { type: string, pattern: "^[A-Za-z0-9._-]{1,32}$" }
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                correlationId: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200": { description: 重建完成且活动版本已安全切换 }
        "409": { description: 重建摘要不一致或已有重建运行 }
  /api/v1/report-exports:
    post:
      operationId: requestReportExport
      x-requirement: T2-RPT-001
      x-permission: report:export:request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/report-export-command.v1.schema.json" }
      responses:
        "200": { description: 导出请求，可能等待独立审批 }
  /api/v1/report-exports/{exportId}:
    get:
      operationId: getReportExport
      x-requirement: T2-RPT-001
      x-permission: report:export:request
      parameters: [{ $ref: "#/components/parameters/ExportId" }]
      responses:
        "200": { description: 重新校验租户与门店范围后返回导出状态 }
  /api/v1/report-exports/{exportId}/approve:
    post:
      operationId: approveReportExport
      x-permission: report:export:approve
      parameters: [{ $ref: "#/components/parameters/ExportId" }]
      responses:
        "200": { description: 独立审批完成 }
        "409": { description: 自我审批或非法状态迁移 }
  /api/v1/report-exports/{exportId}/generate:
    post:
      operationId: generateReportExport
      x-permission: report:export:generate
      parameters: [{ $ref: "#/components/parameters/ExportId" }]
      responses:
        "200": { description: 安全 CSV 制品已生成 }
  /api/v1/report-exports/{exportId}/download-token:
    post:
      operationId: issueReportDownloadToken
      x-permission: report:export:download
      parameters: [{ $ref: "#/components/parameters/ExportId" }]
      responses:
        "200": { description: 十分钟有效的单次下载令牌 }
  /api/v1/reporting/differences:
    get:
      operationId: queryReportingDifferences
      x-permission: report:repair:manage
      responses:
        "200": { description: 仅 Reporting 差异与修复状态，不覆盖业务事实 }
  /api/v1/reporting/payment-facts:
    post:
      operationId: ingestProviderNeutralPaymentFact
      x-requirement: T2-RPT-002
      x-permission: report:payment:ingest
      x-provider-network-calls: 0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/payment-reconciliation-fact.v1.schema.json" }
      responses:
        "200": { description: Provider 无关支付或退款事实已幂等应用 }
        "409": { description: 同事实标识异摘要或匹配键冲突 }
  /api/v1/reporting/internal-synthetic-bills:
    post:
      operationId: ingestInternalSyntheticBillEntry
      x-requirement: T2-RPT-002
      x-permission: report:bill:synthetic-import
      x-evidence-level: SYNTHETIC_INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/internal-synthetic-bill-entry.v1.schema.json" }
      responses:
        "200": { description: 内部合成账单条目已幂等应用且不构成 SANDBOX 证据 }
        "409": { description: 同账单条目标识异摘要 }
  /api/v1/reports/payment-reconciliation:
    get:
      operationId: queryPaymentReconciliation
      x-requirement: T2-RPT-002
      x-permission: report:payment-reconciliation:read
      parameters:
        - { $ref: "#/components/parameters/FromDate" }
        - { $ref: "#/components/parameters/ToDate" }
        - { $ref: "#/components/parameters/StoreId" }
        - { name: differenceType, in: query, schema: { type: string, enum: [MATCHED, MISSING_BILL, MISSING_INTERNAL, AMOUNT_MISMATCH, CURRENCY_MISMATCH, STATUS_MISMATCH, BUSINESS_DATE_MISMATCH] } }
        - { name: handlingState, in: query, schema: { type: string, enum: [MATCHED, OPEN, ASSIGNED, RESOLVED, IGNORED] } }
      responses:
        "200": { description: 可信租户和门店范围内的 Provider 无关内部合成对账投影 }
  /api/v1/reporting/payment-reconciliation/{reconciliationId}/transitions:
    post:
      operationId: transitionPaymentReconciliation
      x-requirement: T2-RPT-002
      x-permission: report:payment-reconciliation:manage
      parameters:
        - { $ref: "#/components/parameters/ReconciliationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toState, reason, expectedVersion, correlationId]
              properties:
                toState: { type: string, enum: [ASSIGNED, RESOLVED, IGNORED] }
                reason: { type: string, minLength: 1, maxLength: 256 }
                expectedVersion: { type: integer, minimum: 0 }
                correlationId: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200": { description: 差异处理状态已更新并追加审计链 }
        "409": { description: 非法状态迁移或乐观锁冲突 }
  /api/v1/reporting/payment-reconciliation/{reconciliationId}/audit:
    get:
      operationId: listPaymentReconciliationAudit
      x-requirement: T2-RPT-002
      x-permission: report:payment-reconciliation:read
      parameters:
        - { $ref: "#/components/parameters/ReconciliationId" }
      responses:
        "200": { description: 可信租户和门店范围内的只追加系统分类与人工处理审计链 }
        "404": { description: 对账条目不存在或不可见 }
  /api/v1/reporting/payment-reconciliation/rebuilds:
    post:
      operationId: rebuildPaymentReconciliationProjection
      x-requirement: T2-RPT-002
      x-permission: report:projection:rebuild
      x-provider-network-calls: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rebuildId, fromDate, toDate, correlationId]
              properties:
                rebuildId: { $ref: "#/components/schemas/Ulid" }
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                correlationId: { $ref: "#/components/schemas/Ulid" }
      responses:
        "200": { description: 从两侧只追加 Inbox 完成确定性重建并返回摘要 }
        "409": { description: 同重建标识异内容或并发冲突 }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    FromDate: { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
    ToDate: { name: toDate, in: query, required: true, schema: { type: string, format: date } }
    StoreId: { name: storeId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ExportId: { name: exportId, in: path, required: true, schema: { $ref: "#/components/schemas/Ulid" } }
    ReconciliationId: { name: reconciliationId, in: path, required: true, schema: { $ref: "#/components/schemas/Ulid" } }
  schemas:
    Ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    SalesPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: { type: array, maxItems: 500, items: { type: object } }
        nextCursor: { type: [string, "null"], maxLength: 2048 }
        hasMore: { type: boolean }
        projectionVersion: { type: [string, "null"], maxLength: 32 }
security: [{ bearerAuth: [] }]
