--- # 生产环境临时文件：正文不进入 Git、日志或普通制品
spring.servlet.multipart:
  location: ${JSH_MULTIPART_TEMP_DIR:/ruoyi/server/temp}
  file-size-threshold: 0B

jshpos.service.attachment-staging-directory: ${JSH_ATTACHMENT_TEMP_DIR:/ruoyi/server/temp/jshpos-service-attachments}

--- # 独立管理认证与可选监控注册；Secret 由部署平台注入
spring.boot.admin.client:
  enabled: ${JSH_BOOT_ADMIN_ENABLED:false}
  url: ${JSH_BOOT_ADMIN_URL:}
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${JSH_ACTUATOR_USERNAME}
  password: ${JSH_ACTUATOR_PASSWORD}

--- # 可选任务调度默认关闭；显式启用时启动门禁要求受控令牌
snail-job:
  enabled: ${JSH_SNAIL_JOB_ENABLED:false}
  group: ${JSH_SNAIL_JOB_GROUP:ruoyi_group}
  token: ${JSH_SNAIL_JOB_TOKEN:}
  server:
    host: ${JSH_SNAIL_JOB_HOST:127.0.0.1}
    port: ${JSH_SNAIL_JOB_PORT:17888}
  namespace: ${spring.profiles.active}
  port: 2${server.port}
  host:

--- # 生产数据源：禁止静态默认账号和口令
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      p6spy: false
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: ${JSH_DB_URL}
          username: ${JSH_DB_USERNAME}
          password: ${JSH_DB_PASSWORD}
      hikari:
        maxPoolSize: ${JSH_DB_MAX_POOL_SIZE:20}
        minIdle: ${JSH_DB_MIN_IDLE:10}
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000
  data:
    redis:
      host: ${JSH_REDIS_HOST}
      port: ${JSH_REDIS_PORT:6379}
      database: ${JSH_REDIS_DATABASE:0}
      password: ${JSH_REDIS_PASSWORD}
      timeout: 10s
      ssl.enabled: ${JSH_REDIS_SSL:true}

redisson:
  keyPrefix: ${JSH_REDIS_KEY_PREFIX:jshpos}
  threads: 16
  nettyThreads: 32
  singleServerConfig:
    clientName: JshPOS
    connectionMinimumIdleSize: 16
    connectionPoolSize: 64
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 25

--- # 邮件属于可选外部集成，默认关闭且无静态示例凭据
mail:
  enabled: ${JSH_MAIL_ENABLED:false}
  host: ${JSH_MAIL_HOST:}
  port: ${JSH_MAIL_PORT:465}
  auth: true
  from: ${JSH_MAIL_FROM:}
  user: ${JSH_MAIL_USERNAME:}
  pass: ${JSH_MAIL_PASSWORD:}
  starttlsEnable: true
  sslEnable: true
  timeout: 10000
  connectionTimeout: 5000

--- # 生产认证与接口加解密 Secret；缺失时启动失败
sa-token.jwt-secret-key: ${JSH_JWT_SECRET}

api-decrypt:
  enabled: true
  publicKey: ${JSH_API_DECRYPT_PUBLIC_KEY}
  privateKey: ${JSH_API_DECRYPT_PRIVATE_KEY}

--- # 管理端点固定白名单；所有端点继续经过独立 Basic 认证
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    logfile:
      access: none

--- # 生产默认不暴露接口文档；需要时必须通过独立变更启用
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
