name: T2 PAY-002 Controlled Document Verification

on:
  push:
    branches: ["t2/pay002-controlled-doc-verification-20260821"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-pay002-document-verification.yml"
      - "contracts/t2/pay002-document-verification/**"
      - "docs/governance/**"
      - "docs/t2-gate6f-prep/README.md"
      - "docs/t2-pay002-document-verification/**"
      - "scripts/*pay002_document_verification*"

permissions:
  contents: read

concurrency:
  group: t2-pay002-doc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate RTM contracts missing intake and zero-network boundary
        run: |
          mkdir -p artifacts/t2/pay002-doc/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_pay002_document_verification.py --output artifacts/t2/pay002-doc/governance-ubuntu/pay002-document-verification.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-pay002-doc-governance-ubuntu, path: artifacts/t2/pay002-doc/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 paths RTM and controlled metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/pay002-doc/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_pay002_document_verification.py --output artifacts/t2/pay002-doc/governance-windows/pay002-document-verification.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-pay002-doc-governance-windows, path: artifacts/t2/pay002-doc/governance-windows, if-no-files-found: error, retention-days: 30 }

  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce no runtime dependency secret or Provider execution expansion
        run: |
          mkdir -p artifacts/t2/pay002-doc/offline-boundary
          python scripts/check_t2_pay002_document_verification.py --output artifacts/t2/pay002-doc/offline-boundary/scope-status-secret.json
          python scripts/review_dependency_diff.py 7ccc50112d954c1d4c9bdd3464da4b3a2eb9ec3e "$(git rev-parse HEAD)" > artifacts/t2/pay002-doc/offline-boundary/dependency-diff.json
          test "$(git diff --name-only 7ccc50112d954c1d4c9bdd3464da4b3a2eb9ec3e -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-pay002-doc-offline-boundary, path: artifacts/t2/pay002-doc/offline-boundary, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, offline-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-pay002-doc-governance-ubuntu, path: artifacts/t2/pay002-doc/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-pay002-doc-governance-windows, path: artifacts/t2/pay002-doc/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-pay002-doc-offline-boundary, path: artifacts/t2/pay002-doc/offline-boundary }
      - name: Build missing-intake evidence index
        run: python scripts/build_t2_pay002_document_verification_evidence.py --bundle-dir artifacts/t2/pay002-doc --output artifacts/t2/pay002-doc/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-pay002-doc-evidence-index, path: artifacts/t2/pay002-doc/evidence-index.json, if-no-files-found: error, retention-days: 30 }
