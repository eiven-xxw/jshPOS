name: T1 Week 1 STATIC FAKE Gates

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week1.yml"
      - "contracts/poc/t1/**"
      - "docs/adr/ADR-017-*"
      - "docs/governance/**"
      - "docs/t1-prep/**"
      - "docs/t1-week1/**"
      - "poc/t1-week1/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"
  push:
    branches: ["t1/**"]
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week1.yml"
      - "contracts/poc/t1/**"
      - "docs/adr/ADR-017-*"
      - "docs/governance/**"
      - "docs/t1-prep/**"
      - "docs/t1-week1/**"
      - "poc/t1-week1/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"

permissions:
  contents: read

concurrency:
  group: t1-week1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify T0 baseline and T1 authorization
        run: python scripts/check_t1_prep.py
      - name: Verify RTM uniqueness and lifecycle
        run: python scripts/check_rtm.py
      - name: Verify Week 1 scope boundary
        run: python scripts/check_t1_week1.py --output artifacts/t1/week1/static-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week1-static-evidence
          path: artifacts/t1/week1/static-evidence.json
          if-no-files-found: error
          retention-days: 30

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse all repository contracts
        run: python scripts/check_contracts.py
      - name: Validate deterministic fixtures
        run: python scripts/check_t1_week1.py

  fake-faults:
    needs: [governance, contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run isolated unit tests
        run: python -m unittest discover -s poc/t1-week1/tests -v
      - name: Run seven deterministic Fake probes
        run: python poc/t1-week1/src/t1_fake_harness.py --output artifacts/t1/week1/fake-evidence.json
      - name: Validate Fake evidence envelope
        run: python scripts/check_t1_week1.py --validate-evidence artifacts/t1/week1/fake-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week1-fake-evidence
          path: artifacts/t1/week1/fake-evidence.json
          if-no-files-found: error
          retention-days: 30

  device-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve locked device contract dependencies
        working-directory: packages/pos_device_adapter
        run: flutter pub get --enforce-lockfile
      - name: Analyze stable device contract
        working-directory: packages/pos_device_adapter
        run: flutter analyze --fatal-infos
      - name: Test stable device contract
        working-directory: packages/pos_device_adapter
        run: flutter test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Scan Week 1 scope for secrets
        run: |
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 contracts/poc/t1
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 poc/t1-week1
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 docs/t1-prep
      - name: Scan Week 1 workflow configuration
        run: /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 .github/workflows/t1-week1.yml

  evidence:
    needs: [governance, contracts, fake-faults, device-contract, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week1-static-evidence
          path: artifacts/t1/week1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week1-fake-evidence
          path: artifacts/t1/week1
      - name: Validate levels and build evidence manifest
        run: >-
          python scripts/check_t1_week1.py
          --output artifacts/t1/week1/static-evidence.json
          --validate-evidence artifacts/t1/week1/fake-evidence.json
          --manifest-output artifacts/t1/week1/evidence-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week1-evidence-bundle
          path: artifacts/t1/week1
          if-no-files-found: error
          retention-days: 30
