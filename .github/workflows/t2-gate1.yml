name: T2 Gate 1 Sprint S1 Quality Gates

on:
  push:
    branches: ["t2/gate1-sprint1-20260816"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate1.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/governance/**"
      - "docs/t2-gate1/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t2_gate1.py"
      - "scripts/run_t2_gate1_attacks.py"
      - "scripts/build_t2_gate1_evidence.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Verify immutable baseline, RTM, formal contracts and Gate 1 scope
        run: |
          mkdir -p artifacts/t2/gate1/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate1.py --stage closure --output artifacts/t2/gate1/governance/gate1-governance.json
          python scripts/review_dependency_diff.py cf2ef29bd74c5d0f8fa5845a689305ebb56c7ef2 "$(git rev-parse HEAD)" > artifacts/t2/gate1/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-governance
          path: artifacts/t2/gate1/governance
          if-no-files-found: error
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build admin application and execute Gate 0 plus Gate 1 tests
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-server
          path: |
            server/ruoyi-modules/jshpos-foundation/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-catalog/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-foundation/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-catalog/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-catalog/target/site/jacoco/jacoco.csv
            server/ruoyi-modules/jshpos-catalog/target/gate1-capacity.json
            server/ruoyi-modules/jshpos-catalog/target/jshpos-catalog-*.jar
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate1_root
          MYSQL_DATABASE: jshpos_gate1
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate1_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE1_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate1?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE1_MYSQL_USERNAME: root
      GATE1_MYSQL_PASSWORD: synthetic_gate1_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Run MySQL 8.4 four-version Flyway and isolation constraints
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-catalog -am test
          -Dtest=CatalogMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-mysql
          path: server/ruoyi-modules/jshpos-catalog/target/surefire-reports/TEST-*CatalogMigrationMySqlIT.xml
          if-no-files-found: error
          retention-days: 30

  tenant-security-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Execute trusted-context, import, package and fixed-capacity tests
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-catalog -am test
          -Dtest=CatalogApplicationServiceTest,CatalogImportServiceTest,CatalogPackageServiceTest,CatalogImportPreflightTest,CatalogStrictTenantMapperGuardTest
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Build nine-surface two-tenant attack evidence
        run: python scripts/run_t2_gate1_attacks.py --output artifacts/t2/gate1/tenant/tenant-attacks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-tenant
          path: |
            artifacts/t2/gate1/tenant
            server/ruoyi-modules/jshpos-catalog/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-catalog/target/gate1-capacity.json
          if-no-files-found: error
          retention-days: 30

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit, build, lint, typecheck, contract test and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
      - name: Enforce frontend license policy
        working-directory: admin-web
        run: >-
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security-sbom-license:
    needs: [server, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-server, path: artifacts/t2/gate1/security/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-web, path: artifacts/t2/gate1/security/web }
      - name: Locate tested SBOM and install verified Trivy
        run: |
          sbom="$(find artifacts/t2/gate1/security/server -name bom.json -type f -print -quit)"
          test -n "$sbom" && test -s "$sbom"
          echo "$sbom" > artifacts/t2/gate1/security/server-sbom-path.txt
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Enforce vulnerability, Secret, IaC and license gates
        run: |
          sbom="$(cat artifacts/t2/gate1/security/server-sbom-path.txt)"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate1/security/trivy-sbom-vuln.json "$sbom"
          python scripts/check_sbom_licenses.py "$sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate1/security/server-license-policy.txt
          ignored_licenses="$(python -c 'import json; print(",".join(json.load(open("docs/compliance/reviewed-license-allowlist.json", encoding="utf-8"))["trivy_ignored_licenses"]))')"
          /tmp/trivy sbom --skip-version-check --scanners license --severity HIGH,CRITICAL --exit-code 1 --ignored-licenses "$ignored_licenses" --format json --output artifacts/t2/gate1/security/trivy-sbom-license.json "$sbom"
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate1/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate1/security/trivy-config.json .github/workflows/t2-gate1.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-security
          path: artifacts/t2/gate1/security
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, server, mysql-migration, tenant-security-capacity, admin-web, security-sbom-license]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-governance, path: artifacts/t2/gate1/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-server, path: artifacts/t2/gate1/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-mysql, path: artifacts/t2/gate1/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-tenant, path: artifacts/t2/gate1/bundle/tenant }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-web, path: artifacts/t2/gate1/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate1-security, path: artifacts/t2/gate1/bundle/security }
      - name: Verify all evidence and build SHA-256 index
        run: python scripts/build_t2_gate1_evidence.py --bundle-dir artifacts/t2/gate1/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate1-sprint-s1-evidence-bundle
          path: artifacts/t2/gate1/bundle
          if-no-files-found: error
          retention-days: 30
