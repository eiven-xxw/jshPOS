name: T2 Gate 10A R2 R2 SQL Preparation

on:
  push:
    branches: ["t2/gate10a-r2-r2-sql-prep"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate10a-r2-r2-sql-prep.yml"
      - "contracts/t2/gate10a-r2-r2-sql-prep/**"
      - "contracts/t2/gate10a-prep/findings-register-v1.json"
      - "contracts/t2/gate10a-r2-r1-mtn/findings-register-v1.json"
      - "docs/governance/**"
      - "docs/t2-gate10a-r2-r2-sql-prep/**"
      - "scripts/*gate10a_r2_r2_sql_prep*"

permissions:
  contents: read

concurrency:
  group: gate10a-r2-r2-sql-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate SQL preparation scope query digests and red baseline
        run: |
          set -euo pipefail
          out=artifacts/t2/gate10a-r2-r2-sql-prep/governance-ubuntu
          mkdir -p "$out/audit"
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate10a_r2_r2_sql_prep.py scripts/audit_t2_gate10a_r2_r2_sql_prep.py scripts/build_t2_gate10a_r2_r2_sql_prep_evidence.py
          python scripts/check_t2_gate10a_r2_r2_sql_prep.py | tee "$out/scope.txt"
          python scripts/audit_t2_gate10a_r2_r2_sql_prep.py --output-dir "$out/audit"
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-governance-ubuntu, path: artifacts/t2/gate10a-r2-r2-sql-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 query digest and audit determinism
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/t2/gate10a-r2-r2-sql-prep/governance-windows
          mkdir -p "$out/audit"
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate10a_r2_r2_sql_prep.py scripts/audit_t2_gate10a_r2_r2_sql_prep.py scripts/build_t2_gate10a_r2_r2_sql_prep_evidence.py
          python scripts/check_t2_gate10a_r2_r2_sql_prep.py | tee "$out/scope.txt"
          python scripts/audit_t2_gate10a_r2_r2_sql_prep.py --output-dir "$out/audit"
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-governance-windows, path: artifacts/t2/gate10a-r2-r2-sql-prep/governance-windows, if-no-files-found: error, retention-days: 30 }

  server-baseline:
    needs: [governance-ubuntu, governance-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Re-run unchanged Server baseline
        run: |
          set -euo pipefail
          out=artifacts/t2/gate10a-r2-r2-sql-prep/server-baseline
          mkdir -p "$out/test-reports"
          ./server/mvnw -f server/pom.xml test -DskipTests=false | tee "$out/maven-test.log"
          find server -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} "$out/test-reports" \;
          test -z "$(git diff --name-only f2a9f454d5c306142b71dbae398853ae17daab9e HEAD -- server admin-web pos-flutter packages infra infrastructure)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-server-baseline, path: artifacts/t2/gate10a-r2-r2-sql-prep/server-baseline, if-no-files-found: error, retention-days: 30 }

  mysql84-schema:
    needs: [governance-ubuntu, governance-windows]
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_sql_prep_root, MYSQL_DATABASE: jshpos_sql_prep }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_sql_prep_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_sql_prep?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_sql_prep_root
      GATE8C_MIGRATION_ROOT: ${{ github.workspace }}/server/ruoyi-modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate published migrations and freeze current index catalog
        run: |
          set -euo pipefail
          out=artifacts/t2/gate10a-r2-r2-sql-prep/mysql84-schema
          mkdir -p "$out"
          ./server/mvnw -f server/pom.xml -pl ruoyi-modules/jshpos-release -am test -Dtest=ReleaseMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          mysql -h127.0.0.1 -uroot -psynthetic_sql_prep_root -NBe "SELECT VERSION(),@@time_zone,@@character_set_server,@@collation_server,@@sql_mode" > "$out/mysql-environment.tsv"
          mysql -h127.0.0.1 -uroot -psynthetic_sql_prep_root -NBe "SELECT TABLE_NAME,INDEX_NAME,NON_UNIQUE,SEQ_IN_INDEX,COLUMN_NAME,COLLATION,CARDINALITY FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA='jshpos_sql_prep' AND TABLE_NAME IN ('inv_lot_identity','inv_lot_balance','inv_lot_expiry_projection','prm_rule_version','prm_rule_benefit','prm_rule_scope','prm_quote_line','rpt_sales_daily','rpt_inventory_cost_daily','rpt_payment_reconciliation','pay_payment_attempt','pay_payment_intent','pay_refund','pur_purchase_order_line','inv_transfer_line','mbr_points_lot') ORDER BY TABLE_NAME,INDEX_NAME,SEQ_IN_INDEX" > "$out/current-index-catalog.tsv"
          cp server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml "$out/"
          test -s "$out/current-index-catalog.tsv"
          test -z "$(git diff --name-only f2a9f454d5c306142b71dbae398853ae17daab9e HEAD -- 'server/**/db/migration/**' 'pos-flutter/lib/infrastructure/local_database/**')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-mysql84-schema, path: artifacts/t2/gate10a-r2-r2-sql-prep/mysql84-schema, if-no-files-found: error, retention-days: 30 }

  gate9c-regression:
    needs: [governance-ubuntu, governance-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Re-run Gate9C API page Owner and SQL preparation audits
        run: |
          set -euo pipefail
          out=artifacts/t2/gate10a-r2-r2-sql-prep/gate9c-regression
          mkdir -p "$out/r3d-pages"
          python scripts/check_t2_gate10a_r2_r2_sql_prep.py | tee "$out/current-scope.txt"
          python scripts/audit_t2_gate9c_seal.py --output-dir "$out/gate9c-seal"
          python scripts/audit_t2_g9a_r2_convergence.py --output "$out/r2-assembly.json"
          python scripts/audit_t2_g9a_r3d_joint_pages.py --output-dir "$out/r3d-pages"
          python scripts/audit_t2_g9a_r4_formal_stack.py --output "$out/r4-stack.json" --owner-csv "$out/r4-owners.csv"
          python scripts/audit_t2_gate6g_api.py --output "$out/api-regression.json"
          python scripts/audit_t2_gate10a_r2_r2_sql_prep.py --output-dir "$out/sql-prep-audit"
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-gate9c-regression, path: artifacts/t2/gate10a-r2-r2-sql-prep/gate9c-regression, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server-baseline, mysql84-schema, gate9c-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate10a-r2-r2-sql-prep-*, path: downloaded, merge-multiple: false }
      - name: Build SQL preparation evidence index
        run: |
          set -euo pipefail
          bundle=artifacts/t2/gate10a-r2-r2-sql-prep/bundle
          final=artifacts/t2/gate10a-r2-r2-sql-prep/final
          mkdir -p "$bundle" "$final"
          for pair in \
            "governance-ubuntu:t2-gate10a-r2-r2-sql-prep-governance-ubuntu" \
            "governance-windows:t2-gate10a-r2-r2-sql-prep-governance-windows" \
            "server-baseline:t2-gate10a-r2-r2-sql-prep-server-baseline" \
            "mysql84-schema:t2-gate10a-r2-r2-sql-prep-mysql84-schema" \
            "gate9c-regression:t2-gate10a-r2-r2-sql-prep-gate9c-regression"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "$bundle/$producer"
            cp -R "downloaded/$artifact/." "$bundle/$producer/"
          done
          python scripts/build_t2_gate10a_r2_r2_sql_prep_evidence.py --bundle-dir "$bundle" --output "$final/evidence-index.json" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate10a-r2-r2-sql-prep-evidence-index, path: artifacts/t2/gate10a-r2-r2-sql-prep/final, if-no-files-found: error, retention-days: 90 }
