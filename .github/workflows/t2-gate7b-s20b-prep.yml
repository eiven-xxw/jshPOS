name: T2 Gate 7B S20-B Second Batch Prep

on:
  push:
    branches: ["t2/gate7b-sprint20b-pos-operations"]
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/t2-gate7b-s20b-prep.yml"
      - "contracts/t2/gate7b/**"
      - "contracts/t2/gate7b-s20b/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate7b/**"
      - "docs/t2-gate7b-s20b/**"
      - "scripts/check_t2_gate7b.py"
      - "scripts/check_t2_gate7b_s20b_prep.py"
      - "scripts/build_t2_gate7b_s20b_evidence.py"

permissions:
  contents: read

concurrency:
  group: t2-gate7b-s20b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate RTM, contracts, CR and second-batch preparation
        run: |
          mkdir -p artifacts/t2/gate7b-s20b/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7b.py scripts/check_t2_gate7b_s20b_prep.py scripts/build_t2_gate7b_s20b_evidence.py
          python scripts/check_t2_gate7b.py
          python scripts/check_t2_gate7b_s20b_prep.py --output artifacts/t2/gate7b-s20b/governance-ubuntu/gate7b-s20b.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7b-s20b-governance-ubuntu
          path: artifacts/t2/gate7b-s20b/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 RTM, contracts, CR and scope on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate7b-s20b/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7b.py scripts/check_t2_gate7b_s20b_prep.py scripts/build_t2_gate7b_s20b_evidence.py
          python scripts/check_t2_gate7b.py
          python scripts/check_t2_gate7b_s20b_prep.py --output artifacts/t2/gate7b-s20b/governance-windows/gate7b-s20b.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7b-s20b-governance-windows
          path: artifacts/t2/gate7b-s20b/governance-windows
          if-no-files-found: error
          retention-days: 30

  scope-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce prep-only runtime, migration, dependency and external boundaries
        run: |
          mkdir -p artifacts/t2/gate7b-s20b/scope-boundary
          python scripts/check_t2_gate7b_s20b_prep.py --output artifacts/t2/gate7b-s20b/scope-boundary/gate7b-s20b.json
          python scripts/review_dependency_diff.py a9e368a2f09dcfb4565f4bc392e4f77d5c664805 "$(git rev-parse HEAD)" > artifacts/t2/gate7b-s20b/scope-boundary/dependency-diff.json
          test "$(git diff --name-only a9e368a2f09dcfb4565f4bc392e4f77d5c664805 -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
          test "$(git diff --name-only a9e368a2f09dcfb4565f4bc392e4f77d5c664805 | grep -E '/db/migration/|local_database/migrations/' | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7b-s20b-scope-boundary
          path: artifacts/t2/gate7b-s20b/scope-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-s20b-governance-ubuntu, path: artifacts/t2/gate7b-s20b/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-s20b-governance-windows, path: artifacts/t2/gate7b-s20b/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-s20b-scope-boundary, path: artifacts/t2/gate7b-s20b/scope-boundary }
      - name: Build immutable Gate 7B S20-B evidence index
        run: python scripts/build_t2_gate7b_s20b_evidence.py --bundle-dir artifacts/t2/gate7b-s20b --output artifacts/t2/gate7b-s20b/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7b-s20b-evidence-index
          path: artifacts/t2/gate7b-s20b/evidence-index.json
          if-no-files-found: error
          retention-days: 90
