name: G9A R3D All 26 Pages Joint Acceptance Prep

on:
  push:
    branches: ["t2/gate9b-sprint27f-g9a-r3d-prep"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-g9a-r3d-prep.yml"
      - "contracts/t2/gate9b-r3d-prep/**"
      - "docs/governance/**"
      - "docs/t2-gate9b-r3d-prep/**"
      - "scripts/*g9a_r3d*"

permissions:
  contents: read

concurrency:
  group: g9a-r3d-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate governance and 26-page source closure
        run: |
          mkdir -p artifacts/t2/g9a-r3d-prep/governance-ubuntu/joint-audit
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3d_prep.py scripts/audit_t2_g9a_r3d_joint_pages.py scripts/build_t2_g9a_r3d_prep_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3d-prep/governance-ubuntu/g9a-r1-regression.json
          python scripts/check_t2_g9a_r3d_prep.py | tee artifacts/t2/g9a-r3d-prep/governance-ubuntu/scope.txt
          python scripts/audit_t2_g9a_r3d_joint_pages.py --output-dir artifacts/t2/g9a-r3d-prep/governance-ubuntu/joint-audit
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3d-prep-governance-ubuntu, path: artifacts/t2/g9a-r3d-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 and cross-platform joint audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/g9a-r3d-prep/governance-windows/joint-audit | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3d_prep.py scripts/audit_t2_g9a_r3d_joint_pages.py scripts/build_t2_g9a_r3d_prep_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3d-prep/governance-windows/g9a-r1-regression.json
          python scripts/check_t2_g9a_r3d_prep.py | Tee-Object artifacts/t2/g9a-r3d-prep/governance-windows/scope.txt
          python scripts/audit_t2_g9a_r3d_joint_pages.py --output-dir artifacts/t2/g9a-r3d-prep/governance-windows/joint-audit
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3d-prep-governance-windows, path: artifacts/t2/g9a-r3d-prep/governance-windows, if-no-files-found: error, retention-days: 30 }

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce preparation-only diff and dependency immutability
        run: |
          mkdir -p artifacts/t2/g9a-r3d-prep/scope-integrity
          python scripts/check_t2_g9a_r3d_prep.py | tee artifacts/t2/g9a-r3d-prep/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py f5909b6094d004e4320d3afaa1dce7a1f170485b "$(git rev-parse HEAD)" > artifacts/t2/g9a-r3d-prep/scope-integrity/dependency-diff.json
          test "$(git diff --name-only f5909b6094d004e4320d3afaa1dce7a1f170485b HEAD -- server admin-web pos-flutter packages infra infrastructure | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3d-prep-scope-integrity, path: artifacts/t2/g9a-r3d-prep/scope-integrity, if-no-files-found: error, retention-days: 30 }

  web-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Re-run 20-page interaction baseline and full Web quality gates
        run: |
          mkdir -p artifacts/t2/g9a-r3d-prep/web-baseline
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/g9a-r3d-prep/web-baseline/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/g9a-r3d-prep/web-baseline/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/g9a-r3d-prep/web-baseline/dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3d-prep-web-baseline, path: artifacts/t2/g9a-r3d-prep/web-baseline, if-no-files-found: error, retention-days: 30 }

  flutter-baseline:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Re-run six-page Widget baseline and full Flutter quality gates
        shell: bash
        working-directory: pos-flutter
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage 2>&1 | tee ../flutter-tests.jsonl
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter baseline evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/g9a-r3d-prep/flutter
          cp flutter-tests.jsonl flutter-dependencies.json artifacts/t2/g9a-r3d-prep/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/g9a-r3d-prep/flutter/
          sha256sum pos-flutter/coverage/lcov.info > artifacts/t2/g9a-r3d-prep/flutter/lcov.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-g9a-r3d-prep-flutter-${{ matrix.os }}", path: artifacts/t2/g9a-r3d-prep/flutter, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-integrity, web-baseline, flutter-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-g9a-r3d-prep-*, path: downloaded, merge-multiple: false }
      - name: Normalize producers and build evidence index
        run: |
          mkdir -p artifacts/t2/g9a-r3d-prep/bundle artifacts/t2/g9a-r3d-prep/final
          for pair in \
            "governance-ubuntu:t2-g9a-r3d-prep-governance-ubuntu" \
            "governance-windows:t2-g9a-r3d-prep-governance-windows" \
            "scope-integrity:t2-g9a-r3d-prep-scope-integrity" \
            "web-baseline:t2-g9a-r3d-prep-web-baseline" \
            "flutter-ubuntu:t2-g9a-r3d-prep-flutter-ubuntu-latest" \
            "flutter-windows:t2-g9a-r3d-prep-flutter-windows-latest"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/g9a-r3d-prep/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/g9a-r3d-prep/bundle/$producer/"
          done
          python scripts/build_t2_g9a_r3d_prep_evidence.py --bundle-dir artifacts/t2/g9a-r3d-prep/bundle --output artifacts/t2/g9a-r3d-prep/final/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3d-prep-evidence-index, path: artifacts/t2/g9a-r3d-prep/final, if-no-files-found: error, retention-days: 90 }
