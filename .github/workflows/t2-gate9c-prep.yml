name: T2 Gate 9C Prep Internal Product Completeness Final Review

on:
  push:
    branches: ["t2/gate9c-prep-v1-product-completeness"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate9c-prep.yml"
      - "contracts/t2/gate9c-prep/**"
      - "docs/governance/**"
      - "docs/t2-gate9c-prep/**"
      - "scripts/*gate9c*"

permissions:
  contents: read

concurrency:
  group: gate9c-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate Gate 9C current-state governance and completeness audit
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-prep/governance-ubuntu/product-review
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9c_prep.py scripts/audit_t2_gate9c_product_completeness.py scripts/build_t2_gate9c_prep_evidence.py
          python scripts/check_t2_gate9c_prep.py | tee artifacts/t2/gate9c-prep/governance-ubuntu/scope.txt
          python scripts/audit_t2_gate9c_product_completeness.py --output-dir artifacts/t2/gate9c-prep/governance-ubuntu/product-review
          python scripts/audit_t2_g9a_r2_convergence.py --output artifacts/t2/gate9c-prep/governance-ubuntu/r2-assembly.json
          python scripts/audit_t2_g9a_r3d_joint_pages.py --output-dir artifacts/t2/gate9c-prep/governance-ubuntu/r3d-pages
          python scripts/audit_t2_g9a_r4_formal_stack.py --output artifacts/t2/gate9c-prep/governance-ubuntu/r4-stack.json --owner-csv artifacts/t2/gate9c-prep/governance-ubuntu/r4-owners.csv
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate9c-prep/governance-ubuntu/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-governance-ubuntu, path: artifacts/t2/gate9c-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 and current-state audit determinism
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-prep/governance-windows/product-review
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9c_prep.py scripts/audit_t2_gate9c_product_completeness.py scripts/build_t2_gate9c_prep_evidence.py
          python scripts/check_t2_gate9c_prep.py | tee artifacts/t2/gate9c-prep/governance-windows/scope.txt
          python scripts/audit_t2_gate9c_product_completeness.py --output-dir artifacts/t2/gate9c-prep/governance-windows/product-review
          python scripts/audit_t2_g9a_r2_convergence.py --output artifacts/t2/gate9c-prep/governance-windows/r2-assembly.json
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate9c-prep/governance-windows/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-governance-windows, path: artifacts/t2/gate9c-prep/governance-windows, if-no-files-found: error, retention-days: 30 }

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Prove preparation-only diff and zero runtime dependency migration change
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-prep/scope-integrity
          python scripts/check_t2_gate9c_prep.py | tee artifacts/t2/gate9c-prep/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py 1e5807691df9f857fc5fc223244e1e97d5363174 "$(git rev-parse HEAD)" > artifacts/t2/gate9c-prep/scope-integrity/dependency-diff.json
          test "$(git diff --name-only 1e5807691df9f857fc5fc223244e1e97d5363174 HEAD -- server admin-web pos-flutter packages infra infrastructure | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-scope-integrity, path: artifacts/t2/gate9c-prep/scope-integrity, if-no-files-found: error, retention-days: 30 }

  server-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Re-run modular-monolith tests package and supply-chain baseline
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Collect server baseline
        run: |
          mkdir -p artifacts/t2/gate9c-prep/server-baseline
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate9c-prep/server-baseline/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate9c-prep/server-baseline/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-server-baseline, path: artifacts/t2/gate9c-prep/server-baseline, if-no-files-found: error, retention-days: 30 }

  web-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Re-run Web production and 20-page interaction baseline
        run: |
          mkdir -p artifacts/t2/gate9c-prep/web-baseline
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/gate9c-prep/web-baseline/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/gate9c-prep/web-baseline/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/gate9c-prep/web-baseline/dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-web-baseline, path: artifacts/t2/gate9c-prep/web-baseline, if-no-files-found: error, retention-days: 30 }

  flutter-baseline:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Re-run Flutter format analyze Widget SQLite and supply-chain baseline
        shell: bash
        working-directory: pos-flutter
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage 2>&1 | tee ../flutter-tests.jsonl
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter baseline
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate9c-prep/flutter
          cp flutter-tests.jsonl flutter-dependencies.json artifacts/t2/gate9c-prep/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/gate9c-prep/flutter/
          sha256sum pos-flutter/coverage/lcov.info > artifacts/t2/gate9c-prep/flutter/lcov.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-gate9c-prep-flutter-${{ matrix.os }}", path: artifacts/t2/gate9c-prep/flutter, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-integrity, server-baseline, web-baseline, flutter-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate9c-prep-*, path: downloaded, merge-multiple: false }
      - name: Build Gate 9C evidence index
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-prep/bundle artifacts/t2/gate9c-prep/final
          for pair in \
            "governance-ubuntu:t2-gate9c-prep-governance-ubuntu" \
            "governance-windows:t2-gate9c-prep-governance-windows" \
            "scope-integrity:t2-gate9c-prep-scope-integrity" \
            "server-baseline:t2-gate9c-prep-server-baseline" \
            "web-baseline:t2-gate9c-prep-web-baseline" \
            "flutter-ubuntu:t2-gate9c-prep-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate9c-prep-flutter-windows-latest"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate9c-prep/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/gate9c-prep/bundle/$producer/"
          done
          python scripts/build_t2_gate9c_prep_evidence.py --bundle-dir artifacts/t2/gate9c-prep/bundle --output artifacts/t2/gate9c-prep/final/evidence-index.json --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate9c-prep-evidence-index, path: artifacts/t2/gate9c-prep/final, if-no-files-found: error, retention-days: 90 }
