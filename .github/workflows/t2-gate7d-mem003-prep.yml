name: T2 Gate 7D S22-A MEM-003 CR Prep

on:
  push:
    branches: ["t2/gate7d-sprint22a-mem003-prep"]
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/t2-gate7d-mem003-prep.yml"
      - "contracts/t2/gate7d-exc001/exc001-admission.json"
      - "contracts/t2/gate7d-mem003-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate7d-exc001/**"
      - "docs/t2-gate7d-mem003-prep/**"
      - "scripts/check_t2_gate7d_exc001.py"
      - "scripts/check_t2_gate7d_mem003_prep.py"
      - "scripts/build_t2_gate7d_mem003_prep_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-gate7d-mem003-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Validate RTM CR ADR contracts and preparation boundary
        run: |
          mkdir -p artifacts/t2/gate7d-mem003-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7d_mem003_prep.py scripts/build_t2_gate7d_mem003_prep_evidence.py
          python scripts/check_t2_gate7d_mem003_prep.py --output artifacts/t2/gate7d-mem003-prep/governance-ubuntu/mem003-prep-gate.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7d-mem003-prep-governance-ubuntu
          path: artifacts/t2/gate7d-mem003-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Validate UTF-8 governance and contracts on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate7d-mem003-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7d_mem003_prep.py scripts/build_t2_gate7d_mem003_prep_evidence.py
          python scripts/check_t2_gate7d_mem003_prep.py --output artifacts/t2/gate7d-mem003-prep/governance-windows/mem003-prep-gate.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7d-mem003-prep-governance-windows
          path: artifacts/t2/gate7d-mem003-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  scope-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Enforce no runtime migration dependency or external implementation
        run: |
          mkdir -p artifacts/t2/gate7d-mem003-prep/scope-boundary
          python scripts/check_t2_gate7d_mem003_prep.py --output artifacts/t2/gate7d-mem003-prep/scope-boundary/mem003-prep-gate.json
          python scripts/review_dependency_diff.py 39a72c65a08899f305ee0c04a5e337e1ee9ffbc9 "$(git rev-parse HEAD)" > artifacts/t2/gate7d-mem003-prep/scope-boundary/dependency-diff.json
          test "$(git diff --name-only 39a72c65a08899f305ee0c04a5e337e1ee9ffbc9 -- server admin-web pos-flutter infrastructure infra packages | wc -l)" -eq 0
          test "$(git diff --name-only 39a72c65a08899f305ee0c04a5e337e1ee9ffbc9 | grep -E '/db/migration/|local_database/migrations/' | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7d-mem003-prep-scope-boundary
          path: artifacts/t2/gate7d-mem003-prep/scope-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: t2-gate7d-mem003-prep-governance-ubuntu, path: artifacts/t2/gate7d-mem003-prep/governance-ubuntu}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: t2-gate7d-mem003-prep-governance-windows, path: artifacts/t2/gate7d-mem003-prep/governance-windows}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: t2-gate7d-mem003-prep-scope-boundary, path: artifacts/t2/gate7d-mem003-prep/scope-boundary}
      - name: Build immutable preparation evidence index
        run: python scripts/build_t2_gate7d_mem003_prep_evidence.py --bundle-dir artifacts/t2/gate7d-mem003-prep --output artifacts/t2/gate7d-mem003-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7d-mem003-prep-evidence-index
          path: artifacts/t2/gate7d-mem003-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 90
