name: T2 Gate 9C Internal Product Completeness Seal

on:
  push:
    branches: ["t2/gate9c-internal-product-completeness-seal"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate9c-seal.yml"
      - "contracts/t2/gate9c/**"
      - "docs/governance/**"
      - "docs/t2-gate9c/**"
      - "scripts/*gate9c*"

permissions:
  contents: read

concurrency:
  group: gate9c-seal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate Gate 9C seal governance and machine Go No-Go
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-seal/governance-ubuntu/seal-review
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9c_seal.py scripts/audit_t2_gate9c_seal.py scripts/build_t2_gate9c_seal_evidence.py
          python scripts/check_t2_gate9c_seal.py | tee artifacts/t2/gate9c-seal/governance-ubuntu/scope.txt
          python scripts/audit_t2_gate9c_seal.py --output-dir artifacts/t2/gate9c-seal/governance-ubuntu/seal-review
          python scripts/audit_t2_g9a_r2_convergence.py --output artifacts/t2/gate9c-seal/governance-ubuntu/r2-assembly.json
          python scripts/audit_t2_g9a_r3d_joint_pages.py --output-dir artifacts/t2/gate9c-seal/governance-ubuntu/r3d-pages
          python scripts/audit_t2_g9a_r4_formal_stack.py --output artifacts/t2/gate9c-seal/governance-ubuntu/r4-stack.json --owner-csv artifacts/t2/gate9c-seal/governance-ubuntu/r4-owners.csv
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate9c-seal/governance-ubuntu/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-governance-ubuntu, path: artifacts/t2/gate9c-seal/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 and Gate 9C seal determinism
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-seal/governance-windows/seal-review
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9c_seal.py scripts/audit_t2_gate9c_seal.py scripts/build_t2_gate9c_seal_evidence.py
          python scripts/check_t2_gate9c_seal.py | tee artifacts/t2/gate9c-seal/governance-windows/scope.txt
          python scripts/audit_t2_gate9c_seal.py --output-dir artifacts/t2/gate9c-seal/governance-windows/seal-review
          python scripts/audit_t2_g9a_r2_convergence.py --output artifacts/t2/gate9c-seal/governance-windows/r2-assembly.json
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate9c-seal/governance-windows/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-governance-windows, path: artifacts/t2/gate9c-seal/governance-windows, if-no-files-found: error, retention-days: 30 }

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Prove seal-only diff and zero runtime dependency migration change
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-seal/scope-integrity
          python scripts/check_t2_gate9c_seal.py | tee artifacts/t2/gate9c-seal/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py 04869b4d983bdea285b758feee08def7a5652dc2 "$(git rev-parse HEAD)" > artifacts/t2/gate9c-seal/scope-integrity/dependency-diff.json
          test "$(git diff --name-only 04869b4d983bdea285b758feee08def7a5652dc2 HEAD -- server admin-web pos-flutter packages infra infrastructure | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-scope-integrity, path: artifacts/t2/gate9c-seal/scope-integrity, if-no-files-found: error, retention-days: 30 }

  server-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Rebuild commercial JAR tests and aggregate SBOM
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Collect server seal baseline
        run: |
          mkdir -p artifacts/t2/gate9c-seal/server-baseline
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate9c-seal/server-baseline/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate9c-seal/server-baseline/ \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-server-baseline, path: artifacts/t2/gate9c-seal/server-baseline, if-no-files-found: error, retention-days: 30 }

  web-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Rebuild Web production and 20-page baseline
        run: |
          mkdir -p artifacts/t2/gate9c-seal/web-baseline
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/gate9c-seal/web-baseline/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/gate9c-seal/web-baseline/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/gate9c-seal/web-baseline/dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-web-baseline, path: artifacts/t2/gate9c-seal/web-baseline, if-no-files-found: error, retention-days: 30 }

  flutter-baseline:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Re-run Flutter format analyze Widget SQLite and supply chain
        shell: bash
        working-directory: pos-flutter
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage 2>&1 | tee ../flutter-tests.jsonl
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter seal baseline
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate9c-seal/flutter
          cp flutter-tests.jsonl flutter-dependencies.json artifacts/t2/gate9c-seal/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/gate9c-seal/flutter/
          sha256sum pos-flutter/coverage/lcov.info > artifacts/t2/gate9c-seal/flutter/lcov.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "t2-gate9c-seal-flutter-${{ matrix.os }}", path: artifacts/t2/gate9c-seal/flutter, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-integrity, server-baseline, web-baseline, flutter-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate9c-seal-*, path: downloaded, merge-multiple: false }
      - name: Build Gate 9C seal evidence index
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/gate9c-seal/bundle artifacts/t2/gate9c-seal/final
          for pair in \
            "governance-ubuntu:t2-gate9c-seal-governance-ubuntu" \
            "governance-windows:t2-gate9c-seal-governance-windows" \
            "scope-integrity:t2-gate9c-seal-scope-integrity" \
            "server-baseline:t2-gate9c-seal-server-baseline" \
            "web-baseline:t2-gate9c-seal-web-baseline" \
            "flutter-ubuntu:t2-gate9c-seal-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate9c-seal-flutter-windows-latest"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate9c-seal/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/gate9c-seal/bundle/$producer/"
          done
          python scripts/build_t2_gate9c_seal_evidence.py --bundle-dir artifacts/t2/gate9c-seal/bundle --output artifacts/t2/gate9c-seal/final/evidence-index.json --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate9c-seal-evidence-index, path: artifacts/t2/gate9c-seal/final, if-no-files-found: error, retention-days: 90 }
