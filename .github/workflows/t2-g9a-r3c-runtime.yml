name: T2 Gate 9B G9A R3C Reporting Terminal Commercial POS Auxiliary UI Repair

on:
  push:
    branches: ["t2/gate9b-sprint27e-g9a-r3c-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-g9a-r3c-runtime.yml"
      - "contracts/t2/gate9b-r3c-runtime/**"
      - "docs/**"
      - "scripts/*g9a_r3c_runtime*"
      - "admin-web/src/api/terminal/index.ts"
      - "admin-web/src/composables/**"
      - "admin-web/src/views/g9a-r3c/**"
      - "admin-web/src/views/reporting/operation/index.vue"
      - "admin-web/src/views/saas/operations/index.vue"
      - "admin-web/src/views/service/operations/index.vue"
      - "admin-web/src/views/subscription/operations/index.vue"
      - "admin-web/src/views/terminal/registry/index.vue"
      - "pos-flutter/lib/features/exchange/presentation/pos_exchange_page.dart"
      - "pos-flutter/lib/features/session/presentation/pos_session_shell.dart"
      - "pos-flutter/lib/features/shift/presentation/pos_cash_management_page.dart"
      - "pos-flutter/test/gate6e/pos_return_page_test.dart"
      - "pos-flutter/test/gate7b/exchange_runtime_test.dart"
      - "pos-flutter/test/gate9b/g9a_r3c_cash_management_page_test.dart"

permissions:
  contents: read

concurrency:
  group: g9a-r3c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate authorized eight-surface runtime scope
        run: |
          mkdir -p artifacts/t2/g9a-r3c/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3c_runtime.py scripts/build_t2_g9a_r3c_runtime_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3c/governance-ubuntu/api-regression.json
          python scripts/check_t2_g9a_r3c_runtime.py | tee artifacts/t2/g9a-r3c/governance-ubuntu/scope.txt
          python scripts/review_dependency_diff.py 35cc22316faf5389844dfeeee3dfa840ce06cdf8 "$(git rev-parse HEAD)" > artifacts/t2/g9a-r3c/governance-ubuntu/dependency-diff.json
          git diff --check 35cc22316faf5389844dfeeee3dfa840ce06cdf8 HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-governance-ubuntu, path: artifacts/t2/g9a-r3c/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and scope on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/g9a-r3c/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3c_runtime.py scripts/build_t2_g9a_r3c_runtime_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3c/governance-windows/api-regression.json
          python scripts/check_t2_g9a_r3c_runtime.py | Tee-Object artifacts/t2/g9a-r3c/governance-windows/scope.txt
          git diff --check 35cc22316faf5389844dfeeee3dfa840ce06cdf8 HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-governance-windows, path: artifacts/t2/g9a-r3c/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute modular-monolith regression and generate SBOM
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Collect server test coverage SBOM and license evidence
        run: |
          mkdir -p artifacts/t2/g9a-r3c/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/g9a-r3c/server/license-policy.txt
          cp server/target/bom.json artifacts/t2/g9a-r3c/server/server-cyclonedx.json
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/g9a-r3c/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/g9a-r3c/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-server, path: artifacts/t2/g9a-r3c/server, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck and execute authorized page interaction tests
        run: |
          mkdir -p artifacts/t2/g9a-r3c/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/g9a-r3c/web/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/g9a-r3c/web/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/g9a-r3c/web/dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-web, path: artifacts/t2/g9a-r3c/web, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Execute Flutter analysis tests coverage and supply chain
        working-directory: pos-flutter
        shell: bash
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage 2>&1 | tee ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/g9a-r3c/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/g9a-r3c/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/g9a-r3c/flutter/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-g9a-r3c-flutter-${{ matrix.os }}", path: artifacts/t2/g9a-r3c/flutter, if-no-files-found: error, retention-days: 30 }

  android-database:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_g9a_r3c_root, MYSQL_DATABASE: jshpos_g9a_r3c }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_g9a_r3c_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_g9a_r3c?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_g9a_r3c_root
      GATE8C_MIGRATION_ROOT: ${{ github.workspace }}/server/ruoyi-modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Validate MySQL SQLite Kotlin and Android regression
        run: |
          mkdir -p artifacts/t2/g9a-r3c/android-database
          cd server
          ./mvnw -pl ruoyi-modules/jshpos-release -am test -Dtest=ReleaseMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          cd ../pos-flutter
          flutter pub get --enforce-lockfile
          flutter test test/gate6g/data_migration_recovery_test.dart --machine > ../artifacts/t2/g9a-r3c/android-database/sqlite-migration-tests.jsonl
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > ../artifacts/t2/g9a-r3c/android-database/app-debug.apk.sha256
          cd ..
          test -z "$(git diff --name-only 35cc22316faf5389844dfeeee3dfa840ce06cdf8 HEAD -- server/ruoyi-modules pos-flutter/lib/infrastructure/local_database | grep -E '(/db/migration/|^pos-flutter/lib/infrastructure/local_database/)' || true)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-android-database, path: artifacts/t2/g9a-r3c/android-database, if-no-files-found: error, retention-days: 30 }

  security:
    needs: [server, web, flutter, android-database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce Secret PII dependency workflow and external-boundary checks
        run: |
          mkdir -p artifacts/t2/g9a-r3c/security
          python scripts/review_dependency_diff.py 35cc22316faf5389844dfeeee3dfa840ce06cdf8 "$(git rev-parse HEAD)" > artifacts/t2/g9a-r3c/security/dependency-diff.json
          python scripts/check_t2_g9a_r3c_runtime.py | tee artifacts/t2/g9a-r3c/security/scope.txt
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/g9a-r3c/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/g9a-r3c/security/trivy-config.json .github/workflows/t2-g9a-r3c-runtime.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-security, path: artifacts/t2/g9a-r3c/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, web, flutter, android-database, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-g9a-r3c-*, path: downloaded, merge-multiple: false }
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/g9a-r3c/bundle artifacts/t2/g9a-r3c/final
          for pair in \
            "governance-ubuntu:t2-g9a-r3c-governance-ubuntu" \
            "governance-windows:t2-g9a-r3c-governance-windows" \
            "server:t2-g9a-r3c-server" \
            "web:t2-g9a-r3c-web" \
            "flutter-ubuntu:t2-g9a-r3c-flutter-ubuntu-latest" \
            "flutter-windows:t2-g9a-r3c-flutter-windows-latest" \
            "android-database:t2-g9a-r3c-android-database" \
            "security:t2-g9a-r3c-security"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/g9a-r3c/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/g9a-r3c/bundle/$producer/"
          done
          python scripts/build_t2_g9a_r3c_runtime_evidence.py --bundle-dir artifacts/t2/g9a-r3c/bundle --output artifacts/t2/g9a-r3c/final/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-g9a-r3c-evidence-index, path: artifacts/t2/g9a-r3c/final, if-no-files-found: error, retention-days: 90 }
