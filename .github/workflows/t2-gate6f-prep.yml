name: T2 Gate 6F External P0 and Full Alpha UAT Prep

on:
  push:
    branches: ["t2/gate6f-external-p0-uat-prep-20260821"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6f-prep.yml"
      - "contracts/t2/gate6e/gate6e-admission.json"
      - "contracts/t2/gate6f-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6e/README.md"
      - "docs/t2-gate6f-prep/**"
      - "scripts/check_t2_gate6e.py"
      - "scripts/*gate6f_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate6f-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate accepted Gate 6E and Gate 6F offline admission
        run: |
          mkdir -p artifacts/t2/gate6f-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6e.py --output artifacts/t2/gate6f-prep/governance-ubuntu/gate6e-accepted-boundary.json
          python scripts/check_t2_gate6f_prep.py --output artifacts/t2/gate6f-prep/governance-ubuntu/gate6f-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6f-prep-governance-ubuntu
          path: artifacts/t2/gate6f-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 RTM contracts and evidence boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6f-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6f_prep.py --output artifacts/t2/gate6f-prep/governance-windows/gate6f-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6f-prep-governance-windows
          path: artifacts/t2/gate6f-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce no runtime dependency secret or external execution expansion
        run: |
          mkdir -p artifacts/t2/gate6f-prep/offline-boundary
          python scripts/check_t2_gate6f_prep.py --output artifacts/t2/gate6f-prep/offline-boundary/scope-status-secret.json
          python scripts/review_dependency_diff.py 0dd20e90c32914da48b3154f0bf1781ab8f2ba71 "$(git rev-parse HEAD)" > artifacts/t2/gate6f-prep/offline-boundary/dependency-diff.json
          test "$(git diff --name-only 0dd20e90c32914da48b3154f0bf1781ab8f2ba71 -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6f-prep-offline-boundary
          path: artifacts/t2/gate6f-prep/offline-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, offline-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6f-prep-governance-ubuntu, path: artifacts/t2/gate6f-prep/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6f-prep-governance-windows, path: artifacts/t2/gate6f-prep/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6f-prep-offline-boundary, path: artifacts/t2/gate6f-prep/offline-boundary }
      - name: Build immutable evidence index
        run: python scripts/build_t2_gate6f_prep_evidence.py --bundle-dir artifacts/t2/gate6f-prep --output artifacts/t2/gate6f-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6f-prep-evidence-index
          path: artifacts/t2/gate6f-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 30
