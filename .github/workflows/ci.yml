name: T0 Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_t0_structure.py
      - run: python scripts/check_rtm.py
      - run: python scripts/check_contracts.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test server
        working-directory: server
        run: ./mvnw -DskipTests=false clean verify
      - name: Generate server SBOM
        working-directory: server
        run: ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-cyclonedx-sbom
          path: |
            server/target/bom.json
            server/target/bom.xml
          retention-days: 14

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: admin-web
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        working-directory: admin-web
        run: pnpm audit --registry https://registry.npmjs.org --audit-level high
      - name: Generate frontend license inventory
        working-directory: admin-web
        run: pnpm licenses list --json > dependency-licenses.json
      - name: Enforce frontend license policy
        working-directory: admin-web
        run: |
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - name: Production build and generate declarations
        working-directory: admin-web
        run: pnpm build:prod
      - name: Lint
        working-directory: admin-web
        run: pnpm lint:eslint
      - name: Type check
        working-directory: admin-web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: admin-web
        run: pnpm test:unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-web-license-inventory
          path: admin-web/dependency-licenses.json
          retention-days: 14

  flutter-pos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve locked device-adapter dependencies
        working-directory: packages/pos_device_adapter
        run: flutter pub get --enforce-lockfile
      - name: Analyze device adapter
        working-directory: packages/pos_device_adapter
        run: flutter analyze --fatal-infos
      - name: Test device adapter
        working-directory: packages/pos_device_adapter
        run: flutter test
      - name: Resolve locked POS dependencies
        working-directory: pos-flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: pos-flutter
        run: flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: pos-flutter
        run: flutter test
      - name: Kotlin and Android unit tests
        working-directory: pos-flutter/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Android debug build
        working-directory: pos-flutter
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pos-debug-apk
          path: pos-flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose
        working-directory: infra/compose
        run: cp .env.example .env && docker compose --env-file .env config --quiet

  supply-chain:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-cyclonedx-sbom
          path: server/target
      - name: Verify tested SBOM input
        run: |
          test -s server/target/bom.json
          test -s server/target/bom.xml
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Scan SBOM vulnerabilities
        run: |
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 server/target/bom.json
      - name: Enforce SBOM license policy
        run: |
          # Trivy supports standard package-license scanning for SBOM targets;
          # full-text license classification is only available to image/fs/repo targets.
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json
          ignored_licenses="$(python -c 'import json; print(",".join(json.load(open("docs/compliance/reviewed-license-allowlist.json", encoding="utf-8"))["trivy_ignored_licenses"]))')"
          /tmp/trivy sbom --skip-version-check --scanners license --severity HIGH,CRITICAL --exit-code 1 --ignored-licenses "$ignored_licenses" server/target/bom.json
      - name: Scan non-Maven repository dependencies
        run: |
          # Maven dependencies are scanned from the aggregate SBOM above. Excluding
          # server here prevents a duplicate POM resolution from depending on
          # Maven Central rate limits while preserving all dependency coverage.
          /tmp/trivy fs --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --skip-dirs server .
      - name: Scan repository secrets
        run: |
          # Secret rules need file contents, not remote dependency metadata.
          # Offline mode keeps the full-repository walk while preventing Maven
          # analyzers from issuing unrelated repository requests.
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git .
      - name: Scan infrastructure as code
        run: |
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-sbom
          path: |
            server/target/bom.json
            server/target/bom.xml
          retention-days: 14
