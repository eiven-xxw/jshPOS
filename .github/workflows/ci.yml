name: T0 Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_t0_structure.py
      - run: python scripts/check_rtm.py
      - run: python scripts/check_contracts.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test server
        working-directory: server
        run: ./mvnw -DskipTests=false clean verify
      - name: Generate server SBOM
        working-directory: server
        run: ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-cyclonedx-sbom
          path: |
            server/target/bom.json
            server/target/bom.xml
          retention-days: 14

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: admin-web
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        working-directory: admin-web
        run: pnpm audit --registry https://registry.npmjs.org --audit-level high
      - name: Generate frontend license inventory
        working-directory: admin-web
        run: pnpm licenses list --json > dependency-licenses.json
      - name: Lint
        working-directory: admin-web
        run: pnpm lint:eslint
      - name: Type check
        working-directory: admin-web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: admin-web
        run: pnpm test:unit
      - name: Production build
        working-directory: admin-web
        run: pnpm build:prod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-web-license-inventory
          path: admin-web/dependency-licenses.json
          retention-days: 14

  flutter-pos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve locked device-adapter dependencies
        working-directory: packages/pos_device_adapter
        run: flutter pub get --enforce-lockfile
      - name: Analyze device adapter
        working-directory: packages/pos_device_adapter
        run: flutter analyze --fatal-infos
      - name: Test device adapter
        working-directory: packages/pos_device_adapter
        run: flutter test
      - name: Resolve locked POS dependencies
        working-directory: pos-flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: pos-flutter
        run: flutter analyze --fatal-infos
      - name: Unit tests
        working-directory: pos-flutter
        run: flutter test
      - name: Android debug build
        working-directory: pos-flutter
        run: flutter build apk --debug

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose
        working-directory: infra/compose
        run: cp .env.example .env && docker compose --env-file .env config --quiet
