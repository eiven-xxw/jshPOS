name: T2 Gate 8A Commercial SaaS Operations Prep

on:
  push:
    branches: ["t2/gate8a-prep-commercial-operations"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8a-prep.yml"
      - "contracts/t2/gate8a-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate8a-prep/**"
      - "scripts/*gate8a_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate8a-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate governance RTM contracts and CR admission
        run: |
          mkdir -p artifacts/t2/gate8a-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8a_prep.py scripts/build_t2_gate8a_prep_evidence.py
          python scripts/check_t2_gate8a_prep.py --output artifacts/t2/gate8a-prep/governance-ubuntu/gate8a-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate8a-prep-governance-ubuntu
          path: artifacts/t2/gate8a-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and zero-runtime boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8a-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8a_prep.py scripts/build_t2_gate8a_prep_evidence.py
          python scripts/check_t2_gate8a_prep.py --output artifacts/t2/gate8a-prep/governance-windows/gate8a-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate8a-prep-governance-windows
          path: artifacts/t2/gate8a-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  scope-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce runtime migration dependency secret and state boundaries
        run: |
          mkdir -p artifacts/t2/gate8a-prep/scope-boundary
          python scripts/check_t2_gate8a_prep.py --output artifacts/t2/gate8a-prep/scope-boundary/scope-secret-state.json
          python scripts/review_dependency_diff.py b47533eba707d486abe44dbf70ec7b651081b3af "$(git rev-parse HEAD)" > artifacts/t2/gate8a-prep/scope-boundary/dependency-diff.json
          test "$(git diff --name-only b47533eba707d486abe44dbf70ec7b651081b3af -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
          test "$(git diff --name-only b47533eba707d486abe44dbf70ec7b651081b3af | grep -Ei '(^|/)(db/migration|migrations?)/' | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate8a-prep-scope-boundary
          path: artifacts/t2/gate8a-prep/scope-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8a-prep-governance-ubuntu, path: artifacts/t2/gate8a-prep/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8a-prep-governance-windows, path: artifacts/t2/gate8a-prep/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8a-prep-scope-boundary, path: artifacts/t2/gate8a-prep/scope-boundary }
      - name: Build immutable Gate 8A-Prep evidence index
        run: python scripts/build_t2_gate8a_prep_evidence.py --bundle-dir artifacts/t2/gate8a-prep --output artifacts/t2/gate8a-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate8a-prep-evidence-index
          path: artifacts/t2/gate8a-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 90
