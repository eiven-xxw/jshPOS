name: T2 Gate 9B G9A R3B Owner Operations UI Repair

on:
  push:
    branches: ["t2/gate9b-sprint27d-g9a-r3b-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-g9a-r3b-runtime.yml"
      - "contracts/t2/gate9b-r3b-runtime/**"
      - "docs/**"
      - "scripts/*g9a_r3b_runtime*"
      - "admin-web/src/views/operations/**"

permissions:
  contents: read

concurrency:
  group: g9a-r3b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate authorized eleven-surface runtime scope
        run: |
          mkdir -p artifacts/t2/g9a-r3b/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3b_runtime.py scripts/build_t2_g9a_r3b_runtime_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3b/governance-ubuntu/api-regression.json
          python scripts/check_t2_g9a_r3b_runtime.py | tee artifacts/t2/g9a-r3b/governance-ubuntu/scope.txt
          python scripts/review_dependency_diff.py 4e8a9f2b1dd52ce6b198bd3a25328e2a80330a71 "$(git rev-parse HEAD)" > artifacts/t2/g9a-r3b/governance-ubuntu/dependency-diff.json
          git diff --check 4e8a9f2b1dd52ce6b198bd3a25328e2a80330a71 HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-governance-ubuntu, path: artifacts/t2/g9a-r3b/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and scope on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/g9a-r3b/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r3b_runtime.py scripts/build_t2_g9a_r3b_runtime_evidence.py
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r3b/governance-windows/api-regression.json
          python scripts/check_t2_g9a_r3b_runtime.py | Tee-Object artifacts/t2/g9a-r3b/governance-windows/scope.txt
          git diff --check 4e8a9f2b1dd52ce6b198bd3a25328e2a80330a71 HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-governance-windows, path: artifacts/t2/g9a-r3b/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute modular-monolith regression and generate SBOM
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Collect server test coverage SBOM and license evidence
        run: |
          mkdir -p artifacts/t2/g9a-r3b/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/g9a-r3b/server/license-policy.txt
          cp server/target/bom.json artifacts/t2/g9a-r3b/server/server-cyclonedx.json
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/g9a-r3b/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/g9a-r3b/server/ \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-server, path: artifacts/t2/g9a-r3b/server, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck and execute owner-page interaction tests
        run: |
          mkdir -p artifacts/t2/g9a-r3b/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/g9a-r3b/web/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/g9a-r3b/web/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/g9a-r3b/web/dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-web, path: artifacts/t2/g9a-r3b/web, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Execute Flutter analysis tests coverage and supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/g9a-r3b/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/g9a-r3b/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/g9a-r3b/flutter/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "t2-g9a-r3b-flutter-${{ matrix.os }}", path: artifacts/t2/g9a-r3b/flutter, if-no-files-found: error, retention-days: 30 }

  android-database:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_g9a_r3b_root, MYSQL_DATABASE: jshpos_g9a_r3b }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_g9a_r3b_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_g9a_r3b?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_g9a_r3b_root
      GATE8C_MIGRATION_ROOT: ${{ github.workspace }}/server/ruoyi-modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Validate MySQL SQLite Kotlin and Android regression
        run: |
          mkdir -p artifacts/t2/g9a-r3b/android-database
          cd server
          ./mvnw -pl ruoyi-modules/jshpos-release -am test -Dtest=ReleaseMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          cd ../pos-flutter
          flutter pub get --enforce-lockfile
          flutter test test/gate6g/data_migration_recovery_test.dart --machine > ../artifacts/t2/g9a-r3b/android-database/sqlite-migration-tests.jsonl
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > ../artifacts/t2/g9a-r3b/android-database/app-debug.apk.sha256
          cd ..
          test -z "$(git diff --name-only 4e8a9f2b1dd52ce6b198bd3a25328e2a80330a71 HEAD -- server/ruoyi-modules pos-flutter/lib/infrastructure/local_database | grep -E '(/db/migration/|^pos-flutter/lib/infrastructure/local_database/)' || true)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-android-database, path: artifacts/t2/g9a-r3b/android-database, if-no-files-found: error, retention-days: 30 }

  security:
    needs: [server, web, flutter, android-database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce Secret PII dependency workflow and external-boundary checks
        run: |
          mkdir -p artifacts/t2/g9a-r3b/security
          python scripts/review_dependency_diff.py 4e8a9f2b1dd52ce6b198bd3a25328e2a80330a71 "$(git rev-parse HEAD)" > artifacts/t2/g9a-r3b/security/dependency-diff.json
          python scripts/check_t2_g9a_r3b_runtime.py | tee artifacts/t2/g9a-r3b/security/scope.txt
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/g9a-r3b/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/g9a-r3b/security/trivy-config.json .github/workflows/t2-g9a-r3b-runtime.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-security, path: artifacts/t2/g9a-r3b/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, web, flutter, android-database, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-g9a-r3b-*, path: downloaded, merge-multiple: false }
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/g9a-r3b/bundle artifacts/t2/g9a-r3b/final
          for pair in \
            "governance-ubuntu:t2-g9a-r3b-governance-ubuntu" \
            "governance-windows:t2-g9a-r3b-governance-windows" \
            "server:t2-g9a-r3b-server" \
            "web:t2-g9a-r3b-web" \
            "flutter-ubuntu:t2-g9a-r3b-flutter-ubuntu-latest" \
            "flutter-windows:t2-g9a-r3b-flutter-windows-latest" \
            "android-database:t2-g9a-r3b-android-database" \
            "security:t2-g9a-r3b-security"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/g9a-r3b/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/g9a-r3b/bundle/$producer/"
          done
          python scripts/build_t2_g9a_r3b_runtime_evidence.py --bundle-dir artifacts/t2/g9a-r3b/bundle --output artifacts/t2/g9a-r3b/final/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r3b-evidence-index, path: artifacts/t2/g9a-r3b/final, if-no-files-found: error, retention-days: 90 }
