name: G9A R2 Production Assembly Convergence Prep

on:
  push:
    branches: ["t2/gate9b-sprint27b-g9a-r2-prep"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-g9a-r2-prep.yml"
      - "contracts/t2/gate9b/defect-closure-v1.json"
      - "contracts/t2/gate9b-r2-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate9b-r2-prep/**"
      - "scripts/*g9a_r2*"

permissions:
  contents: read

concurrency:
  group: g9a-r2-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Validate governance scope and static assembly baseline
        run: |
          mkdir -p artifacts/t2/g9a-r2-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r2_prep.py scripts/audit_t2_g9a_r2_assembly.py scripts/build_t2_g9a_r2_prep_evidence.py
          python scripts/check_t2_gate9b_api_alignment.py --output artifacts/t2/g9a-r2-prep/governance-ubuntu/g9a-r1-closure-regression.json
          python scripts/check_t2_g9a_r2_prep.py | tee artifacts/t2/g9a-r2-prep/governance-ubuntu/scope.txt
          python scripts/audit_t2_g9a_r2_assembly.py --output artifacts/t2/g9a-r2-prep/governance-ubuntu/assembly-static.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: g9a-r2-prep-governance-ubuntu, path: artifacts/t2/g9a-r2-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30}

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Validate UTF-8 and cross-platform audit semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/g9a-r2-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r2_prep.py scripts/audit_t2_g9a_r2_assembly.py scripts/build_t2_g9a_r2_prep_evidence.py
          python scripts/check_t2_gate9b_api_alignment.py --output artifacts/t2/g9a-r2-prep/governance-windows/g9a-r1-closure-regression.json
          python scripts/check_t2_g9a_r2_prep.py | Tee-Object artifacts/t2/g9a-r2-prep/governance-windows/scope.txt
          python scripts/audit_t2_g9a_r2_assembly.py --output artifacts/t2/g9a-r2-prep/governance-windows/assembly-static.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: g9a-r2-prep-governance-windows, path: artifacts/t2/g9a-r2-prep/governance-windows, if-no-files-found: error, retention-days: 30}

  assembly-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: {version: 10.33.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Rebuild current JAR Web and aggregate SBOM without changing source
        run: |
          mkdir -p artifacts/t2/g9a-r2-prep/assembly-baseline
          cd server
          ./mvnw -pl ruoyi-admin -am package -DskipTests
          ./mvnw -pl ruoyi-admin dependency:tree -Dincludes=org.dromara:ruoyi-demo,org.dromara:ruoyi-generator,org.dromara:ruoyi-workflow,org.dromara:ruoyi-job -DoutputFile=target/g9a-r2-current-dependency-tree.txt
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          cd ../admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm licenses list --json > ../artifacts/t2/g9a-r2-prep/assembly-baseline/web-licenses.json
          cd ..
          python scripts/audit_t2_g9a_r2_assembly.py \
            --server-jar server/ruoyi-admin/target/ruoyi-admin.jar \
            --server-sbom server/target/bom.json \
            --web-dist admin-web/dist \
            --output artifacts/t2/g9a-r2-prep/assembly-baseline/rebuilt-assembly.json
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/g9a-r2-prep/assembly-baseline/server-license-policy.txt
          cp server/ruoyi-admin/target/g9a-r2-current-dependency-tree.txt artifacts/t2/g9a-r2-prep/assembly-baseline/
          sha256sum server/ruoyi-admin/target/ruoyi-admin.jar server/target/bom.json > artifacts/t2/g9a-r2-prep/assembly-baseline/server-artifacts.sha256
          find admin-web/dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/t2/g9a-r2-prep/assembly-baseline/web-dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: g9a-r2-prep-assembly-baseline, path: artifacts/t2/g9a-r2-prep/assembly-baseline, if-no-files-found: error, retention-days: 30}

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Enforce prep-only diff and dependency immutability
        run: |
          mkdir -p artifacts/t2/g9a-r2-prep/scope-integrity
          python scripts/check_t2_g9a_r2_prep.py | tee artifacts/t2/g9a-r2-prep/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py 53e540fd14559e7ae0f907b244b0dbac37167cfe "$(git rev-parse HEAD)" > artifacts/t2/g9a-r2-prep/scope-integrity/dependency-diff.json
          test "$(git diff --name-only 53e540fd14559e7ae0f907b244b0dbac37167cfe HEAD -- server admin-web pos-flutter packages infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: g9a-r2-prep-scope-integrity, path: artifacts/t2/g9a-r2-prep/scope-integrity, if-no-files-found: error, retention-days: 30}

  evidence:
    needs: [governance-ubuntu, governance-windows, assembly-baseline, scope-integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: g9a-r2-prep-*, path: downloaded, merge-multiple: false}
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/g9a-r2-prep/bundle artifacts/t2/g9a-r2-prep/final
          for pair in \
            "governance-ubuntu:g9a-r2-prep-governance-ubuntu" \
            "governance-windows:g9a-r2-prep-governance-windows" \
            "assembly-baseline:g9a-r2-prep-assembly-baseline" \
            "scope-integrity:g9a-r2-prep-scope-integrity"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/g9a-r2-prep/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/g9a-r2-prep/bundle/$producer/"
          done
          python scripts/build_t2_g9a_r2_prep_evidence.py --bundle-dir artifacts/t2/g9a-r2-prep/bundle --output artifacts/t2/g9a-r2-prep/final/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: g9a-r2-prep-evidence-index, path: artifacts/t2/g9a-r2-prep/final, if-no-files-found: error, retention-days: 90}
