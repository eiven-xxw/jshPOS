name: T2 Gate 6G Commercial V1 Core Quality Gates

on:
  push:
    branches: ["t2/gate6g-sprint17-core-productization"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6g.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6g/**"
      - "packages/pos_device_adapter/**"
      - "pos-flutter/**"
      - "scripts/**"
      - "server/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate Gate 6G serial admission contracts and data metadata
        run: |
          mkdir -p artifacts/t2/gate6g/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6g.py --output artifacts/t2/gate6g/governance/gate6g-governance.json
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate6g/governance/core-audit.json
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate6g/governance/api-audit.json
          python scripts/audit_t2_gate6g_data.py --output artifacts/t2/gate6g/governance/data-audit.json
          python scripts/audit_t2_gate6g_integration.py --output artifacts/t2/gate6g/governance/integration-static-audit.json
          python scripts/review_dependency_diff.py a6c91a1d66857583ce7e498541b63bcf0b81dc52 "$(git rev-parse HEAD)" > artifacts/t2/gate6g/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6g-governance, path: artifacts/t2/gate6g/governance, if-no-files-found: error, retention-days: 30 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Execute complete modular-monolith regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Verify formal Owner composition in executable JAR and test evidence
        run: >-
          python scripts/audit_t2_gate6g_integration.py
          --server-jar server/ruoyi-admin/target/ruoyi-admin.jar
          --surefire-root server/ruoyi-modules
          --output artifacts/t2/gate6g/server/integration-runtime-audit.json
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6g-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
            artifacts/t2/gate6g/server
          if-no-files-found: error
          retention-days: 30

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6g_root
          MYSQL_DATABASE: jshpos_gate6g
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6g_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6g?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate6g_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate empty MySQL through V51 metadata guards and repeatability
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-release -am test
          -Dtest=ReleaseMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6g-mysql, path: server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml, if-no-files-found: error, retention-days: 30 }

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test SQLite coverage supply chain Kotlin and Android APK
        run: |
          mkdir -p artifacts/t2/gate6g/pos-linux
          cd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app lib/features/session lib/infrastructure/runtime test/gate6g
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate6g/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_gate2_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate2-coverage.json
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5a-coverage.json
          python scripts/check_flutter_gate5b_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5b-coverage.json
          python scripts/check_flutter_gate5c_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5c-coverage.json
          python scripts/check_flutter_gate6d_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate6d-coverage.json
          python scripts/check_flutter_gate6e_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate6e-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate6g/pos-linux/lcov.info
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate6g/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate6g/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate6g/pos-linux
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate6g/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6g-pos-linux, path: artifacts/t2/gate6g/pos-linux, if-no-files-found: error, retention-days: 30 }

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute clean Windows Flutter regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6g/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app lib/features/session lib/infrastructure/runtime test/gate6g
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate6g/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6g-pos-windows, path: artifacts/t2/gate6g/pos-windows, if-no-files-found: error, retention-days: 30 }

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck component regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6g-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  runtime-stack-smoke:
    needs: [server, admin-web]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6g_runtime_root
          MYSQL_DATABASE: jshpos_gate6g_runtime
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6g_runtime_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-web, path: downloaded/web }
      - name: Start formal Server Web MySQL then execute formal Flutter file-SQLite journey
        run: |
          mkdir -p artifacts/t2/gate6g/runtime-stack
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container"
          test -n "$redis_container"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_gate6g_runtime_root jshpos_gate6g_runtime < server/script/sql/ry_vue_5.X.sql
          docker exec "$redis_container" redis-cli CONFIG SET requirepass synthetic_gate6g_redis_runtime
          docker exec "$redis_container" redis-cli -a synthetic_gate6g_redis_runtime ping
          server_jar="$(find downloaded/server -name ruoyi-admin.jar -type f -print -quit)"
          test -s "$server_jar"
          java -jar "$server_jar" \
            --server.port=18080 \
            --spring.datasource.dynamic.p6spy=false \
            '--spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:3306/jshpos_gate6g_runtime?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true' \
            --spring.datasource.dynamic.datasource.master.username=root \
            --spring.datasource.dynamic.datasource.master.password=synthetic_gate6g_runtime_root \
            --spring.data.redis.host=127.0.0.1 --spring.data.redis.port=6379 \
            --spring.data.redis.password=synthetic_gate6g_redis_runtime --spring.boot.admin.client.enabled=false \
            --spring.boot.admin.client.username=gate6g-health \
            --spring.boot.admin.client.password=synthetic_gate6g_health_only \
            --snail-job.enabled=false --captcha.enable=false \
            > artifacts/t2/gate6g/runtime-stack/server.log 2>&1 &
          server_pid=$!
          python -m http.server 14173 --bind 127.0.0.1 --directory downloaded/web/dist \
            > artifacts/t2/gate6g/runtime-stack/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$server_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null && curl -fsS http://127.0.0.1:14173/ >/dev/null; then break; fi
            if ! kill -0 "$server_pid"; then tail -200 artifacts/t2/gate6g/runtime-stack/server.log; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/ > artifacts/t2/gate6g/runtime-stack/server-root.txt
          curl -fsS -u gate6g-health:synthetic_gate6g_health_only \
            http://127.0.0.1:18080/actuator/health > artifacts/t2/gate6g/runtime-stack/server-health.json
          curl -fsS http://127.0.0.1:14173/ > artifacts/t2/gate6g/runtime-stack/web-index.html
          docker exec "$mysql_container" mysql -N -B -uroot -psynthetic_gate6g_runtime_root jshpos_gate6g_runtime -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE(); SELECT COUNT(*) FROM jshpos_flyway_schema_history WHERE success=1;" \
            > artifacts/t2/gate6g/runtime-stack/mysql-runtime.txt
          pushd pos-flutter
          flutter pub get --enforce-lockfile
          flutter test --machine test/gate6g/formal_pos_runtime_e2e_test.dart \
            > ../artifacts/t2/gate6g/runtime-stack/flutter-formal-runtime.jsonl
          popd
          kill -0 "$server_pid" && kill -0 "$web_pid"
          python scripts/build_t2_gate6g_runtime_stack_smoke.py \
            --server-url http://127.0.0.1:18080 \
            --web-url http://127.0.0.1:14173 \
            --health-user gate6g-health \
            --health-password synthetic_gate6g_health_only \
            --mysql-runtime artifacts/t2/gate6g/runtime-stack/mysql-runtime.txt \
            --flutter-machine artifacts/t2/gate6g/runtime-stack/flutter-formal-runtime.jsonl \
            --output artifacts/t2/gate6g/runtime-stack/runtime-stack-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: t2-gate6g-runtime-stack, path: artifacts/t2/gate6g/runtime-stack, if-no-files-found: error, retention-days: 90 }

  internal-v1-core-candidate:
    needs: [governance, server, mysql, pos-linux, pos-windows, admin-web, runtime-stack-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-governance, path: artifacts/t2/gate6g/candidate-bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-server, path: artifacts/t2/gate6g/candidate-bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-mysql, path: artifacts/t2/gate6g/candidate-bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-linux, path: artifacts/t2/gate6g/candidate-bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-windows, path: artifacts/t2/gate6g/candidate-bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-web, path: artifacts/t2/gate6g/candidate-bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-runtime-stack, path: artifacts/t2/gate6g/candidate-bundle/runtime-stack }
      - name: Reconcile formal components three industries fixed seeds and defect ledger
        run: |
          mkdir -p artifacts/t2/gate6g/internal-v1-core-candidate
          python scripts/run_t2_gate6g_internal_v1_candidate.py \
            --bundle-dir artifacts/t2/gate6g/candidate-bundle \
            --output artifacts/t2/gate6g/internal-v1-core-candidate/internal-v1-core-candidate-report.json \
            --seed-ledger artifacts/t2/gate6g/internal-v1-core-candidate/failure-seed-ledger.json \
            --defect-ledger artifacts/t2/gate6g/internal-v1-core-candidate/defect-ledger.json
          cp docs/t2-gate6g/12_T2_E2E003可重复运行手册.md artifacts/t2/gate6g/internal-v1-core-candidate/repeatable-runbook.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6g-internal-v1-core-candidate, path: artifacts/t2/gate6g/internal-v1-core-candidate, if-no-files-found: error, retention-days: 90 }

  security:
    needs: [server, pos-linux, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-linux, path: downloaded/pos }
      - name: Enforce vulnerability license secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate6g/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/pos -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate6g/security/server-license-policy.txt
