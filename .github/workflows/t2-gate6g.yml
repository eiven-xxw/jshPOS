name: T2 Gate 6G Commercial V1 Core Quality Gates

on:
  push:
    branches: ["t2/gate6g-sprint17-core-productization"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6g.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6g/**"
      - "packages/pos_device_adapter/**"
      - "pos-flutter/**"
      - "scripts/**"
      - "server/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate Gate 6G serial admission contracts and data metadata
        run: |
          mkdir -p artifacts/t2/gate6g/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6g.py
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate6g/governance/core-audit.json
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/gate6g/governance/api-audit.json
          python scripts/audit_t2_gate6g_data.py --output artifacts/t2/gate6g/governance/data-audit.json
          python scripts/review_dependency_diff.py a6c91a1d66857583ce7e498541b63bcf0b81dc52 "$(git rev-parse HEAD)" > artifacts/t2/gate6g/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6g-governance, path: artifacts/t2/gate6g/governance, if-no-files-found: error, retention-days: 30 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6g-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6g_root
          MYSQL_DATABASE: jshpos_gate6g
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6g_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6g?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate6g_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate empty MySQL through V51 metadata guards and repeatability
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-release -am test
          -Dtest=ReleaseMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6g-mysql, path: server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml, if-no-files-found: error, retention-days: 30 }

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test SQLite coverage supply chain Kotlin and Android APK
        run: |
          mkdir -p artifacts/t2/gate6g/pos-linux
          cd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/infrastructure/local_database/pos_local_database.dart test/gate6g
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate6g/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_gate2_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate2-coverage.json
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5a-coverage.json
          python scripts/check_flutter_gate5b_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5b-coverage.json
          python scripts/check_flutter_gate5c_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate5c-coverage.json
          python scripts/check_flutter_gate6d_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate6d-coverage.json
          python scripts/check_flutter_gate6e_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6g/pos-linux/flutter-gate6e-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate6g/pos-linux/lcov.info
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate6g/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate6g/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate6g/pos-linux
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate6g/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6g-pos-linux, path: artifacts/t2/gate6g/pos-linux, if-no-files-found: error, retention-days: 30 }

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute clean Windows Flutter regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6g/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/infrastructure/local_database/pos_local_database.dart test/gate6g
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate6g/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6g-pos-windows, path: artifacts/t2/gate6g/pos-windows, if-no-files-found: error, retention-days: 30 }

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck component regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6g-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security:
    needs: [server, pos-linux, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-linux, path: downloaded/pos }
      - name: Enforce vulnerability license secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate6g/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/pos -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate6g/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate6g/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-config.json .github/workflows/t2-gate6g.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6g-security, path: artifacts/t2/gate6g/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance, server, mysql, pos-linux, pos-windows, admin-web, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-governance, path: artifacts/t2/gate6g/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-server, path: artifacts/t2/gate6g/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-mysql, path: artifacts/t2/gate6g/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-linux, path: artifacts/t2/gate6g/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-pos-windows, path: artifacts/t2/gate6g/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-web, path: artifacts/t2/gate6g/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6g-security, path: artifacts/t2/gate6g/bundle/security }
      - name: Build deduplicated evidence index
        run: python scripts/build_t2_gate6g_evidence.py --bundle-dir artifacts/t2/gate6g/bundle --output artifacts/t2/gate6g/t2-gate6g-evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6g-evidence-index, path: artifacts/t2/gate6g/t2-gate6g-evidence-index.json, if-no-files-found: error, retention-days: 90 }
