          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6g/security/trivy-config.json .github/workflows/t2-gate6g.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: t2-gate6g-security, path: artifacts/t2/gate6g/security, if-no-files-found: error, retention-days: 30 }

