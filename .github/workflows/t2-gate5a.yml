name: T2 Gate 5A Promotion Quality Gates

on:
  push:
    branches: ["t2/gate5a-sprint9-20260817"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate5a.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/governance/**"
      - "docs/t2-gate5a/**"
      - "pos-flutter/**"
      - "scripts/**gate5a*"
      - "scripts/build_flutter_supply_chain.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate5a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Verify ancestry RTM sequence contracts migrations and scope
        run: |
          mkdir -p artifacts/t2/gate5a/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate5a.py --stage closure --output artifacts/t2/gate5a/governance/gate5a-governance.json
          python scripts/review_dependency_diff.py 63537b5cb7ceeb1fe6b04107b53e2e68941b25ad "$(git rev-parse HEAD)" > artifacts/t2/gate5a/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-governance, path: artifacts/t2/gate5a/governance, if-no-files-found: error, retention-days: 30 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build admin and execute complete server regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate5a-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-promotion/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-promotion/target/jshpos-promotion-*.jar
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate5a_root
          MYSQL_DATABASE: jshpos_gate5a
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate5a_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE5A_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate5a?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE5A_MYSQL_USERNAME: root
      GATE5A_MYSQL_PASSWORD: synthetic_gate5a_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Run clean MySQL 8.4 twenty-three-version Flyway integration
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-promotion -am test
          -Dtest=PromotionMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate5a-mysql
          path: server/ruoyi-modules/jshpos-promotion/target/surefire-reports/TEST-*PromotionMigrationMySqlIT.xml
          if-no-files-found: error
          retention-days: 30

  tenant-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Execute trusted-tenant permissions persistence and refund attack tests
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-promotion -am test
          -Dtest=PromotionServiceTest,ManualPromotionServiceTest,PromotionTransactionServiceTest,PromotionStrictTenantMapperGuardTest,PromotionMapperXmlPolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - run: python scripts/run_t2_gate5a_attacks.py --output artifacts/t2/gate5a/tenant/tenant-attacks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate5a-tenant
          path: |
            artifacts/t2/gate5a/tenant
            server/ruoyi-modules/jshpos-promotion/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  cross-runtime-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python scripts/run_t2_gate5a_fixed_matrix.py --output artifacts/t2/gate5a/vectors/fixed-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-vectors, path: artifacts/t2/gate5a/vectors, if-no-files-found: error, retention-days: 30 }

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test SQLite V5 supply chain Kotlin and Android build
        run: |
          mkdir -p artifacts/t2/gate5a/pos-linux
          cd pos-flutter
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate5a/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate5a/pos-linux/flutter-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate5a/pos-linux/lcov.info
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate5a/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate5a/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate5a/pos-linux
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate5a/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-pos-linux, path: artifacts/t2/gate5a/pos-linux, if-no-files-found: error, retention-days: 30 }

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute locked Windows clean-runner regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate5a/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate5a/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-pos-windows, path: artifacts/t2/gate5a/pos-windows, if-no-files-found: error, retention-days: 30 }

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate5a-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security-sbom-license:
    needs: [server, admin-web, pos-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-server, path: "${{ runner.temp }}/gate5a-security-input/server" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-pos-linux, path: "${{ runner.temp }}/gate5a-security-input/pos" }
      - name: Install verified Trivy and enforce security gates
        run: |
          mkdir -p artifacts/t2/gate5a/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
          server_sbom="$(find "$RUNNER_TEMP/gate5a-security-input/server" -name bom.json -type f -print -quit)"
          flutter_sbom="$(find "$RUNNER_TEMP/gate5a-security-input/pos" -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate5a/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate5a/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate5a/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate5a/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate5a/security/trivy-config.json .github/workflows/t2-gate5a.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-security, path: artifacts/t2/gate5a/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance, server, mysql-migration, tenant-security, cross-runtime-vectors, pos-linux, pos-windows, admin-web, security-sbom-license]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-governance, path: artifacts/t2/gate5a/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-server, path: artifacts/t2/gate5a/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-mysql, path: artifacts/t2/gate5a/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-tenant, path: artifacts/t2/gate5a/bundle/tenant }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-vectors, path: artifacts/t2/gate5a/bundle/vectors }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-pos-linux, path: artifacts/t2/gate5a/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-pos-windows, path: artifacts/t2/gate5a/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-web, path: artifacts/t2/gate5a/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate5a-security, path: artifacts/t2/gate5a/bundle/security }
      - run: python scripts/build_t2_gate5a_evidence.py --bundle-dir artifacts/t2/gate5a/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate5a-promotion-evidence-bundle, path: artifacts/t2/gate5a/bundle, if-no-files-found: error, retention-days: 30 }
