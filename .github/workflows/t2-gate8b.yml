name: T2 Gate 8B S25 Commercial SaaS Operations Acceptance

on:
  push:
    branches: ["t2/gate8b-sprint25-commercial-saas-operations-acceptance"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8b.yml"
      - "contracts/t2/gate8b/**"
      - "docs/**"
      - "scripts/**"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate8b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate admission RTM runtime boundary and zero external execution
        run: |
          mkdir -p artifacts/t2/gate8b/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8b.py scripts/run_t2_gate8b_runtime_api_journey.py scripts/build_t2_gate8b_evidence.py
          python scripts/check_t2_gate8b.py --output artifacts/t2/gate8b/governance-ubuntu/gate8b-governance.json
          python scripts/review_dependency_diff.py 72ff758f1b61e5638664c758cf5ca479b512ddf5 "$(git rev-parse HEAD)" > artifacts/t2/gate8b/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-governance-ubuntu, path: artifacts/t2/gate8b/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance contracts and runtime boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8b/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8b.py scripts/run_t2_gate8b_runtime_api_journey.py scripts/build_t2_gate8b_evidence.py
          python scripts/check_t2_gate8b.py --output artifacts/t2/gate8b/governance-windows/gate8b-governance.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-governance-windows, path: artifacts/t2/gate8b/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith regression coverage and package
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Build aggregate SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Collect executable tests coverage SBOM and license evidence
        run: |
          mkdir -p artifacts/t2/gate8b/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate8b/server/license-policy.txt
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate8b/server/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate8b/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/gate8b/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-server, path: artifacts/t2/gate8b/server, if-no-files-found: error, retention-days: 30 }

  mysql-runtime:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_gate8b_root, MYSQL_DATABASE: jshpos_gate8b }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate8b_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE8A_SVC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate8b?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE8A_SVC_MYSQL_USERNAME: root
      GATE8A_SVC_MYSQL_PASSWORD: synthetic_gate8b_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate unified V1-V86 forward migrations
        working-directory: server
        run: ./mvnw -Plocal -pl ruoyi-admin -am test -Dtest=MemberBenefitMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Collect MySQL migration evidence
        run: |
          mkdir -p artifacts/t2/gate8b/mysql-runtime
          cp server/ruoyi-admin/target/surefire-reports/TEST-*MemberBenefitMigrationMySqlIT.xml artifacts/t2/gate8b/mysql-runtime/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-mysql-runtime, path: artifacts/t2/gate8b/mysql-runtime, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Build lint typecheck complete component tests audit and licenses
        run: |
          mkdir -p artifacts/t2/gate8b/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          cp gate0-vitest-junit.xml ../artifacts/t2/gate8b/web/
          pnpm licenses list --json > ../artifacts/t2/gate8b/web/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-web, path: artifacts/t2/gate8b/web, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: "21" }
      - name: Analyze complete tests coverage SQLite and supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Compile Kotlin adapter and Android APK
        if: matrix.os == 'ubuntu-latest'
        working-directory: pos-flutter
        run: |
          cd android && ./gradlew :app:compileDebugKotlin --no-daemon && cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate8b/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/gate8b/flutter/
          cp -R flutter-supply-chain artifacts/t2/gate8b/flutter/
          if [ -f app-debug.apk ]; then cp app-debug.apk artifacts/t2/gate8b/flutter/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-gate8b-flutter-${{ matrix.os }}", path: artifacts/t2/gate8b/flutter, if-no-files-found: error, retention-days: 30 }

  runtime-api:
    needs: server
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_gate8b_runtime_root, MYSQL_DATABASE: jshpos_gate8b_runtime }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate8b_runtime_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE8B_PLATFORM_PASSWORD: admin123
      GATE8B_BOOTSTRAP_PASSWORD: Synthetic-G8B-Bootstrap-2026
      GATE8B_REVIEWER_PASSWORD: Synthetic-G8B-Reviewer-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8b-server, path: downloaded/server }
      - name: Start formal MySQL Redis application and execute HTTP API journey
        run: |
          mkdir -p artifacts/t2/gate8b/runtime-api
          : > artifacts/t2/gate8b/runtime-api/schema-bootstrap.log
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container" && test -n "$redis_container"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_gate8b_runtime_root jshpos_gate8b_runtime < server/script/sql/ry_vue_5.X.sql 2>> artifacts/t2/gate8b/runtime-api/schema-bootstrap.log
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_gate8b_runtime_root jshpos_gate8b_runtime < server/script/sql/ry_workflow.sql 2>> artifacts/t2/gate8b/runtime-api/schema-bootstrap.log
          docker exec "$redis_container" redis-cli CONFIG SET requirepass synthetic_gate8b_redis_runtime
          docker exec "$redis_container" redis-cli -a synthetic_gate8b_redis_runtime ping
          server_jar="$(find downloaded/server -name ruoyi-admin.jar -type f -print -quit)"
          test -s "$server_jar"
          java -jar "$server_jar" \
            --server.port=18080 --api-decrypt.enabled=false --captcha.enable=false \
            --spring.datasource.dynamic.p6spy=false \
            '--spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:3306/jshpos_gate8b_runtime?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true' \
            --spring.datasource.dynamic.datasource.master.username=root \
            --spring.datasource.dynamic.datasource.master.password=synthetic_gate8b_runtime_root \
            --spring.data.redis.host=127.0.0.1 --spring.data.redis.port=6379 \
            --spring.data.redis.password=synthetic_gate8b_redis_runtime \
            --spring.boot.admin.client.enabled=false --snail-job.enabled=false \
            > artifacts/t2/gate8b/runtime-api/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid"; then tail -200 artifacts/t2/gate8b/runtime-api/server.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -200 artifacts/t2/gate8b/runtime-api/server.log; exit 1; fi
          python scripts/run_t2_gate8b_runtime_api_journey.py \
            --base-url http://127.0.0.1:18080 \
            --output artifacts/t2/gate8b/runtime-api/runtime-api-journey.json
          if grep -Fq "$GATE8B_PLATFORM_PASSWORD" artifacts/t2/gate8b/runtime-api/server.log \
            || grep -Fq "$GATE8B_BOOTSTRAP_PASSWORD" artifacts/t2/gate8b/runtime-api/server.log \
            || grep -Fq "$GATE8B_REVIEWER_PASSWORD" artifacts/t2/gate8b/runtime-api/server.log; then
            echo "Gate 8B runtime log contains a controlled credential" >&2
            exit 1
          fi
          kill -0 "$server_pid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate8b-runtime-api, path: artifacts/t2/gate8b/runtime-api, if-no-files-found: error, retention-days: 90 }

  security:
    needs: [server, mysql-runtime, web, flutter, runtime-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8b-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8b-flutter-ubuntu-latest, path: downloaded/flutter }
      - name: Enforce Secret PII license dependency and workflow boundaries
        run: |
          mkdir -p artifacts/t2/gate8b/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/flutter -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8b/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8b/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate8b/security/server-license-policy.txt
          python scripts/check_t2_gate8b.py --output artifacts/t2/gate8b/security/gate8b-security-boundary.json
          python scripts/review_dependency_diff.py 72ff758f1b61e5638664c758cf5ca479b512ddf5 "$(git rev-parse HEAD)" > artifacts/t2/gate8b/security/dependency-diff.json
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate8b/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8b/security/trivy-config.json .github/workflows/t2-gate8b.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-security, path: artifacts/t2/gate8b/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, mysql-runtime, web, flutter, runtime-api, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate8b-*, path: artifacts/t2/gate8b/downloaded, merge-multiple: false }
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/gate8b/bundle
          for pair in \
            "governance-ubuntu:t2-gate8b-governance-ubuntu" \
            "governance-windows:t2-gate8b-governance-windows" \
            "server:t2-gate8b-server" \
            "mysql-runtime:t2-gate8b-mysql-runtime" \
            "web:t2-gate8b-web" \
            "flutter-ubuntu:t2-gate8b-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate8b-flutter-windows-latest" \
            "runtime-api:t2-gate8b-runtime-api" \
            "security:t2-gate8b-security"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate8b/bundle/$producer"
            cp -R "artifacts/t2/gate8b/downloaded/$artifact/." "artifacts/t2/gate8b/bundle/$producer/"
          done
          python scripts/build_t2_gate8b_evidence.py --bundle-dir artifacts/t2/gate8b/bundle --output artifacts/t2/gate8b/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8b-evidence-index, path: artifacts/t2/gate8b/evidence-index.json, if-no-files-found: error, retention-days: 90 }
