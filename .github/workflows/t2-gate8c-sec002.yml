name: T2 Gate 8C S26A Production Security Hardening

on:
  push:
    branches: ["t2/gate8c-sprint26a-sec002-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8c-sec002.yml"
      - "contracts/t2/gate8c-sec002/**"
      - "docs/**"
      - "scripts/**"
      - "server/**"
      - "admin-web/**"
      - "pos-flutter/**"

permissions:
  contents: read

concurrency:
  group: t2-gate8c-sec002-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate SEC002 scope RTM closure and zero external execution
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_sec002.py scripts/build_t2_gate8c_sec002_evidence.py
          python scripts/check_t2_gate8c_sec002.py --output artifacts/t2/gate8c-sec002/governance-ubuntu/gate8c-sec002.json
          python scripts/review_dependency_diff.py d31bcb325dc94185ed94f87a9028fc381d1932ea "$(git rev-parse HEAD)" > artifacts/t2/gate8c-sec002/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-governance-ubuntu,
            path: artifacts/t2/gate8c-sec002/governance-ubuntu,
            if-no-files-found: error,
            retention-days: 30,
          }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and security contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8c-sec002/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_sec002.py scripts/build_t2_gate8c_sec002_evidence.py
          python scripts/check_t2_gate8c_sec002.py --output artifacts/t2/gate8c-sec002/governance-windows/gate8c-sec002.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-governance-windows,
            path: artifacts/t2/gate8c-sec002/governance-windows,
            if-no-files-found: error,
            retention-days: 30,
          }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith tests coverage and package
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Build aggregate SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Collect tests coverage package SBOM and license evidence
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate8c-sec002/server/license-policy.txt
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate8c-sec002/server/
          find server/ruoyi-modules server/ruoyi-admin -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate8c-sec002/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/gate8c-sec002/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-server,
            path: artifacts/t2/gate8c-sec002/server,
            if-no-files-found: error,
            retention-days: 30,
          }

  mysql-runtime:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          {
            MYSQL_ROOT_PASSWORD: synthetic_sec002_root,
            MYSQL_DATABASE: jshpos_sec002,
          }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_sec002_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE8A_SVC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_sec002?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE8A_SVC_MYSQL_USERNAME: root
      GATE8A_SVC_MYSQL_PASSWORD: synthetic_sec002_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate unified forward-only MySQL migrations
        working-directory: server
        run: ./mvnw -Plocal -pl ruoyi-admin -am test -Dtest=MemberBenefitMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Collect MySQL migration evidence
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/mysql-runtime
          cp server/ruoyi-admin/target/surefire-reports/TEST-*MemberBenefitMigrationMySqlIT.xml artifacts/t2/gate8c-sec002/mysql-runtime/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-mysql-runtime,
            path: artifacts/t2/gate8c-sec002/mysql-runtime,
            if-no-files-found: error,
            retention-days: 30,
          }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: "24",
            cache: pnpm,
            cache-dependency-path: admin-web/pnpm-lock.yaml,
          }
      - name: Build lint typecheck tests audit and licenses
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          cp gate0-vitest-junit.xml ../artifacts/t2/gate8c-sec002/web/
          pnpm licenses list --json > ../artifacts/t2/gate8c-sec002/web/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-web,
            path: artifacts/t2/gate8c-sec002/web,
            if-no-files-found: error,
            retention-days: 30,
          }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: "21" }
      - name: Analyze complete tests coverage SQLite and supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Compile Kotlin adapter and Android APK
        if: matrix.os == 'ubuntu-latest'
        working-directory: pos-flutter
        run: |
          cd android && ./gradlew :app:compileDebugKotlin --no-daemon && cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/gate8c-sec002/flutter/
          cp -R flutter-supply-chain artifacts/t2/gate8c-sec002/flutter/
          if [ -f app-debug.apk ]; then cp app-debug.apk artifacts/t2/gate8c-sec002/flutter/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: "t2-gate8c-sec002-flutter-${{ matrix.os }}",
            path: artifacts/t2/gate8c-sec002/flutter,
            if-no-files-found: error,
            retention-days: 30,
          }

  security:
    needs: [server, mysql-runtime, web, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-sec002-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: t2-gate8c-sec002-flutter-ubuntu-latest,
            path: downloaded/flutter,
          }
      - name: Enforce Secret PII vulnerability license dependency and config boundaries
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/flutter -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-sec002/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-sec002/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate8c-sec002/security/server-license-policy.txt
          python scripts/check_t2_gate8c_sec002.py --output artifacts/t2/gate8c-sec002/security/gate8c-sec002.json
          python scripts/review_dependency_diff.py d31bcb325dc94185ed94f87a9028fc381d1932ea "$(git rev-parse HEAD)" > artifacts/t2/gate8c-sec002/security/dependency-diff.json
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate8c-sec002/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-sec002/security/trivy-config.json .github/workflows/t2-gate8c-sec002.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-security,
            path: artifacts/t2/gate8c-sec002/security,
            if-no-files-found: error,
            retention-days: 30,
          }

  evidence:
    needs:
      [
        governance-ubuntu,
        governance-windows,
        server,
        mysql-runtime,
        web,
        flutter,
        security,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            pattern: t2-gate8c-sec002-*,
            path: artifacts/t2/gate8c-sec002/downloaded,
            merge-multiple: false,
          }
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/gate8c-sec002/bundle
          for pair in \
            "governance-ubuntu:t2-gate8c-sec002-governance-ubuntu" \
            "governance-windows:t2-gate8c-sec002-governance-windows" \
            "server:t2-gate8c-sec002-server" \
            "mysql-runtime:t2-gate8c-sec002-mysql-runtime" \
            "web:t2-gate8c-sec002-web" \
            "flutter-ubuntu:t2-gate8c-sec002-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate8c-sec002-flutter-windows-latest" \
            "security:t2-gate8c-sec002-security"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate8c-sec002/bundle/$producer"
            cp -R "artifacts/t2/gate8c-sec002/downloaded/$artifact/." "artifacts/t2/gate8c-sec002/bundle/$producer/"
          done
          python scripts/build_t2_gate8c_sec002_evidence.py --bundle-dir artifacts/t2/gate8c-sec002/bundle --output artifacts/t2/gate8c-sec002/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: t2-gate8c-sec002-evidence-index,
            path: artifacts/t2/gate8c-sec002/evidence-index.json,
            if-no-files-found: error,
            retention-days: 90,
          }
