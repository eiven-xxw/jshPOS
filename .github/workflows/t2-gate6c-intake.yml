name: T2 Gate 6C External Evidence Intake

on:
  push:
    branches: ["t2/gate6c-evidence-intake-20260820"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6c-intake.yml"
      - "contracts/t2/gate6c-intake/**"
      - "docs/governance/**"
      - "docs/t2-gate6c-intake/**"
      - "scripts/*gate6c_intake*"

permissions:
  contents: read

concurrency:
  group: t2-gate6c-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate governance, RTM and intake status
        run: |
          mkdir -p artifacts/t2/gate6c-intake/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6c_intake.py --output artifacts/t2/gate6c-intake/governance-ubuntu/intake-boundary.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6c-intake-governance-ubuntu
          path: artifacts/t2/gate6c-intake/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 paths and evidence contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6c-intake/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6c_intake.py --output artifacts/t2/gate6c-intake/governance-windows/intake-boundary.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6c-intake-governance-windows
          path: artifacts/t2/gate6c-intake/governance-windows
          if-no-files-found: error
          retention-days: 30

  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce no runtime, dependency, secret or external execution expansion
        run: |
          mkdir -p artifacts/t2/gate6c-intake/offline-boundary
          python scripts/check_t2_gate6c_intake.py --output artifacts/t2/gate6c-intake/offline-boundary/scope-status-secret.json
          python scripts/review_dependency_diff.py 74f5100b89a7cf98acd28622e5ccdc4beb7626b7 "$(git rev-parse HEAD)" > artifacts/t2/gate6c-intake/offline-boundary/dependency-diff.json
          test "$(git diff --name-only 74f5100b89a7cf98acd28622e5ccdc4beb7626b7 -- server admin-web pos-flutter device-adapter infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6c-intake-offline-boundary
          path: artifacts/t2/gate6c-intake/offline-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, offline-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-intake-governance-ubuntu
          path: artifacts/t2/gate6c-intake/governance-ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-intake-governance-windows
          path: artifacts/t2/gate6c-intake/governance-windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-intake-offline-boundary
          path: artifacts/t2/gate6c-intake/offline-boundary
      - name: Build evidence index
        run: |
          python scripts/build_t2_gate6c_intake_evidence.py --bundle-dir artifacts/t2/gate6c-intake --output artifacts/t2/gate6c-intake/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6c-intake-evidence-index
          path: artifacts/t2/gate6c-intake/evidence-index.json
          if-no-files-found: error
          retention-days: 30
