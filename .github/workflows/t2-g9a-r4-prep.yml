name: G9A R4 Formal Runtime Cross Owner E2E Prep

on:
  push:
    branches: ["t2/gate9b-sprint27h-g9a-r4-prep"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-g9a-r4-prep.yml"
      - "contracts/t2/gate9b-r4-prep/**"
      - "docs/governance/**"
      - "docs/t2-gate9b-r4-prep/**"
      - "scripts/*g9a_r4*"

permissions:
  contents: read

concurrency:
  group: g9a-r4-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate R4 preparation governance and formal-stack audit
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r4_prep.py scripts/audit_t2_g9a_r4_formal_stack.py scripts/build_t2_g9a_r4_prep_evidence.py
          python scripts/check_t2_g9a_r4_prep.py | tee artifacts/t2/g9a-r4-prep/governance-ubuntu/scope.txt
          python scripts/audit_t2_g9a_r4_formal_stack.py --output artifacts/t2/g9a-r4-prep/governance-ubuntu/formal-stack-audit.json --owner-csv artifacts/t2/g9a-r4-prep/governance-ubuntu/owner-runtime-inventory.csv
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r4-prep/governance-ubuntu/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-governance-ubuntu, path: artifacts/t2/g9a-r4-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 and cross-platform audit classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/t2/g9a-r4-prep/governance-windows
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_g9a_r4_prep.py scripts/audit_t2_g9a_r4_formal_stack.py scripts/build_t2_g9a_r4_prep_evidence.py
          python scripts/check_t2_g9a_r4_prep.py | tee artifacts/t2/g9a-r4-prep/governance-windows/scope.txt
          python scripts/audit_t2_g9a_r4_formal_stack.py --output artifacts/t2/g9a-r4-prep/governance-windows/formal-stack-audit.json --owner-csv artifacts/t2/g9a-r4-prep/governance-windows/owner-runtime-inventory.csv
          python scripts/audit_t2_gate6g_api.py --output artifacts/t2/g9a-r4-prep/governance-windows/api-regression.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-governance-windows, path: artifacts/t2/g9a-r4-prep/governance-windows, if-no-files-found: error, retention-days: 30 }

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce preparation-only diff and immutable dependencies/migrations
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/scope-integrity
          python scripts/check_t2_g9a_r4_prep.py | tee artifacts/t2/g9a-r4-prep/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py 28b4da44ed529860970412a632c807df0d1d2d3e "$(git rev-parse HEAD)" > artifacts/t2/g9a-r4-prep/scope-integrity/dependency-diff.json
          test "$(git diff --name-only 28b4da44ed529860970412a632c807df0d1d2d3e HEAD -- server admin-web pos-flutter packages infra infrastructure | wc -l)" -eq 0
          test "$(git diff --name-only 28b4da44ed529860970412a632c807df0d1d2d3e HEAD -- docs/governance/rtm.csv | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-scope-integrity, path: artifacts/t2/g9a-r4-prep/scope-integrity, if-no-files-found: error, retention-days: 30 }

  server-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Re-run complete modular-monolith tests and package baseline
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Build aggregate SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Collect server baseline evidence
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/server-baseline
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/g9a-r4-prep/server-baseline/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/g9a-r4-prep/server-baseline/ \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-server-baseline, path: artifacts/t2/g9a-r4-prep/server-baseline, if-no-files-found: error, retention-days: 30 }

  web-baseline:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Re-run Web build lint typecheck and page regression baseline
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/web-baseline
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/g9a-r4-prep/web-baseline/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/g9a-r4-prep/web-baseline/
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > ../artifacts/t2/g9a-r4-prep/web-baseline/dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-web-baseline, path: artifacts/t2/g9a-r4-prep/web-baseline, if-no-files-found: error, retention-days: 30 }

  flutter-baseline:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Re-run Flutter format analyze Widget SQLite and supply-chain baseline
        shell: bash
        working-directory: pos-flutter
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage 2>&1 | tee ../flutter-tests.jsonl
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Collect Flutter baseline evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/flutter
          cp flutter-tests.jsonl flutter-dependencies.json artifacts/t2/g9a-r4-prep/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/g9a-r4-prep/flutter/
          sha256sum pos-flutter/coverage/lcov.info > artifacts/t2/g9a-r4-prep/flutter/lcov.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "t2-g9a-r4-prep-flutter-${{ matrix.os }}", path: artifacts/t2/g9a-r4-prep/flutter, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-integrity, server-baseline, web-baseline, flutter-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-g9a-r4-prep-*, path: downloaded, merge-multiple: false }
      - name: Normalize producers and build evidence index
        run: |
          mkdir -p artifacts/t2/g9a-r4-prep/bundle artifacts/t2/g9a-r4-prep/final
          for pair in \
            "governance-ubuntu:t2-g9a-r4-prep-governance-ubuntu" \
            "governance-windows:t2-g9a-r4-prep-governance-windows" \
            "scope-integrity:t2-g9a-r4-prep-scope-integrity" \
            "server-baseline:t2-g9a-r4-prep-server-baseline" \
            "web-baseline:t2-g9a-r4-prep-web-baseline" \
            "flutter-ubuntu:t2-g9a-r4-prep-flutter-ubuntu-latest" \
            "flutter-windows:t2-g9a-r4-prep-flutter-windows-latest"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/g9a-r4-prep/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/g9a-r4-prep/bundle/$producer/"
          done
          python scripts/build_t2_g9a_r4_prep_evidence.py --bundle-dir artifacts/t2/g9a-r4-prep/bundle --output artifacts/t2/g9a-r4-prep/final/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-g9a-r4-prep-evidence-index, path: artifacts/t2/g9a-r4-prep/final, if-no-files-found: error, retention-days: 90 }
