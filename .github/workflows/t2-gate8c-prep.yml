name: T2 Gate 8C Prep Quality Performance Maintainability Release Audit

on:
  push:
    branches: ["t2/gate8c-prep-v1-quality-release-audit"]
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/t2-gate8c-prep.yml"
      - "contracts/t2/gate8c-prep/**"
      - "docs/**"
      - "scripts/*gate8c_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate8c-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate governance RTM scope findings and zero execution
        run: |
          mkdir -p artifacts/t2/gate8c-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_prep.py scripts/build_t2_gate8c_prep_evidence.py
          python scripts/check_t2_gate8c_prep.py --output artifacts/t2/gate8c-prep/governance-ubuntu/gate8c-prep.json
          python scripts/review_dependency_diff.py 68d94211b93156d0d87139e4ab5bef421802ad95 "$(git rev-parse HEAD)" > artifacts/t2/gate8c-prep/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-prep-governance-ubuntu, path: artifacts/t2/gate8c-prep/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and repository facts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8c-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_prep.py scripts/build_t2_gate8c_prep_evidence.py
          python scripts/check_t2_gate8c_prep.py --output artifacts/t2/gate8c-prep/governance-windows/gate8c-prep.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-prep-governance-windows, path: artifacts/t2/gate8c-prep/governance-windows, if-no-files-found: error, retention-days: 30 }

  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Audit security performance maintainability and release gaps
        run: |
          mkdir -p artifacts/t2/gate8c-prep/repository-audit
          python scripts/check_t2_gate8c_prep.py --output artifacts/t2/gate8c-prep/repository-audit/gate8c-repository-audit.json
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate8c-prep/repository-audit/reused-core-coverage.json
          cp contracts/t2/gate8c-prep/findings-register.json artifacts/t2/gate8c-prep/repository-audit/
          cp contracts/t2/gate8c-prep/audit-coverage-matrix.csv artifacts/t2/gate8c-prep/repository-audit/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-prep-repository-audit, path: artifacts/t2/gate8c-prep/repository-audit, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, repository-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate8c-prep-*, path: artifacts/t2/gate8c-prep/downloaded, merge-multiple: false }
      - name: Normalize producers and build immutable evidence index
        run: |
          mkdir -p artifacts/t2/gate8c-prep/bundle
          for pair in \
            "governance-ubuntu:t2-gate8c-prep-governance-ubuntu" \
            "governance-windows:t2-gate8c-prep-governance-windows" \
            "repository-audit:t2-gate8c-prep-repository-audit"; do
            producer="${pair%%:*}"
            artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate8c-prep/bundle/$producer"
            cp -R "artifacts/t2/gate8c-prep/downloaded/$artifact/." "artifacts/t2/gate8c-prep/bundle/$producer/"
          done
          python scripts/build_t2_gate8c_prep_evidence.py --bundle-dir artifacts/t2/gate8c-prep/bundle --output artifacts/t2/gate8c-prep/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-prep-evidence-index, path: artifacts/t2/gate8c-prep/evidence-index.json, if-no-files-found: error, retention-days: 90 }
