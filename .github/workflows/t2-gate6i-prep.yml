name: T2 Gate 6I External Admission and Full Alpha Freeze

on:
  push:
    branches: ["codex/t2-gate6i-prep-external-p0-alpha-freeze"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6i-prep.yml"
      - "contracts/t2/gate6h/gate6h-admission.json"
      - "contracts/t2/gate6i-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6i-prep/**"
      - "scripts/check_t2_gate6h.py"
      - "scripts/build_t2_gate6h_internal_rc.py"
      - "scripts/*gate6i_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate6i-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate accepted Gate 6H and Gate 6I frozen admission
        run: |
          mkdir -p artifacts/t2/gate6i-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate6h.py scripts/check_t2_gate6i_prep.py scripts/build_t2_gate6i_prep_evidence.py
          python scripts/check_t2_gate6i_prep.py --output artifacts/t2/gate6i-prep/governance-ubuntu/gate6i-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6i-prep-governance-ubuntu
          path: artifacts/t2/gate6i-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 RTM contracts reports and zero-execution boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6i-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate6h.py scripts/check_t2_gate6i_prep.py scripts/build_t2_gate6i_prep_evidence.py
          python scripts/check_t2_gate6i_prep.py --output artifacts/t2/gate6i-prep/governance-windows/gate6i-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6i-prep-governance-windows
          path: artifacts/t2/gate6i-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce no runtime dependency secret or external execution expansion
        run: |
          mkdir -p artifacts/t2/gate6i-prep/offline-boundary
          python scripts/check_t2_gate6i_prep.py --output artifacts/t2/gate6i-prep/offline-boundary/scope-status-secret.json
          python scripts/review_dependency_diff.py e2bd699ad565845c363ffe478320eb2b3f9a0015 "$(git rev-parse HEAD)" > artifacts/t2/gate6i-prep/offline-boundary/dependency-diff.json
          test "$(git diff --name-only e2bd699ad565845c363ffe478320eb2b3f9a0015 -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6i-prep-offline-boundary
          path: artifacts/t2/gate6i-prep/offline-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, offline-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: t2-gate6i-prep-governance-ubuntu,
            path: artifacts/t2/gate6i-prep/governance-ubuntu,
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: t2-gate6i-prep-governance-windows,
            path: artifacts/t2/gate6i-prep/governance-windows,
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: t2-gate6i-prep-offline-boundary,
            path: artifacts/t2/gate6i-prep/offline-boundary,
          }
      - name: Build immutable Gate 6I evidence index
        run: python scripts/build_t2_gate6i_prep_evidence.py --bundle-dir artifacts/t2/gate6i-prep --output artifacts/t2/gate6i-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6i-prep-evidence-index
          path: artifacts/t2/gate6i-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 90
