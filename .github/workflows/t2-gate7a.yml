name: T2 Gate 7A V1 Business Gap Audit

on:
  push:
    branches: ["t2/gate7a-sprint19-v1-business-gap"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate7a.yml"
      - "contracts/t2/gate7a/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate7a/**"
      - "scripts/audit_t2_gate6g_core.py"
      - "scripts/check_t2_gate7a.py"
      - "scripts/build_t2_gate7a_evidence.py"

permissions:
  contents: read

concurrency:
  group: t2-gate7a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate RTM capability audit and Gate 7A deliverables
        run: |
          mkdir -p artifacts/t2/gate7a/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/audit_t2_gate6g_core.py scripts/check_t2_gate7a.py scripts/build_t2_gate7a_evidence.py
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate7a/governance-ubuntu/core-audit.json
          python scripts/check_t2_gate7a.py --core-audit artifacts/t2/gate7a/governance-ubuntu/core-audit.json --output artifacts/t2/gate7a/governance-ubuntu/gate7a.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7a-governance-ubuntu
          path: artifacts/t2/gate7a/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 RTM contracts and audit on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate7a/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/audit_t2_gate6g_core.py scripts/check_t2_gate7a.py scripts/build_t2_gate7a_evidence.py
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate7a/governance-windows/core-audit.json
          python scripts/check_t2_gate7a.py --core-audit artifacts/t2/gate7a/governance-windows/core-audit.json --output artifacts/t2/gate7a/governance-windows/gate7a.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7a-governance-windows
          path: artifacts/t2/gate7a/governance-windows
          if-no-files-found: error
          retention-days: 30

  scope-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce audit-only runtime dependency and external boundaries
        run: |
          mkdir -p artifacts/t2/gate7a/scope-boundary
          python scripts/audit_t2_gate6g_core.py --output artifacts/t2/gate7a/scope-boundary/core-audit.json
          python scripts/check_t2_gate7a.py --core-audit artifacts/t2/gate7a/scope-boundary/core-audit.json --output artifacts/t2/gate7a/scope-boundary/gate7a.json
          python scripts/review_dependency_diff.py d66c252587561428def95058d67bc830e391a9ab "$(git rev-parse HEAD)" > artifacts/t2/gate7a/scope-boundary/dependency-diff.json
          test "$(git diff --name-only d66c252587561428def95058d67bc830e391a9ab -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7a-scope-boundary
          path: artifacts/t2/gate7a/scope-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, scope-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7a-governance-ubuntu, path: artifacts/t2/gate7a/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7a-governance-windows, path: artifacts/t2/gate7a/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7a-scope-boundary, path: artifacts/t2/gate7a/scope-boundary }
      - name: Build immutable Gate 7A evidence index
        run: python scripts/build_t2_gate7a_evidence.py --bundle-dir artifacts/t2/gate7a --output artifacts/t2/gate7a/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate7a-evidence-index
          path: artifacts/t2/gate7a/evidence-index.json
          if-no-files-found: error
          retention-days: 90
