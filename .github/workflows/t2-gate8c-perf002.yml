name: T2 Gate 8C S26C Performance Rebaseline

on:
  push:
    branches: ["t2/gate8c-sprint26c-perf002-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8c-perf002.yml"
      - "contracts/t2/gate8c-perf002/**"
      - "docs/**"
      - "scripts/**"
      - "server/**"
      - "admin-web/**"
      - "pos-flutter/**"

permissions:
  contents: read

concurrency:
  group: t2-gate8c-perf002-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate scope contracts RTM thresholds and closure
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile \
            scripts/check_t2_gate8c_perf002.py \
            scripts/run_t2_gate8c_perf002_runtime.py \
            scripts/run_t2_gate8c_perf002_dependency_faults.py \
            scripts/build_t2_gate8c_perf002_evidence.py \
            scripts/build_t2_gate8c_perf002_evidence_index.py
          python scripts/run_t2_gate8c_perf002_runtime.py --self-test
          python scripts/build_t2_gate8c_perf002_evidence.py --self-test
          python scripts/check_t2_gate8c_perf002.py --stage closure \
            --output artifacts/t2/gate8c-perf002/governance-ubuntu/perf002-governance.json
          python scripts/review_dependency_diff.py 262099bf788bcb6916af2480644883fa6c5aed49 "$(git rev-parse HEAD)" \
            > artifacts/t2/gate8c-perf002/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-governance-ubuntu, path: artifacts/t2/gate8c-perf002/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance contracts and performance harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8c-perf002/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_perf002.py scripts/run_t2_gate8c_perf002_runtime.py scripts/run_t2_gate8c_perf002_dependency_faults.py scripts/build_t2_gate8c_perf002_evidence.py scripts/build_t2_gate8c_perf002_evidence_index.py
          python scripts/run_t2_gate8c_perf002_runtime.py --self-test
          python scripts/build_t2_gate8c_perf002_evidence.py --self-test
          python scripts/check_t2_gate8c_perf002.py --stage closure --output artifacts/t2/gate8c-perf002/governance-windows/perf002-governance.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-governance-windows, path: artifacts/t2/gate8c-perf002/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith tests coverage and package
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Build aggregate SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Collect tests coverage SBOM license and JAR
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json \
            | tee artifacts/t2/gate8c-perf002/server/license-policy.txt
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate8c-perf002/server/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate8c-perf002/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/gate8c-perf002/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-server, path: artifacts/t2/gate8c-perf002/server, if-no-files-found: error, retention-days: 30 }

  owner-capacity:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_perf002_owner_root, MYSQL_DATABASE: perf002_full }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_perf002_owner_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE8A_SVC_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/perf002_full?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE8A_SVC_MYSQL_USERNAME: root
      GATE8A_SVC_MYSQL_PASSWORD: synthetic_perf002_owner_root
      GATE5D_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/perf002_reporting?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE5D_MYSQL_USERNAME: root
      GATE5D_MYSQL_PASSWORD: synthetic_perf002_owner_root
      GATE7D_CLS_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/perf002_operations?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE7D_CLS_MYSQL_USERNAME: root
      GATE7D_CLS_MYSQL_PASSWORD: synthetic_perf002_owner_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Create isolated capacity schemas
        run: |
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container"
          docker exec "$mysql_container" mysql -uroot -psynthetic_perf002_owner_root -e \
            "CREATE DATABASE perf002_reporting CHARACTER SET utf8mb4; CREATE DATABASE perf002_operations CHARACTER SET utf8mb4;"
      - name: Validate unified current MySQL migrations
        working-directory: server
        run: ./mvnw -Plocal -pl ruoyi-admin -am test -Dtest=MemberBenefitMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Execute catalog and migration capacity loads
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-modules/jshpos-catalog -am test -Dtest=CatalogImportPreflightTest -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          ./mvnw -pl ruoyi-modules/jshpos-migration -am test -Dtest=MigrationCapacityTrendTest -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Execute reporting daily-close and exception MySQL capacity loads
        working-directory: server
        run: |
          ./mvnw -pl ruoyi-modules/jshpos-reporting -am test -Dtest=ReportingMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          ./mvnw -pl ruoyi-modules/jshpos-operations -am test -Dtest=DailyCloseMySqlIT,ExceptionCenterMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Collect Owner capacity evidence
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/owner-capacity
          cp server/ruoyi-modules/jshpos-catalog/target/gate1-capacity.json artifacts/t2/gate8c-perf002/owner-capacity/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*MigrationCapacityTrendTest.xml' -exec cp {} artifacts/t2/gate8c-perf002/owner-capacity/ \;
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*ReportingMigrationMySqlIT.xml' -exec cp {} artifacts/t2/gate8c-perf002/owner-capacity/ \;
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*DailyCloseMySqlIT.xml' -exec cp {} artifacts/t2/gate8c-perf002/owner-capacity/ \;
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*ExceptionCenterMySqlIT.xml' -exec cp {} artifacts/t2/gate8c-perf002/owner-capacity/ \;
          find server/ruoyi-admin/target/surefire-reports -name 'TEST-*MemberBenefitMigrationMySqlIT.xml' -exec cp {} artifacts/t2/gate8c-perf002/owner-capacity/ \;
          test "$(find artifacts/t2/gate8c-perf002/owner-capacity -type f | wc -l)" -ge 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-owner-capacity, path: artifacts/t2/gate8c-perf002/owner-capacity, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Build lint typecheck tests audit and licenses
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          cp gate0-vitest-junit.xml ../artifacts/t2/gate8c-perf002/web/
          pnpm licenses list --json > ../artifacts/t2/gate8c-perf002/web/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-web, path: artifacts/t2/gate8c-perf002/web, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: "21" }
      - name: Analyze complete tests coverage SQLite and supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Compile Kotlin adapter and Android APK
        if: matrix.os == 'ubuntu-latest'
        working-directory: pos-flutter
        run: |
          cd android && ./gradlew :app:compileDebugKotlin --no-daemon && cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/gate8c-perf002/flutter/
          cp -R flutter-supply-chain artifacts/t2/gate8c-perf002/flutter/
          if [ -f app-debug.apk ]; then cp app-debug.apk artifacts/t2/gate8c-perf002/flutter/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-gate8c-perf002-flutter-${{ matrix.os }}", path: artifacts/t2/gate8c-perf002/flutter, if-no-files-found: error, retention-days: 30 }

  pos-performance:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    env:
      T2_PERF002_HEAVY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute fixed POS scan settlement sync and 100k package loads
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          mkdir -p ../artifacts/t2/gate8c-perf002/pos-performance
          flutter test --machine \
            test/gate6g/local_pos_sale_application_service_test.dart \
            test/sprint3/sync_coordinator_test.dart \
            test/gate8c_perf002/lot_package_capacity_test.dart \
            > ../artifacts/t2/gate8c-perf002/pos-performance/flutter-performance.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-pos-performance, path: artifacts/t2/gate8c-perf002/pos-performance, if-no-files-found: error, retention-days: 30 }

  formal-runtime:
    needs: server
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_perf002_runtime_root, MYSQL_DATABASE: jshpos_perf002_runtime }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_perf002_runtime_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE8B_PLATFORM_PASSWORD: admin123
      GATE8B_BOOTSTRAP_PASSWORD: Synthetic-G8B-Bootstrap-2026
      GATE8B_REVIEWER_PASSWORD: Synthetic-G8B-Reviewer-2026
      T2_PERF_MYSQL_PASSWORD: synthetic_perf002_runtime_root
      T2_PERF_REDIS_PASSWORD: synthetic_perf002_redis_runtime
      T2_PERF_MYSQL_IMAGE: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
      T2_PERF_REDIS_IMAGE: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-perf002-server, path: downloaded/server }
      - name: Start formal stack and execute API concurrency sustained resource and degradation loads
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/formal-runtime
          : > artifacts/t2/gate8c-perf002/formal-runtime/schema-bootstrap.log
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container" && test -n "$redis_container"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_perf002_runtime_root jshpos_perf002_runtime \
            < server/script/sql/ry_vue_5.X.sql 2>> artifacts/t2/gate8c-perf002/formal-runtime/schema-bootstrap.log
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_perf002_runtime_root jshpos_perf002_runtime \
            < server/script/sql/ry_workflow.sql 2>> artifacts/t2/gate8c-perf002/formal-runtime/schema-bootstrap.log
          docker exec "$redis_container" redis-cli CONFIG SET requirepass synthetic_perf002_redis_runtime
          docker exec "$redis_container" redis-cli -a synthetic_perf002_redis_runtime ping
          server_jar="$(find downloaded/server -name ruoyi-admin.jar -type f -print -quit)"
          test -s "$server_jar"
          started_ms="$(date +%s%3N)"
          java -Xlog:gc*:file=artifacts/t2/gate8c-perf002/formal-runtime/gc.log:time,uptime,level,tags \
            -jar "$server_jar" \
            --server.port=18080 --api-decrypt.enabled=false --captcha.enable=false \
            --spring.datasource.dynamic.p6spy=false \
            '--spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:3306/jshpos_perf002_runtime?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true' \
            --spring.datasource.dynamic.datasource.master.username=root \
            --spring.datasource.dynamic.datasource.master.password=synthetic_perf002_runtime_root \
            --spring.data.redis.host=127.0.0.1 --spring.data.redis.port=6379 \
            --spring.data.redis.password=synthetic_perf002_redis_runtime \
            --spring.boot.admin.client.enabled=false --snail-job.enabled=false \
            > artifacts/t2/gate8c-perf002/formal-runtime/server.log 2>&1 &
          server_pid=$!
          trap 'docker unpause "$mysql_container" "$redis_container" 2>/dev/null || true; kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid"; then tail -200 artifacts/t2/gate8c-perf002/formal-runtime/server.log; exit 1; fi
            sleep 2
          done
          test "$ready" -eq 1
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))
          python -c "import json,pathlib; pathlib.Path('artifacts/t2/gate8c-perf002/formal-runtime/server-cold-start.json').write_text(json.dumps({'status':'PASS','milliseconds':int('$elapsed_ms'),'executor':'github-hosted-ubuntu-latest-x64','syntheticOnly':True},indent=2)+'\\n')"
          python scripts/run_t2_gate8b_runtime_api_journey.py \
            --base-url http://127.0.0.1:18080 \
            --output artifacts/t2/gate8c-perf002/formal-runtime/runtime-api-journey.json
          python scripts/run_t2_gate8c_perf002_runtime.py \
            --base-url http://127.0.0.1:18080 --pid "$server_pid" \
            --mysql-container "$mysql_container" --redis-container "$redis_container" \
            --gc-log artifacts/t2/gate8c-perf002/formal-runtime/gc.log \
            --output artifacts/t2/gate8c-perf002/formal-runtime/formal-runtime-performance.json
          python scripts/run_t2_gate8c_perf002_dependency_faults.py \
            --base-url http://127.0.0.1:18080 --pid "$server_pid" \
            --mysql-container "$mysql_container" --redis-container "$redis_container" \
            --output artifacts/t2/gate8c-perf002/formal-runtime/dependency-faults.json
          if grep -Fq "$GATE8B_PLATFORM_PASSWORD" artifacts/t2/gate8c-perf002/formal-runtime/server.log \
            || grep -Fq "$GATE8B_BOOTSTRAP_PASSWORD" artifacts/t2/gate8c-perf002/formal-runtime/server.log \
            || grep -Fq "$GATE8B_REVIEWER_PASSWORD" artifacts/t2/gate8c-perf002/formal-runtime/server.log; then
            echo "controlled credential leaked to runtime log" >&2; exit 1
          fi
          kill -0 "$server_pid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate8c-perf002-formal-runtime, path: artifacts/t2/gate8c-perf002/formal-runtime, if-no-files-found: error, retention-days: 90 }

  security:
    needs: [server, owner-capacity, web, flutter, pos-performance, formal-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-perf002-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-perf002-flutter-ubuntu-latest, path: downloaded/flutter }
      - name: Enforce Secret PII license dependency workflow and closure boundaries
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/security
          python scripts/check_t2_gate8c_perf002.py --stage closure \
            --output artifacts/t2/gate8c-perf002/security/perf002-security-boundary.json
          python scripts/review_dependency_diff.py 262099bf788bcb6916af2480644883fa6c5aed49 "$(git rev-parse HEAD)" \
            > artifacts/t2/gate8c-perf002/security/dependency-diff.json
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/flutter -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-perf002/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-perf002/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json \
            | tee artifacts/t2/gate8c-perf002/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --skip-dirs downloaded --format json --output artifacts/t2/gate8c-perf002/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-perf002/security/trivy-config.json .github/workflows/t2-gate8c-perf002.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-security, path: artifacts/t2/gate8c-perf002/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, owner-capacity, web, flutter, pos-performance, formal-runtime, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate8c-perf002-*, path: artifacts/t2/gate8c-perf002/downloaded, merge-multiple: false }
      - name: Normalize producers build performance summary and immutable index
        run: |
          mkdir -p artifacts/t2/gate8c-perf002/bundle
          for pair in \
            "governance-ubuntu:t2-gate8c-perf002-governance-ubuntu" \
            "governance-windows:t2-gate8c-perf002-governance-windows" \
            "server:t2-gate8c-perf002-server" \
            "owner-capacity:t2-gate8c-perf002-owner-capacity" \
            "web:t2-gate8c-perf002-web" \
            "flutter-ubuntu:t2-gate8c-perf002-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate8c-perf002-flutter-windows-latest" \
            "pos-performance:t2-gate8c-perf002-pos-performance" \
            "formal-runtime:t2-gate8c-perf002-formal-runtime" \
            "security:t2-gate8c-perf002-security"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate8c-perf002/bundle/$producer"
            cp -R "artifacts/t2/gate8c-perf002/downloaded/$artifact/." "artifacts/t2/gate8c-perf002/bundle/$producer/"
          done
          python scripts/build_t2_gate8c_perf002_evidence.py \
            --bundle-dir artifacts/t2/gate8c-perf002/bundle \
            --output artifacts/t2/gate8c-perf002/bundle/performance-summary.json
          python scripts/build_t2_gate8c_perf002_evidence_index.py \
            --bundle-dir artifacts/t2/gate8c-perf002/bundle \
            --output artifacts/t2/gate8c-perf002/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-perf002-evidence-index, path: artifacts/t2/gate8c-perf002, if-no-files-found: error, retention-days: 90 }
