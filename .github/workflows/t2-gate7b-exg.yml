name: T2 Gate 7B S20-B EXG-001 Runtime

on:
  push:
    branches: ["t2/gate7b-sprint20b-exg-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/t2-gate7b-exg.yml"
      - "contracts/t2/gate7b-exg/**"
      - "docs/**"
      - "pos-flutter/**"
      - "scripts/**"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate7b-exg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate RTM contracts scope secrets and EXG runtime
        run: |
          mkdir -p artifacts/t2/gate7b-exg/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7b_exg.py scripts/build_t2_gate7b_exg_evidence.py
          python scripts/check_t2_gate7b_exg.py --output artifacts/t2/gate7b-exg/governance-ubuntu/exg-gate.json
          python scripts/review_dependency_diff.py 4d184a1cf5998c91d9cc9db359a4d5ed0d16e0c3 "$(git rev-parse HEAD)" > artifacts/t2/gate7b-exg/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-governance-ubuntu, path: artifacts/t2/gate7b-exg/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and EXG runtime boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate7b-exg/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate7b_exg.py scripts/build_t2_gate7b_exg_evidence.py
          python scripts/check_t2_gate7b_exg.py --output artifacts/t2/gate7b-exg/governance-windows/exg-gate.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-governance-windows, path: artifacts/t2/gate7b-exg/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Build aggregate SBOM and enforce licenses
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce server license policy
        run: |
          mkdir -p artifacts/t2/gate7b-exg/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate7b-exg/server/license-policy.txt
          cp server/target/bom.json server/target/bom.xml artifacts/t2/gate7b-exg/server/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate7b-exg/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-server, path: artifacts/t2/gate7b-exg/server, if-no-files-found: error, retention-days: 30 }

  mysql:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate7b_exg_root
          MYSQL_DATABASE: jshpos_gate7b_exg
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate7b_exg_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate7b_exg?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate7b_exg_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate empty MySQL forward migrations append-only guards and permissions
        working-directory: server
        run: ./mvnw -pl ruoyi-modules/jshpos-returns -am test -Dtest=ReturnsMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Collect MySQL evidence
        run: |
          mkdir -p artifacts/t2/gate7b-exg/mysql
          cp server/ruoyi-modules/jshpos-returns/target/surefire-reports/TEST-*ReturnsMigrationMySqlIT.xml artifacts/t2/gate7b-exg/mysql/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-mysql, path: artifacts/t2/gate7b-exg/mysql, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: "21" }
      - name: Format analyze test coverage and Flutter supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Compile Kotlin adapter and Android APK
        if: matrix.os == 'ubuntu-latest'
        working-directory: pos-flutter
        run: |
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate7b-exg/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-dependencies.json artifacts/t2/gate7b-exg/flutter/
          cp -R flutter-supply-chain artifacts/t2/gate7b-exg/flutter/
          if [ -f app-debug.apk ]; then cp app-debug.apk artifacts/t2/gate7b-exg/flutter/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-gate7b-exg-flutter-${{ matrix.os }}", path: artifacts/t2/gate7b-exg/flutter, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Build lint typecheck test audit and licenses
        run: |
          mkdir -p artifacts/t2/gate7b-exg/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > ../artifacts/t2/gate7b-exg/web/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-web, path: artifacts/t2/gate7b-exg/web, if-no-files-found: error, retention-days: 30 }

  security:
    needs: [server, flutter, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-flutter-ubuntu-latest, path: downloaded/flutter }
      - name: Enforce vulnerability license Secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate7b-exg/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/flutter -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate7b-exg/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate7b-exg/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate7b-exg/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate7b-exg/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate7b-exg/security/trivy-config.json .github/workflows/t2-gate7b-exg.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate7b-exg-security, path: artifacts/t2/gate7b-exg/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, mysql, flutter, web, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-governance-ubuntu, path: artifacts/t2/gate7b-exg/bundle/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-governance-windows, path: artifacts/t2/gate7b-exg/bundle/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-server, path: artifacts/t2/gate7b-exg/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-mysql, path: artifacts/t2/gate7b-exg/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-flutter-ubuntu-latest, path: artifacts/t2/gate7b-exg/bundle/flutter-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-flutter-windows-latest, path: artifacts/t2/gate7b-exg/bundle/flutter-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-web, path: artifacts/t2/gate7b-exg/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate7b-exg-security, path: artifacts/t2/gate7b-exg/bundle/security }
      - name: Build immutable EXG evidence index
        run: python scripts/build_t2_gate7b_exg_evidence.py --bundle-dir artifacts/t2/gate7b-exg/bundle --output artifacts/t2/gate7b-exg/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate7b-exg-evidence-index, path: artifacts/t2/gate7b-exg/evidence-index.json, if-no-files-found: error, retention-days: 90 }
