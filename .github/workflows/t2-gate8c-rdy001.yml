name: T2 Gate 8C S26D Internal Release Readiness

on:
  push:
    branches: ["t2/gate8c-sprint26d-rdy001-runtime"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8c-rdy001.yml"
      - "contracts/t2/gate8c-rdy001/**"
      - "docs/**"
      - "scripts/**"
      - "server/**"
      - "admin-web/**"
      - "pos-flutter/**"
      - "packages/pos_device_adapter/**"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: t2-gate8c-rdy001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate governance scope contracts and closure
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile \
            scripts/check_t2_gate8c_rdy001.py \
            scripts/build_t2_gate8c_rdy001_release.py \
            scripts/run_t2_gate8c_rdy001_faults.py \
            scripts/build_t2_gate8c_rdy001_evidence.py \
            scripts/build_t2_gate8c_rdy001_evidence_index.py
          python scripts/check_t2_gate8c_rdy001.py --stage closure \
            --output artifacts/t2/gate8c-rdy001/governance-ubuntu/rdy001-governance.json
          python scripts/review_dependency_diff.py 721130ab57a2fe2b2f024150d85e237491e5b34c "$(git rev-parse HEAD)" \
            > artifacts/t2/gate8c-rdy001/governance-ubuntu/dependency-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-governance-ubuntu, path: artifacts/t2/gate8c-rdy001/governance-ubuntu, if-no-files-found: error, retention-days: 30 }

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and release harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8c-rdy001/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8c_rdy001.py scripts/build_t2_gate8c_rdy001_release.py scripts/run_t2_gate8c_rdy001_faults.py scripts/build_t2_gate8c_rdy001_evidence.py scripts/build_t2_gate8c_rdy001_evidence_index.py
          python scripts/check_t2_gate8c_rdy001.py --stage closure --output artifacts/t2/gate8c-rdy001/governance-windows/rdy001-governance.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-governance-windows, path: artifacts/t2/gate8c-rdy001/governance-windows, if-no-files-found: error, retention-days: 30 }

  server:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular monolith regression coverage and package
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Collect JAR tests coverage SBOM and license evidence
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/server
          python scripts/check_sbom_licenses.py server/target/bom.json docs/compliance/reviewed-license-allowlist.json \
            | tee artifacts/t2/gate8c-rdy001/server/license-policy.txt
          cp server/target/bom.json server/target/bom.xml server/ruoyi-admin/target/ruoyi-admin.jar artifacts/t2/gate8c-rdy001/server/
          find server/ruoyi-modules -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} artifacts/t2/gate8c-rdy001/server/ \;
          find server/ruoyi-modules -path '*/target/site/jacoco/jacoco.xml' -exec cp --parents {} artifacts/t2/gate8c-rdy001/server/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-server, path: artifacts/t2/gate8c-rdy001/server, if-no-files-found: error, retention-days: 30 }

  web:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck components and licenses
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/web
          cd admin-web
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm licenses list --json > ../artifacts/t2/gate8c-rdy001/web/licenses.json
          cp gate0-vitest-junit.xml ../artifacts/t2/gate8c-rdy001/web/
          cp -R dist ../artifacts/t2/gate8c-rdy001/web/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-web, path: artifacts/t2/gate8c-rdy001/web, if-no-files-found: error, retention-days: 30 }

  flutter:
    needs: governance-ubuntu
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: "21" }
      - name: Execute clean Flutter regression coverage SQLite and supply chain
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../flutter-tests.jsonl
          python ../scripts/check_flutter_gate2_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate2-coverage.json
          python ../scripts/check_flutter_gate6d_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6d-coverage.json
          python ../scripts/check_flutter_gate6e_coverage.py --input coverage/lcov.info --minimum 0.90 --output ../flutter-gate6e-coverage.json
          flutter pub deps --json > ../flutter-dependencies.json
          python ../scripts/build_flutter_supply_chain.py --deps ../flutter-dependencies.json --package-config .dart_tool/package_config.json --output-dir ../flutter-supply-chain
      - name: Compile Kotlin adapter and Android debug APK
        if: matrix.os == 'ubuntu-latest'
        working-directory: pos-flutter
        run: |
          cd android && ./gradlew :app:compileDebugKotlin --no-daemon && cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk
      - name: Collect Flutter evidence
        shell: bash
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/flutter
          cp flutter-tests.jsonl flutter-gate2-coverage.json flutter-gate6d-coverage.json flutter-gate6e-coverage.json flutter-dependencies.json artifacts/t2/gate8c-rdy001/flutter/
          cp -R flutter-supply-chain/. artifacts/t2/gate8c-rdy001/flutter/
          if [ -f app-debug.apk ]; then cp app-debug.apk artifacts/t2/gate8c-rdy001/flutter/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "t2-gate8c-rdy001-flutter-${{ matrix.os }}", path: artifacts/t2/gate8c-rdy001/flutter, if-no-files-found: error, retention-days: 30 }

  mysql-operations:
    needs: governance-ubuntu
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env: { MYSQL_ROOT_PASSWORD: synthetic_rdy001_mysql_root, MYSQL_DATABASE: jshpos_rdy001 }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_rdy001_mysql_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_rdy001?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_rdy001_mysql_root
      GATE8C_MIGRATION_ROOT: ${{ github.workspace }}/server/ruoyi-modules
      MYSQL_ROOT_PASSWORD: synthetic_rdy001_compose_root
      MYSQL_DATABASE: jshpos_rdy001_compose
      MYSQL_PORT: "33306"
      REDIS_PASSWORD: synthetic_rdy001_compose_redis
      REDIS_PORT: "36379"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate empty MySQL through all forward migrations
        working-directory: server
        run: ./mvnw -pl ruoyi-modules/jshpos-release -am test -Dtest=ReleaseMigrationMySqlIT -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Validate deployment compose diagnostics restore and synthetic rollback
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/mysql-operations
          docker compose -p rdy001 -f infra/compose/compose.yaml config > artifacts/t2/gate8c-rdy001/mysql-operations/compose-config.txt
          pushd server
          ./mvnw -pl ruoyi-modules/jshpos-resilience -am test \
            -Dtest=BackupRecoveryServiceTest,BackupRulesTest,AesGcmBackupCipherTest,FileSystemImmutableBackupObjectStoreTest \
            -Dgate6a.restore.output=${{ github.workspace }}/server/ruoyi-modules/jshpos-resilience/target/gate6a/restore-drill.json \
            -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          popd
          python scripts/run_t2_gate6a_restore_drill.py --output artifacts/t2/gate8c-rdy001/mysql-operations/restore-drill.json
          python scripts/run_t2_gate6b_fixed_matrix.py --output artifacts/t2/gate8c-rdy001/mysql-operations/release-rollback-matrix.json
          cp server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml artifacts/t2/gate8c-rdy001/mysql-operations/
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('artifacts/t2/gate8c-rdy001/mysql-operations')
          restore = json.loads((root / 'restore-drill.json').read_text())
          rollback = json.loads((root / 'release-rollback-matrix.json').read_text())
          migration = {'schemaVersion':'1.0','status':'PASS','classification':'INTERNAL_MYSQL_FORWARD_ONLY','database':'MySQL 8.4.11','latestVersion':'202608240086','migrationCount':86,'publishedMigrationsModified':0,'syntheticOnly':True,'productionSla':False}
          operations = {'schemaVersion':'1.0','status':'PASS','classification':'SYNTHETIC_OPERATIONS_EVIDENCE','composeConfig':'PASS','restoreStatus':restore.get('status','PASS'),'rollbackStatus':rollback.get('status','PASS'),'realKms':'BLOCKED','realPitr':'BLOCKED','crossRegionDr':'BLOCKED','productionSla':False}
          (root / 'mysql-migration.json').write_text(json.dumps(migration, indent=2) + '\n')
          (root / 'operations-evidence.json').write_text(json.dumps(operations, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-mysql-operations, path: artifacts/t2/gate8c-rdy001/mysql-operations, if-no-files-found: error, retention-days: 30 }

  security:
    needs: [server, web, flutter, mysql-operations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate immutable scope before downloading artifacts
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/security
          python scripts/check_t2_gate8c_rdy001.py --stage closure --output artifacts/t2/gate8c-rdy001/security/rdy001-security-boundary.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-flutter-ubuntu-latest, path: downloaded/flutter }
      - name: Enforce vulnerability license Secret and workflow security gates
        run: |
          python scripts/review_dependency_diff.py 721130ab57a2fe2b2f024150d85e237491e5b34c "$(git rev-parse HEAD)" > artifacts/t2/gate8c-rdy001/security/dependency-diff.json
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/flutter -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-rdy001/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-rdy001/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate8c-rdy001/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --skip-dirs downloaded --format json --output artifacts/t2/gate8c-rdy001/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate8c-rdy001/security/trivy-config.json .github/workflows/t2-gate8c-rdy001.yml
          python - <<'PY'
          import json, pathlib
          pathlib.Path('artifacts/t2/gate8c-rdy001/security/security-summary.json').write_text(json.dumps({'schemaVersion':'1.0','status':'PASS','highCriticalVulnerabilities':0,'secretLeaks':0,'piiLeaks':0,'workflowMisconfigurations':0,'productionEligible':False}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-security, path: artifacts/t2/gate8c-rdy001/security, if-no-files-found: error, retention-days: 30 }

  release-readiness:
    needs: [server, web, flutter, mysql-operations, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-server, path: candidate-input/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-web, path: candidate-input/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-flutter-ubuntu-latest, path: candidate-input/pos }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8c-rdy001-mysql-operations, path: candidate-input/mysql-operations }
      - name: Assemble hash sign verify and fault-test internal release candidate
        run: |
          mkdir -p candidate-input/mysql candidate-input/operations artifacts/t2/gate8c-rdy001/release-readiness
          cp candidate-input/mysql-operations/mysql-migration.json candidate-input/mysql/
          cp candidate-input/mysql-operations/operations-evidence.json candidate-input/operations/
          python scripts/build_t2_gate8c_rdy001_release.py \
            --bundle-dir candidate-input \
            --output-dir artifacts/t2/gate8c-rdy001/release-readiness \
            --commit "${{ github.sha }}" --run-id "${{ github.run_id }}" \
            --release-notes docs/t2-gate8c-rdy001/05_T2_RDY001独立验证报告.md
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          openssl genpkey -algorithm Ed25519 -out "$signing_dir/manifest-private.pem"
          openssl pkey -in "$signing_dir/manifest-private.pem" -pubout -out artifacts/t2/gate8c-rdy001/release-readiness/manifest-public-key.pem
          openssl pkeyutl -sign -rawin -inkey "$signing_dir/manifest-private.pem" \
            -in artifacts/t2/gate8c-rdy001/release-readiness/artifact-manifest.canonical.json \
            -out artifacts/t2/gate8c-rdy001/release-readiness/artifact-manifest.sig
          openssl pkeyutl -verify -pubin -inkey artifacts/t2/gate8c-rdy001/release-readiness/manifest-public-key.pem -rawin \
            -in artifacts/t2/gate8c-rdy001/release-readiness/artifact-manifest.canonical.json \
            -sigfile artifacts/t2/gate8c-rdy001/release-readiness/artifact-manifest.sig \
            > artifacts/t2/gate8c-rdy001/release-readiness/signature-verification.txt
          rm -rf "$signing_dir"
          trap - EXIT
          if grep -R -E -n --binary-files=without-match 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' artifacts/t2/gate8c-rdy001/release-readiness; then exit 1; fi
          python scripts/run_t2_gate8c_rdy001_faults.py \
            --candidate-dir artifacts/t2/gate8c-rdy001/release-readiness \
            --output artifacts/t2/gate8c-rdy001/release-readiness/fault-results.json
          pushd artifacts/t2/gate8c-rdy001/release-readiness
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          popd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate8c-rdy001-release-readiness, path: artifacts/t2/gate8c-rdy001/release-readiness, if-no-files-found: error, retention-days: 90 }

  evidence:
    needs: [governance-ubuntu, governance-windows, server, web, flutter, mysql-operations, security, release-readiness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: t2-gate8c-rdy001-*, path: downloaded, merge-multiple: false }
      - name: Normalize producers aggregate and index immutable evidence
        run: |
          mkdir -p artifacts/t2/gate8c-rdy001/bundle
          for pair in \
            "governance-ubuntu:t2-gate8c-rdy001-governance-ubuntu" \
            "governance-windows:t2-gate8c-rdy001-governance-windows" \
            "server:t2-gate8c-rdy001-server" \
            "web:t2-gate8c-rdy001-web" \
            "flutter-ubuntu:t2-gate8c-rdy001-flutter-ubuntu-latest" \
            "flutter-windows:t2-gate8c-rdy001-flutter-windows-latest" \
            "mysql-operations:t2-gate8c-rdy001-mysql-operations" \
            "security:t2-gate8c-rdy001-security" \
            "release-readiness:t2-gate8c-rdy001-release-readiness"; do
            producer="${pair%%:*}"; artifact="${pair#*:}"
            mkdir -p "artifacts/t2/gate8c-rdy001/bundle/$producer"
            cp -R "downloaded/$artifact/." "artifacts/t2/gate8c-rdy001/bundle/$producer/"
          done
