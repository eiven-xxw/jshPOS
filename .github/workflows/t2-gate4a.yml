name: T2 Gate 4A Immutable Inventory Quality Gates

on:
  push:
    branches: ["t2/gate4a-sprint5-20260816"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate4a.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/governance/**"
      - "docs/t2-gate3b-prep/**"
      - "docs/t2-gate4a/**"
      - "pos-flutter/**"
      - "scripts/**t2_gate4a*"
      - "scripts/build_flutter_supply_chain.py"
      - "scripts/check_flutter_sprint3_coverage.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate4a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - id: stage
        name: Resolve governed evidence stage
        shell: bash
        run: |
          status="$(python -c "import csv;r={x['requirement_id']:x['status'] for x in csv.DictReader(open('docs/governance/rtm.csv',encoding='utf-8-sig'))};s={r[x] for x in ('T2-INV-001','T2-INV-002','T2-INV-004')};assert len(s)==1;print(s.pop())")"
          case "$status" in
            IN_PROGRESS) stage=admitted ;;
            VERIFIED) stage=closure ;;
            *) echo "Unexpected Gate 4A status: $status" >&2; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Verify ancestry, RTM, contracts, migrations and scope
        run: |
          mkdir -p artifacts/t2/gate4a/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate4a.py --stage "${{ steps.stage.outputs.stage }}" --output artifacts/t2/gate4a/governance/gate4a-governance.json
          python scripts/review_dependency_diff.py 451a48f982d3a88c68ff20ca283a190e7bf53ccf "$(git rev-parse HEAD)" > artifacts/t2/gate4a/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-governance
          path: artifacts/t2/gate4a/governance
          if-no-files-found: error
          retention-days: 30
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build admin and execute all server tests and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-server
          path: |
            server/ruoyi-modules/jshpos-foundation/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-catalog/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-order/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-sync/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-sync/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-inventory/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-inventory/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-inventory/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-inventory/target/site/jacoco/jacoco.csv
            server/ruoyi-modules/jshpos-inventory/target/jshpos-inventory-*.jar
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate4a_root
          MYSQL_DATABASE: jshpos_gate4a
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate4a_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE4A_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate4a?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE4A_MYSQL_USERNAME: root
      GATE4A_MYSQL_PASSWORD: synthetic_gate4a_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Run clean MySQL 8.4 twelve-version Flyway integration
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-inventory -am test
          -Dtest=InventoryMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-mysql
          path: server/ruoyi-modules/jshpos-inventory/target/surefire-reports/TEST-*InventoryMigrationMySqlIT.xml
          if-no-files-found: error
          retention-days: 30

  tenant-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Execute trusted-tenant inventory and Mapper boundary tests
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-inventory -am test
          -Dtest=InventoryLedgerServiceTest,InventoryStrictTenantMapperGuardTest,InventoryMapperXmlPolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Build twelve-surface two-tenant attack evidence
        run: python scripts/run_t2_gate4a_attacks.py --output artifacts/t2/gate4a/tenant/tenant-attacks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-tenant
          path: |
            artifacts/t2/gate4a/tenant
            server/ruoyi-modules/jshpos-inventory/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  inventory-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Map all sixteen fixed synthetic vectors to executed suites
        run: python scripts/run_t2_gate4a_fixed_matrix.py --output artifacts/t2/gate4a/vectors/fixed-matrix.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-vectors
          path: artifacts/t2/gate4a/vectors
          if-no-files-found: error
          retention-days: 30

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Resolve locked dependencies and analyze
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
      - name: Execute Flutter regression and preserve 90 percent coverage
        run: |
          mkdir -p artifacts/t2/gate4a/pos-linux
          cd pos-flutter
          flutter test --machine --coverage > ../artifacts/t2/gate4a/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_sprint3_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate4a/pos-linux/flutter-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate4a/pos-linux/lcov.info
      - name: Generate Flutter CycloneDX and license inventory
        run: |
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate4a/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate4a/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate4a/pos-linux
      - name: Compile Kotlin boundary and build debug APK
        run: |
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate4a/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-pos-linux
          path: artifacts/t2/gate4a/pos-linux
          if-no-files-found: error
          retention-days: 30

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute locked clean-runner analysis and regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate4a/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate4a/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-pos-windows
          path: artifacts/t2/gate4a/pos-windows
          if-no-files-found: error
          retention-days: 30

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit, build, lint, typecheck, regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
      - name: Enforce frontend license policy
        working-directory: admin-web
        run: >-
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security-sbom-license:
    needs: [server, admin-web, pos-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-server, path: artifacts/t2/gate4a/security/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-pos-linux, path: artifacts/t2/gate4a/security/pos }
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Enforce vulnerability, Secret, IaC and license gates
        run: |
          server_sbom="$(find artifacts/t2/gate4a/security/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find artifacts/t2/gate4a/security/pos -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate4a/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate4a/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate4a/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate4a/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate4a/security/trivy-config.json .github/workflows/t2-gate4a.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-security
          path: artifacts/t2/gate4a/security
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, server, mysql-migration, tenant-security, inventory-vectors, pos-linux, pos-windows, admin-web, security-sbom-license]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-governance, path: artifacts/t2/gate4a/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-server, path: artifacts/t2/gate4a/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-mysql, path: artifacts/t2/gate4a/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-tenant, path: artifacts/t2/gate4a/bundle/tenant }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-vectors, path: artifacts/t2/gate4a/bundle/vectors }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-pos-linux, path: artifacts/t2/gate4a/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-pos-windows, path: artifacts/t2/gate4a/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-web, path: artifacts/t2/gate4a/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate4a-security, path: artifacts/t2/gate4a/bundle/security }
      - name: Verify all evidence and build SHA-256 index
        run: python scripts/build_t2_gate4a_evidence.py --bundle-dir artifacts/t2/gate4a/bundle --stage "${{ needs.governance.outputs.stage }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate4a-immutable-inventory-evidence-bundle
          path: artifacts/t2/gate4a/bundle
          if-no-files-found: error
          retention-days: 30
