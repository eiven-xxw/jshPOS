name: T2 Gate 8D External P0 License Alpha Release Admission Prep

on:
  push:
    branches: ["t2/gate8d-prep-external-p0-license-alpha-admission"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate8d-prep.yml"
      - "contracts/t2/gate8d-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate8d-prep/**"
      - "scripts/*gate8d_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate8d-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate governance contracts and offline review
        run: |
          mkdir -p artifacts/t2/gate8d-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8d_prep.py scripts/build_t2_gate8d_prep_evidence.py
          python scripts/check_t2_gate8d_prep.py --output artifacts/t2/gate8d-prep/governance-ubuntu/gate8d-prep.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate8d-prep-governance-ubuntu
          path: artifacts/t2/gate8d-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and zero execution boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate8d-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate8d_prep.py scripts/build_t2_gate8d_prep_evidence.py
          python scripts/check_t2_gate8d_prep.py --output artifacts/t2/gate8d-prep/governance-windows/gate8d-prep.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate8d-prep-governance-windows
          path: artifacts/t2/gate8d-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Enforce scope dependency secret and external zero boundary
        run: |
          mkdir -p artifacts/t2/gate8d-prep/offline-boundary
          python scripts/check_t2_gate8d_prep.py --output artifacts/t2/gate8d-prep/offline-boundary/scope-secret-zero.json
          python scripts/review_dependency_diff.py bd1dee42bacfb75874d601e16828c8f82720986b "$(git rev-parse HEAD)" > artifacts/t2/gate8d-prep/offline-boundary/dependency-diff.json
          test "$(git diff --name-only bd1dee42bacfb75874d601e16828c8f82720986b -- server admin-web pos-flutter packages infrastructure infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate8d-prep-offline-boundary
          path: artifacts/t2/gate8d-prep/offline-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, offline-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8d-prep-governance-ubuntu, path: artifacts/t2/gate8d-prep/governance-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8d-prep-governance-windows, path: artifacts/t2/gate8d-prep/governance-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate8d-prep-offline-boundary, path: artifacts/t2/gate8d-prep/offline-boundary }
      - name: Build immutable Gate 8D evidence index
        run: python scripts/build_t2_gate8d_prep_evidence.py --bundle-dir artifacts/t2/gate8d-prep --output artifacts/t2/gate8d-prep/evidence-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate8d-prep-evidence-index
          path: artifacts/t2/gate8d-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 90
