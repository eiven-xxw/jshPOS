name: T2 Gate 3A Provider-Neutral Payment Core Quality Gates

on:
  push:
    branches: ["t2/gate3a-sprint4-20260816"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate3a.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/governance/**"
      - "docs/t2-gate3a/**"
      - "pos-flutter/**"
      - "scripts/**t2_gate3a*"
      - "scripts/build_flutter_supply_chain.py"
      - "scripts/check_flutter_sprint3_coverage.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate3a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - id: stage
        name: Resolve governed evidence stage
        shell: bash
        run: |
          status="$(python -c "import csv;r={x['requirement_id']:x['status'] for x in csv.DictReader(open('docs/governance/rtm.csv',encoding='utf-8-sig'))};s={r[x] for x in ('T2-PAY-001','T2-PAY-003','T2-REF-001','T2-REC-001')};assert len(s)==1;print(s.pop())")"
          case "$status" in
            IN_PROGRESS) stage=admitted ;;
            VERIFIED) stage=closure ;;
            *) echo "Unexpected Gate 3A status: $status" >&2; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Verify ancestry, RTM, contracts, migrations and scope
        run: |
          mkdir -p artifacts/t2/gate3a/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate3a.py --stage "${{ steps.stage.outputs.stage }}" --output artifacts/t2/gate3a/governance/gate3a-governance.json
          python scripts/review_dependency_diff.py 60828acbbe18c30914a076709905eeb525ffeb5f "$(git rev-parse HEAD)" > artifacts/t2/gate3a/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-governance
          path: artifacts/t2/gate3a/governance
          if-no-files-found: error
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build admin and execute all server tests and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-server
          path: |
            server/ruoyi-modules/jshpos-foundation/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-catalog/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-order/target/surefire-reports/TEST-*.xml
            server/ruoyi-modules/jshpos-sync/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-sync/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-sync/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-sync/target/site/jacoco/jacoco.csv
            server/ruoyi-modules/jshpos-sync/target/jshpos-sync-*.jar
            server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-modules/jshpos-payment/target/site/jacoco/jacoco.xml
            server/ruoyi-modules/jshpos-payment/target/site/jacoco/jacoco.csv
            server/ruoyi-modules/jshpos-payment/target/jshpos-payment-*.jar
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate3a_root
          MYSQL_DATABASE: jshpos_gate3a
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate3a_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE3A_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate3a?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE3A_MYSQL_USERNAME: root
      GATE3A_MYSQL_PASSWORD: synthetic_gate3a_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Run clean MySQL 8.4 ten-version Flyway integration
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-payment -am test
          -Dtest=PaymentMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-mysql
          path: server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*PaymentMigrationMySqlIT.xml
          if-no-files-found: error
          retention-days: 30

  tenant-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Execute trusted-tenant payment and Mapper boundary tests
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-payment -am test
          -Dtest=PaymentCoreServiceTest,RefundServiceTest,ReconciliationServiceTest,PaymentStrictTenantMapperGuardTest,PaymentMapperXmlPolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - name: Build twelve-surface two-tenant attack evidence
        run: python scripts/run_t2_gate3a_attacks.py --output artifacts/t2/gate3a/tenant/tenant-attacks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-tenant
          path: |
            artifacts/t2/gate3a/tenant
            server/ruoyi-modules/jshpos-payment/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  payment-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Map all sixteen fixed Fake vectors to executed payment suites
        run: python scripts/run_t2_gate3a_fake_matrix.py --output artifacts/t2/gate3a/fake/fake-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-fake
          path: artifacts/t2/gate3a/fake
          if-no-files-found: error
          retention-days: 30

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Resolve locked dependencies and analyze
        working-directory: pos-flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
      - name: Execute Flutter regression and preserve 90 percent synchronization coverage
        run: |
          mkdir -p artifacts/t2/gate3a/pos-linux
          cd pos-flutter
          flutter test --machine --coverage > ../artifacts/t2/gate3a/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_sprint3_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate3a/pos-linux/flutter-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate3a/pos-linux/lcov.info
      - name: Generate Flutter CycloneDX and license inventory
        run: |
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate3a/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate3a/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate3a/pos-linux
      - name: Compile Kotlin boundary and build debug APK
        run: |
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate3a/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-pos-linux
          path: artifacts/t2/gate3a/pos-linux
          if-no-files-found: error
          retention-days: 30

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute locked clean-runner analysis and SQLite/HTTP fault tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate3a/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate3a/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-pos-windows
          path: artifacts/t2/gate3a/pos-windows
          if-no-files-found: error
          retention-days: 30

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit, build, lint, typecheck, regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
      - name: Enforce frontend license policy
        working-directory: admin-web
        run: >-
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security-sbom-license:
    needs: [server, admin-web, pos-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-server, path: artifacts/t2/gate3a/security/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-pos-linux, path: artifacts/t2/gate3a/security/pos }
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Enforce vulnerability, Secret, IaC and license gates
        run: |
          server_sbom="$(find artifacts/t2/gate3a/security/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find artifacts/t2/gate3a/security/pos -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate3a/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate3a/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate3a/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate3a/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate3a/security/trivy-config.json .github/workflows/t2-gate3a.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-security
          path: artifacts/t2/gate3a/security
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, server, mysql-migration, tenant-security, payment-fake, pos-linux, pos-windows, admin-web, security-sbom-license]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-governance, path: artifacts/t2/gate3a/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-server, path: artifacts/t2/gate3a/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-mysql, path: artifacts/t2/gate3a/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-tenant, path: artifacts/t2/gate3a/bundle/tenant }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-fake, path: artifacts/t2/gate3a/bundle/fake }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-pos-linux, path: artifacts/t2/gate3a/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-pos-windows, path: artifacts/t2/gate3a/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-web, path: artifacts/t2/gate3a/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate3a-security, path: artifacts/t2/gate3a/bundle/security }
      - name: Verify all evidence and build SHA-256 index
        run: python scripts/build_t2_gate3a_evidence.py --bundle-dir artifacts/t2/gate3a/bundle --stage "${{ needs.governance.outputs.stage }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate3a-provider-neutral-payment-evidence-bundle
          path: artifacts/t2/gate3a/bundle
          if-no-files-found: error
          retention-days: 30
