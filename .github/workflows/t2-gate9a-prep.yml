name: T2 Gate 9A Internal Product Completeness Audit Prep

on:
  push:
    branches: ["t2/gate9a-prep-internal-product-completeness-audit"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate9a-prep.yml"
      - "contracts/t2/gate9a-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate9a-prep/**"
      - "scripts/*gate9a*"

permissions:
  contents: read

concurrency:
  group: t2-gate9a-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate governance and audit 87 requirements 22 owners
        run: |
          mkdir -p artifacts/t2/gate9a-prep/audit-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9a_prep.py scripts/audit_t2_gate9a_product_completeness.py scripts/build_t2_gate9a_prep_evidence.py
          python scripts/check_t2_gate9a_prep.py
          python scripts/audit_t2_gate9a_product_completeness.py --output-dir artifacts/t2/gate9a-prep/audit-ubuntu
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate9a-prep-audit-ubuntu
          path: artifacts/t2/gate9a-prep/audit-ubuntu
          if-no-files-found: error
          retention-days: 30

  audit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 governance and cross-platform audit semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate9a-prep/audit-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python -m py_compile scripts/check_t2_gate9a_prep.py scripts/audit_t2_gate9a_product_completeness.py scripts/build_t2_gate9a_prep_evidence.py
          python scripts/check_t2_gate9a_prep.py
          python scripts/audit_t2_gate9a_product_completeness.py --output-dir artifacts/t2/gate9a-prep/audit-windows
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate9a-prep-audit-windows
          path: artifacts/t2/gate9a-prep/audit-windows
          if-no-files-found: error
          retention-days: 30

  scope-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce prep-only diff and historical evidence immutability
        run: |
          mkdir -p artifacts/t2/gate9a-prep/scope-integrity
          python scripts/check_t2_gate9a_prep.py | tee artifacts/t2/gate9a-prep/scope-integrity/scope.txt
          python scripts/review_dependency_diff.py 4ba20f8bb9bfdc36f4fee1b831ca35c7b54b9533 "$(git rev-parse HEAD)" > artifacts/t2/gate9a-prep/scope-integrity/dependency-diff.json
          test "$(git diff --name-only 4ba20f8bb9bfdc36f4fee1b831ca35c7b54b9533 -- server admin-web pos-flutter packages infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate9a-prep-scope-integrity
          path: artifacts/t2/gate9a-prep/scope-integrity
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [audit-ubuntu, audit-windows, scope-integrity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate9a-prep-audit-ubuntu, path: artifacts/t2/gate9a-prep/audit-ubuntu }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate9a-prep-audit-windows, path: artifacts/t2/gate9a-prep/audit-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate9a-prep-scope-integrity, path: artifacts/t2/gate9a-prep/scope-integrity }
      - name: Build immutable Gate 9A evidence index
        run: python scripts/build_t2_gate9a_prep_evidence.py --bundle-dir artifacts/t2/gate9a-prep --output artifacts/t2/gate9a-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate9a-prep-evidence-index
          path: artifacts/t2/gate9a-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 90
