name: T2 Prep Governance and Boundary Gates

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-prep.yml"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-prep/**"
      - "scripts/check_t2_prep.py"
      - "scripts/build_t2_prep_evidence.py"
  push:
    branches: ["t2/**"]
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-prep.yml"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-prep/**"
      - "scripts/check_t2_prep.py"
      - "scripts/build_t2_prep_evidence.py"

permissions:
  contents: read

concurrency:
  group: t2-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify T0 T1 and T2-Prep governance
        run: |
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_prep.py --output artifacts/t2/prep/governance/t2-prep-static.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-prep-governance-evidence
          path: artifacts/t2/prep/governance
          if-no-files-found: error
          retention-days: 30

  windows-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify cross-platform T2-Prep boundary
        run: >-
          python scripts/check_t2_prep.py
          --output artifacts/t2/prep/windows/t2-prep-static.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-prep-windows-boundary-evidence
          path: artifacts/t2/prep/windows
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify scope before security scan
        run: python scripts/check_t2_prep.py --output artifacts/t2/prep/security/t2-prep-static.json
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Scan secrets and workflow configuration
        run: |
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/prep/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/prep/security/trivy-config.json .github/workflows/t2-prep.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-prep-security-evidence
          path: artifacts/t2/prep/security
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, windows-boundary, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-prep-governance-evidence
          path: artifacts/t2/prep/bundle/governance
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-prep-windows-boundary-evidence
          path: artifacts/t2/prep/bundle/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-prep-security-evidence
          path: artifacts/t2/prep/bundle/security
      - name: Build final static evidence index
        run: python scripts/build_t2_prep_evidence.py --output-dir artifacts/t2/prep/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-prep-exit-review-bundle
          path: artifacts/t2/prep/bundle
          if-no-files-found: error
          retention-days: 30
