name: T2 Gate 6D Internal Productization Quality Gates

on:
  push:
    branches: ["t2/gate6d-sprint15-internal-productization"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6d.yml"
      - "admin-web/**"
      - "contracts/t2/gate6d/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6d/**"
      - "packages/pos_device_adapter/**"
      - "pos-flutter/**"
      - "scripts/*gate6d*"
      - "scripts/build_flutter_supply_chain.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate6d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate RTM serial admission UI boundaries and external zero execution
        run: |
          mkdir -p artifacts/t2/gate6d/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6d.py --output artifacts/t2/gate6d/governance/gate6d-governance.json
          python scripts/review_dependency_diff.py aece518b9ef1057462e835ad7f98ce1aa2bffbf3 "$(git rev-parse HEAD)" > artifacts/t2/gate6d/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-governance, path: artifacts/t2/gate6d/governance, if-no-files-found: error, retention-days: 30 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build admin and execute complete server regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6d-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6d_root
          MYSQL_DATABASE: jshpos_gate6d
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6d_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6d?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate6d_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate all published MySQL migrations through V41
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-release -am test
          -Dtest=ReleaseMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-mysql, path: server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml, if-no-files-found: error, retention-days: 30 }

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test SQLite widget supply chain Kotlin and Android build
        run: |
          mkdir -p artifacts/t2/gate6d/pos-linux
          cd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app/jshpos_app.dart lib/features/session lib/features/sale test/gate6d test/widget_test.dart
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate6d/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_gate2_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6d/pos-linux/flutter-gate2-coverage.json
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6d/pos-linux/flutter-gate5a-coverage.json
          python scripts/check_flutter_gate5b_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6d/pos-linux/flutter-gate5b-coverage.json
          python scripts/check_flutter_gate5c_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6d/pos-linux/flutter-gate5c-coverage.json
          python scripts/check_flutter_gate6d_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6d/pos-linux/flutter-gate6d-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate6d/pos-linux/lcov.info
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate6d/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate6d/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate6d/pos-linux
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate6d/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-pos-linux, path: artifacts/t2/gate6d/pos-linux, if-no-files-found: error, retention-days: 30 }

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute locked Windows clean-runner analysis and complete Flutter regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6d/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app/jshpos_app.dart lib/features/session lib/features/sale test/gate6d test/widget_test.dart
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate6d/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-pos-windows, path: artifacts/t2/gate6d/pos-windows, if-no-files-found: error, retention-days: 30 }

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck component regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6d-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  internal-e2e:
    needs: [governance, server, mysql, pos-linux, pos-windows, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-governance, path: artifacts/t2/gate6d/e2e-input/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-server, path: artifacts/t2/gate6d/e2e-input/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-mysql, path: artifacts/t2/gate6d/e2e-input/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-pos-linux, path: artifacts/t2/gate6d/e2e-input/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-pos-windows, path: artifacts/t2/gate6d/e2e-input/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-web, path: artifacts/t2/gate6d/e2e-input/web }
      - name: Compose accepted Owner evidence and execute six fixed cash journeys
        run: >-
          python scripts/run_t2_gate6d_internal_e2e.py
          --bundle-dir artifacts/t2/gate6d/e2e-input
          --output artifacts/t2/gate6d/internal-e2e/internal-cash-e2e-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-internal-e2e, path: artifacts/t2/gate6d/internal-e2e, if-no-files-found: error, retention-days: 90 }

  security:
    needs: [server, pos-linux, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-server, path: "${{ runner.temp }}/gate6d-security/server" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-pos-linux, path: "${{ runner.temp }}/gate6d-security/pos" }
      - name: Enforce vulnerability license secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate6d/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
          server_sbom="$(find "$RUNNER_TEMP/gate6d-security/server" -name bom.json -type f -print -quit)"
          flutter_sbom="$(find "$RUNNER_TEMP/gate6d-security/pos" -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6d/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6d/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate6d/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate6d/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6d/security/trivy-config.json .github/workflows/t2-gate6d.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: t2-gate6d-security, path: artifacts/t2/gate6d/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance, server, mysql, pos-linux, pos-windows, admin-web, internal-e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-governance, path: artifacts/t2/gate6d/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-server, path: artifacts/t2/gate6d/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-mysql, path: artifacts/t2/gate6d/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-pos-linux, path: artifacts/t2/gate6d/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-pos-windows, path: artifacts/t2/gate6d/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-web, path: artifacts/t2/gate6d/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-security, path: artifacts/t2/gate6d/bundle/security }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6d-internal-e2e, path: artifacts/t2/gate6d/bundle/internal-e2e }
      - name: Validate and index evidence without duplicating producer artifacts
        run: python scripts/build_t2_gate6d_evidence.py --bundle-dir artifacts/t2/gate6d/bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: t2-gate6d-evidence-index, path: artifacts/t2/gate6d/bundle/t2-gate6d-evidence-index.json, if-no-files-found: error, retention-days: 90 }
