name: T2 Gate 6H Internal Release Candidate Quality Gates

on:
  push:
    branches: ["codex/t2-gate6h-sprint18-internal-release-candidate"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6h.yml"
      - "admin-web/**"
      - "contracts/t2/**"
      - "docs/**"
      - "pos-flutter/**"
      - "scripts/**"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate6h-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate Gate 6H governance and UX boundary
        run: |
          mkdir -p artifacts/t2/gate6h/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6g.py
          python scripts/check_t2_gate6h.py --output artifacts/t2/gate6h/governance/gate6h-governance.json
          python scripts/audit_t2_gate6h_ux.py --output artifacts/t2/gate6h/governance/ux-audit.json
          python scripts/check_t2_gate6h_rc.py --output artifacts/t2/gate6h/governance/rc-contract-audit.json
          python scripts/review_dependency_diff.py c2db49fb47db5fe30fe01515b60ee6f054b214e3 "$(git rev-parse HEAD)" > artifacts/t2/gate6h/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-governance, path: artifacts/t2/gate6h/governance, if-no-files-found: error, retention-days: 30 }

  ux:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Verify Flutter and Vue commercial V1 experience
        run: |
          mkdir -p artifacts/t2/gate6h/ux
          pushd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app lib/features/experience lib/features/session test/gate6h
          flutter analyze --fatal-infos
          flutter test --machine > ../artifacts/t2/gate6h/ux/flutter-tests.jsonl
          popd
          pushd admin-web
          pnpm install --frozen-lockfile
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          cp gate1-vitest-junit.xml ../artifacts/t2/gate6h/ux/web-tests.xml
          popd
          python scripts/audit_t2_gate6h_ux.py --output artifacts/t2/gate6h/ux/ux-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-ux, path: artifacts/t2/gate6h/ux, if-no-files-found: error, retention-days: 30 }

  performance:
    needs: [governance, ux]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6h_root
          MYSQL_DATABASE: jshpos_gate6h
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6h_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE5D_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6h?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE5D_MYSQL_USERNAME: root
      GATE5D_MYSQL_PASSWORD: synthetic_gate6h_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Execute fixed catalog reporting concurrency and POS performance loads
        run: |
          mkdir -p artifacts/t2/gate6h/performance/bundle/catalog
          mkdir -p artifacts/t2/gate6h/performance/bundle/reporting
          mkdir -p artifacts/t2/gate6h/performance/bundle/pos
          pushd server
          ./mvnw -pl ruoyi-modules/jshpos-catalog -am test -Dtest=CatalogImportPreflightTest -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          ./mvnw -pl ruoyi-modules/jshpos-reporting -am test -Dtest=ReportingMigrationMySqlIT,PaymentReconciliationServiceTest -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          ./mvnw -pl ruoyi-admin -am package -DskipTests
          popd
          cp server/ruoyi-modules/jshpos-catalog/target/gate1-capacity.json artifacts/t2/gate6h/performance/bundle/catalog/
          cp server/ruoyi-modules/jshpos-reporting/target/surefire-reports/TEST-*ReportingMigrationMySqlIT.xml artifacts/t2/gate6h/performance/bundle/reporting/
          cp server/ruoyi-modules/jshpos-reporting/target/surefire-reports/TEST-*PaymentReconciliationServiceTest.xml artifacts/t2/gate6h/performance/bundle/reporting/
          pushd pos-flutter
          flutter pub get --enforce-lockfile
          flutter test --machine test/gate6g/local_pos_sale_application_service_test.dart test/sprint3/sync_coordinator_test.dart > ../artifacts/t2/gate6h/performance/bundle/pos/flutter-performance.jsonl
          popd
      - name: Measure formal server cold start in synthetic MySQL and Redis
        run: |
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container" && test -n "$redis_container"
          docker exec "$mysql_container" mysql -uroot -psynthetic_gate6h_root -e "CREATE DATABASE jshpos_gate6h_runtime"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_gate6h_root jshpos_gate6h_runtime < server/script/sql/ry_vue_5.X.sql
          docker exec "$redis_container" redis-cli CONFIG SET requirepass synthetic_gate6h_redis_runtime
          started_ms="$(date +%s%3N)"
          java -jar server/ruoyi-admin/target/ruoyi-admin.jar \
            --server.port=18080 \
            --spring.datasource.dynamic.p6spy=false \
            '--spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:3306/jshpos_gate6h_runtime?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true' \
            --spring.datasource.dynamic.datasource.master.username=root \
            --spring.datasource.dynamic.datasource.master.password=synthetic_gate6h_root \
            --spring.data.redis.host=127.0.0.1 --spring.data.redis.port=6379 \
            --spring.data.redis.password=synthetic_gate6h_redis_runtime \
            --spring.boot.admin.client.enabled=false --snail-job.enabled=false --captcha.enable=false \
            > artifacts/t2/gate6h/performance/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid"; then tail -200 artifacts/t2/gate6h/performance/server.log; exit 1; fi
            sleep 2
          done
          test "$ready" -eq 1
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))
          python -c "import json,pathlib; pathlib.Path('artifacts/t2/gate6h/performance/bundle/server-cold-start.json').write_text(json.dumps({'status':'PASS','milliseconds':int('$elapsed_ms'),'executor':'github-ubuntu-latest','syntheticOnly':True},indent=2)+'\\n')"
      - name: Reconcile seven internal synthetic performance dimensions
        run: >-
          python scripts/build_t2_gate6h_performance_evidence.py
          --bundle-dir artifacts/t2/gate6h/performance/bundle
          --output artifacts/t2/gate6h/performance/performance-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6h-performance, path: artifacts/t2/gate6h/performance, if-no-files-found: error, retention-days: 30 }

  operations:
    needs: [governance, ux, performance]
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: synthetic_gate6h_ops_root
      MYSQL_DATABASE: jshpos_gate6h_ops
      MYSQL_USER: jshpos_gate6h_ops
      MYSQL_PASSWORD: synthetic_gate6h_ops_app
      MYSQL_PORT: "33306"
      REDIS_PASSWORD: synthetic_gate6h_ops_redis
      REDIS_PORT: "36379"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Audit internal operations configuration
        run: |
          mkdir -p artifacts/t2/gate6h/operations/diagnostic-input
          python scripts/check_t2_gate6h_ops.py --output artifacts/t2/gate6h/operations/ops-audit.json
          docker compose -p gate6hops -f infra/compose/compose.yaml config > artifacts/t2/gate6h/operations/compose-config.txt
      - name: Start and verify pinned MySQL and Redis runtime
        run: |
          docker compose -p gate6hops -f infra/compose/compose.yaml up -d --wait
          docker compose -p gate6hops -f infra/compose/compose.yaml ps --format json > artifacts/t2/gate6h/operations/compose-ps.json
          docker compose -p gate6hops -f infra/compose/compose.yaml exec -T mysql mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent
          test "$(docker compose -p gate6hops -f infra/compose/compose.yaml exec -T redis redis-cli -a "$REDIS_PASSWORD" ping | tr -d '\r')" = "PONG"
      - name: Exercise diagnostics restore and release rollback fixtures
        run: |
          printf '%s\n' 'INFO runtime=synthetic status=UP' 'ERROR failure=FAIL_CLOSED correlation=gate6h-ops-001' > artifacts/t2/gate6h/operations/diagnostic-input/runtime.log
          printf '%s\n' '{"status":"PASS","classification":"SYNTHETIC"}' > artifacts/t2/gate6h/operations/diagnostic-input/health.json
          python scripts/collect_t2_gate6h_diagnostics.py --input-dir artifacts/t2/gate6h/operations/diagnostic-input --output artifacts/t2/gate6h/operations/diagnostic-manifest.json
          rm -rf artifacts/t2/gate6h/operations/diagnostic-input
          pushd server
          ./mvnw -pl ruoyi-modules/jshpos-resilience -am test \
            -Dtest=BackupRecoveryServiceTest,BackupRulesTest,AesGcmBackupCipherTest,FileSystemImmutableBackupObjectStoreTest \
            -Dgate6a.restore.output=${{ github.workspace }}/server/ruoyi-modules/jshpos-resilience/target/gate6a/restore-drill.json \
            -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
          popd
          python scripts/run_t2_gate6a_restore_drill.py --output artifacts/t2/gate6h/operations/restore-drill.json
          python scripts/run_t2_gate6b_fixed_matrix.py --output artifacts/t2/gate6h/operations/release-rollback-matrix.json
      - name: Stop internal runtime and remove synthetic volumes
        if: always()
        run: docker compose -p gate6hops -f infra/compose/compose.yaml down -v --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6h-operations, path: artifacts/t2/gate6h/operations, if-no-files-found: error, retention-days: 30 }

  full-server:
    needs: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular monolith regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6h-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  full-mysql:
    needs: operations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6h_full_root
          MYSQL_DATABASE: jshpos_gate6h_full
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6h_full_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6h_full?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate6h_full_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate empty MySQL through all forward migrations
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-release -am test
          -Dtest=ReleaseMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-mysql, path: server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml, if-no-files-found: error, retention-days: 30 }

  full-pos-linux:
    needs: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test coverage supply chain Kotlin and Android APK
        run: |
          mkdir -p artifacts/t2/gate6h/pos-linux
          pushd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate6h/pos-linux/flutter-tests.jsonl
          popd
          python scripts/check_flutter_gate2_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate2-coverage.json
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate5a-coverage.json
          python scripts/check_flutter_gate5b_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate5b-coverage.json
          python scripts/check_flutter_gate5c_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate5c-coverage.json
          python scripts/check_flutter_gate6d_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate6d-coverage.json
          python scripts/check_flutter_gate6e_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6h/pos-linux/flutter-gate6e-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate6h/pos-linux/lcov.info
          pushd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate6h/pos-linux/flutter-dependencies.json
          popd
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate6h/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate6h/pos-linux
          pushd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          popd
          pushd pos-flutter
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate6h/pos-linux/app-debug.apk
          popd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-pos-linux, path: artifacts/t2/gate6h/pos-linux, if-no-files-found: error, retention-days: 30 }

  full-pos-windows:
    needs: operations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute clean Windows Flutter regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6h/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate6h/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-pos-windows, path: artifacts/t2/gate6h/pos-windows, if-no-files-found: error, retention-days: 30 }

  full-web:
    needs: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck component regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6h-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist
          if-no-files-found: error
          retention-days: 30

  runtime-stack:
    needs: [full-server, full-web]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6h_runtime_root
          MYSQL_DATABASE: jshpos_gate6h_runtime
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6h_runtime_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-web, path: downloaded/web }
      - name: Start formal Server Web MySQL Redis and Flutter file SQLite journey
        run: |
          mkdir -p artifacts/t2/gate6h/runtime-stack
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          redis_container="$(docker ps --filter publish=6379 --format '{{.ID}}' | head -1)"
          test -n "$mysql_container" && test -n "$redis_container"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 -uroot -psynthetic_gate6h_runtime_root jshpos_gate6h_runtime < server/script/sql/ry_vue_5.X.sql
          docker exec "$redis_container" redis-cli CONFIG SET requirepass synthetic_gate6h_redis_runtime
          server_jar="$(find downloaded/server -name ruoyi-admin.jar -type f -print -quit)"
          web_dist="$(find downloaded/web -name index.html -path '*/dist/*' -printf '%h\n' | head -1)"
          test -s "$server_jar" && test -n "$web_dist"
          java -jar "$server_jar" --server.port=18080 --spring.datasource.dynamic.p6spy=false \
            '--spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:3306/jshpos_gate6h_runtime?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true' \
            --spring.datasource.dynamic.datasource.master.username=root --spring.datasource.dynamic.datasource.master.password=synthetic_gate6h_runtime_root \
            --spring.data.redis.host=127.0.0.1 --spring.data.redis.port=6379 --spring.data.redis.password=synthetic_gate6h_redis_runtime \
            --spring.boot.admin.client.enabled=false \
            --spring.boot.admin.client.username=gate6h-health \
            --spring.boot.admin.client.password=synthetic_gate6h_health_only \
            --snail-job.enabled=false --captcha.enable=false \
            > artifacts/t2/gate6h/runtime-stack/server.log 2>&1 &
          server_pid=$!
          python -m http.server 14173 --bind 127.0.0.1 --directory "$web_dist" > artifacts/t2/gate6h/runtime-stack/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$server_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null && curl -fsS http://127.0.0.1:14173/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid"; then tail -200 artifacts/t2/gate6h/runtime-stack/server.log; exit 1; fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:18080/ > artifacts/t2/gate6h/runtime-stack/server-root.txt
          curl -fsS http://127.0.0.1:14173/ > artifacts/t2/gate6h/runtime-stack/web-index.html
          docker exec "$mysql_container" mysql -N -B -uroot -psynthetic_gate6h_runtime_root jshpos_gate6h_runtime -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE(); SELECT COUNT(*) FROM jshpos_flyway_schema_history WHERE success=1;" \
            > artifacts/t2/gate6h/runtime-stack/mysql-runtime.txt
          pushd pos-flutter
          flutter pub get --enforce-lockfile
          flutter test --machine test/gate6g/formal_pos_runtime_e2e_test.dart > ../artifacts/t2/gate6h/runtime-stack/flutter-formal-runtime.jsonl
          popd
          kill -0 "$server_pid" && kill -0 "$web_pid"
          python scripts/build_t2_gate6g_runtime_stack_smoke.py \
            --server-url http://127.0.0.1:18080 --web-url http://127.0.0.1:14173 \
            --health-user gate6h-health --health-password synthetic_gate6h_health_only \
            --mysql-runtime artifacts/t2/gate6h/runtime-stack/mysql-runtime.txt \
            --flutter-machine artifacts/t2/gate6h/runtime-stack/flutter-formal-runtime.jsonl \
            --output artifacts/t2/gate6h/runtime-stack/runtime-stack-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6h-runtime-stack, path: artifacts/t2/gate6h/runtime-stack, if-no-files-found: error, retention-days: 90 }

  security:
    needs: [full-server, full-pos-linux, full-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-server, path: downloaded/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-pos-linux, path: downloaded/pos }
      - name: Enforce vulnerability license Secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate6h/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          server_sbom="$(find downloaded/server -name bom.json -type f -print -quit)"
          flutter_sbom="$(find downloaded/pos -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6h/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6h/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate6h/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate6h/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6h/security/trivy-config.json .github/workflows/t2-gate6h.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6h-security, path: artifacts/t2/gate6h/security, if-no-files-found: error, retention-days: 30 }

  internal-release-candidate:
    needs: [governance, ux, performance, operations, full-server, full-mysql, full-pos-linux, full-pos-windows, full-web, runtime-stack, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-governance, path: artifacts/t2/gate6h/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-ux, path: artifacts/t2/gate6h/bundle/ux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-performance, path: artifacts/t2/gate6h/bundle/performance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-operations, path: artifacts/t2/gate6h/bundle/operations }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-server, path: artifacts/t2/gate6h/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-mysql, path: artifacts/t2/gate6h/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-pos-linux, path: artifacts/t2/gate6h/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-pos-windows, path: artifacts/t2/gate6h/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-web, path: artifacts/t2/gate6h/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-runtime-stack, path: artifacts/t2/gate6h/bundle/runtime-stack }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6h-security, path: artifacts/t2/gate6h/bundle/security }
      - name: Build sign and verify internal release candidate
        run: |
          python scripts/build_t2_gate6h_internal_rc.py \
            --bundle-dir artifacts/t2/gate6h/bundle \
            --output-dir artifacts/t2/gate6h/internal-release-candidate \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --release-notes docs/t2-gate6h/08_T2_RC001设计准入与内部候选变更说明.md
          private_key="$(mktemp)"
          trap 'rm -f "$private_key"' EXIT
          openssl genpkey -algorithm ED25519 -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out artifacts/t2/gate6h/internal-release-candidate/synthetic-public-key.pem
          openssl pkeyutl -sign -rawin -inkey "$private_key" \
            -in artifacts/t2/gate6h/internal-release-candidate/candidate-manifest.json \
            -out artifacts/t2/gate6h/internal-release-candidate/candidate-manifest.sig
          openssl pkeyutl -verify -rawin -pubin \
            -inkey artifacts/t2/gate6h/internal-release-candidate/synthetic-public-key.pem \
            -in artifacts/t2/gate6h/internal-release-candidate/candidate-manifest.json \
            -sigfile artifacts/t2/gate6h/internal-release-candidate/candidate-manifest.sig \
            > artifacts/t2/gate6h/internal-release-candidate/signature-verification.txt
          rm -f "$private_key"
          trap - EXIT
          ! grep -R -E "BEGIN (RSA |EC )?PRIVATE KEY" artifacts/t2/gate6h/internal-release-candidate
          (cd artifacts/t2/gate6h/internal-release-candidate && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6h-internal-release-candidate, path: artifacts/t2/gate6h/internal-release-candidate, if-no-files-found: error, retention-days: 90 }
