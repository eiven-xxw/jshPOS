name: T2 Gate 6C Prep External Evidence Governance

on:
  push:
    branches: ["t2/gate6c-prep-20260820"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6c-prep.yml"
      - "contracts/t2/gate6b/gate6b-admission.json"
      - "contracts/t2/gate6c-prep/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6b/08_T2_Gate6B_SprintS14周门禁报告.md"
      - "docs/t2-gate6c-prep/**"
      - "scripts/check_t2_gate6b.py"
      - "scripts/*gate6c_prep*"

permissions:
  contents: read

concurrency:
  group: t2-gate6c-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate governance contracts and external blockers
        run: |
          mkdir -p artifacts/t2/gate6c-prep/governance-ubuntu
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6b.py --baseline ec26f18715c205f29f7b9ec7c8a6478aeffcc557 --output artifacts/t2/gate6c-prep/governance-ubuntu/gate6b-accepted-boundary.json
          python scripts/check_t2_gate6c_prep.py --output artifacts/t2/gate6c-prep/governance-ubuntu/gate6c-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6c-prep-governance-ubuntu
          path: artifacts/t2/gate6c-prep/governance-ubuntu
          if-no-files-found: error
          retention-days: 30

  governance-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate UTF-8 paths RTM and evidence boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6c-prep/governance-windows | Out-Null
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6c_prep.py --output artifacts/t2/gate6c-prep/governance-windows/gate6c-prep.json
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6c-prep-governance-windows
          path: artifacts/t2/gate6c-prep/governance-windows
          if-no-files-found: error
          retention-days: 30

  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Enforce no runtime dependency secret or external execution expansion
        run: |
          mkdir -p artifacts/t2/gate6c-prep/security-boundary
          python scripts/check_t2_gate6c_prep.py --output artifacts/t2/gate6c-prep/security-boundary/scope-and-secret-boundary.json
          python scripts/review_dependency_diff.py f9b733adb2fe1715fd663bae6d2419c4eca668ff "$(git rev-parse HEAD)" > artifacts/t2/gate6c-prep/security-boundary/dependency-diff.json
          test "$(git diff --name-only f9b733adb2fe1715fd663bae6d2419c4eca668ff -- server admin-web pos-flutter device-adapter infra | wc -l)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6c-prep-security-boundary
          path: artifacts/t2/gate6c-prep/security-boundary
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance-ubuntu, governance-windows, security-boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-prep-governance-ubuntu
          path: artifacts/t2/gate6c-prep/governance-ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-prep-governance-windows
          path: artifacts/t2/gate6c-prep/governance-windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t2-gate6c-prep-security-boundary
          path: artifacts/t2/gate6c-prep/security-boundary
      - name: Build evidence index
        run: |
          python scripts/build_t2_gate6c_prep_evidence.py --bundle-dir artifacts/t2/gate6c-prep --output artifacts/t2/gate6c-prep/evidence-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-gate6c-prep-evidence-index
          path: artifacts/t2/gate6c-prep/evidence-index.json
          if-no-files-found: error
          retention-days: 30
