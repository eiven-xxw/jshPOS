name: T1 Week 4 Closure Reproducibility Gates

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week4.yml"
      - "contracts/poc/t1/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t1-prep/**"
      - "docs/t1-week*/**"
      - "poc/t1-week*/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"
      - "scripts/run_t1_reproducibility.py"
      - "scripts/compare_t1_reproducibility.py"
      - "scripts/build_t1_poc_inventory.py"
  push:
    branches: ["t1/**"]
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week4.yml"
      - "contracts/poc/t1/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t1-prep/**"
      - "docs/t1-week*/**"
      - "poc/t1-week*/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"
      - "scripts/run_t1_reproducibility.py"
      - "scripts/compare_t1_reproducibility.py"
      - "scripts/build_t1_poc_inventory.py"

permissions:
  contents: read

concurrency:
  group: t1-week4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify T0 baseline and T1 Week 1-4 governance
        run: |
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t1_prep.py
          python scripts/check_t1_week1.py
          python scripts/check_t1_week2.py --output artifacts/t1/week4/governance/week2-static.json
          python scripts/check_t1_week3.py --output artifacts/t1/week4/governance/week3-static.json
          python scripts/check_t1_week4.py --output artifacts/t1/week4/governance/week4-static-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week4-governance-evidence
          path: artifacts/t1/week4/governance
          if-no-files-found: error
          retention-days: 30

  reproduce:
    name: reproduce-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-latest
          - label: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-run static gates on clean executor
        run: |
          python scripts/check_contracts.py
          python scripts/check_t1_prep.py
          python scripts/check_t1_week1.py
          python scripts/check_t1_week2.py --output artifacts/t1/week4/${{ matrix.label }}/week2-static.json
          python scripts/check_t1_week3.py --output artifacts/t1/week4/${{ matrix.label }}/week3-static.json
          python scripts/check_t1_week4.py --output artifacts/t1/week4/${{ matrix.label }}/week4-static.json
      - name: Re-run Week 1-3 model tests
        run: |
          python -m unittest discover -s poc/t1-week1/tests -v
          python -m unittest discover -s poc/t1-week2/tests -v
          python -m unittest discover -s poc/t1-week3/tests -v
      - name: Re-run all fixed-seed STATIC FAKE probes
        run: >-
          python scripts/run_t1_reproducibility.py
          --platform ${{ matrix.label }}
          --output-dir artifacts/t1/week4/${{ matrix.label }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week4-repro-${{ matrix.label }}
          path: artifacts/t1/week4/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30

  compare-reproducibility:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-repro-ubuntu
          path: artifacts/t1/week4/ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-repro-windows
          path: artifacts/t1/week4/windows
      - name: Compare normalized artifacts and stable metrics
        run: >-
          python scripts/compare_t1_reproducibility.py
          --ubuntu-dir artifacts/t1/week4/ubuntu
          --windows-dir artifacts/t1/week4/windows
          --output artifacts/t1/week4/comparison/reproducibility-comparison.json
      - name: Validate comparison classification and blockers
        run: >-
          python scripts/check_t1_week4.py
          --validate-comparison artifacts/t1/week4/comparison/reproducibility-comparison.json
          --output artifacts/t1/week4/comparison/static-audit-with-comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week4-reproducibility-comparison
          path: artifacts/t1/week4/comparison
          if-no-files-found: error
          retention-days: 30

  supply-chain-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build T1 PoC SBOM license and security inventory
        run: python scripts/build_t1_poc_inventory.py --output-dir artifacts/t1/week4/inventory
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Scan T1 PoC vulnerabilities and secrets
        run: |
          /tmp/trivy fs --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 poc
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 poc
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 contracts/poc/t1
      - name: Scan T1 workflow configuration
        run: /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 .github/workflows/t1-week4.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week4-supply-chain-evidence
          path: artifacts/t1/week4/inventory
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, reproduce, compare-reproducibility, supply-chain-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-governance-evidence
          path: artifacts/t1/week4/bundle/governance
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-repro-ubuntu
          path: artifacts/t1/week4/bundle/ubuntu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-repro-windows
          path: artifacts/t1/week4/bundle/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-reproducibility-comparison
          path: artifacts/t1/week4/bundle/comparison
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week4-supply-chain-evidence
          path: artifacts/t1/week4/bundle/inventory
      - name: Validate final comparison and build SHA-256 index
        run: |
          python scripts/check_t1_week4.py --validate-comparison artifacts/t1/week4/bundle/comparison/reproducibility-comparison.json --output artifacts/t1/week4/bundle/final-static-audit.json
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path("artifacts/t1/week4/bundle")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "week4-evidence-index.json":
                  files.append({"path": path.relative_to(root).as_posix(), "size": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          document = {
              "schemaVersion": "4.0", "phase": "T1-WEEK4", "baselineTag": "t0-baseline-2026-08-16",
              "commitSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "files": files,
              "limitations": ["仅汇总T1 STATIC/FAKE证据", "不包含SANDBOX或REAL_DEVICE", "不能作为商业验收"],
          }
          (root / "week4-evidence-index.json").write_text(json.dumps(document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t1-week4-exit-evidence-bundle
          path: artifacts/t1/week4/bundle
          if-no-files-found: error
          retention-days: 30
