name: T2 Gate 6E Internal Alpha Candidate Quality Gates

on:
  push:
    branches: ["t2/gate6e-sprint16-internal-alpha-candidate"]
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t2-gate6e.yml"
      - "admin-web/**"
      - "contracts/t2/gate6e/**"
      - "docs/adr/**"
      - "docs/governance/**"
      - "docs/t2-gate6e/**"
      - "packages/pos_device_adapter/**"
      - "pos-flutter/**"
      - "scripts/*gate6e*"
      - "scripts/build_flutter_supply_chain.py"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: t2-gate6e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Validate serial admission RTM owner boundaries and external zero execution
        run: |
          mkdir -p artifacts/t2/gate6e/governance
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_contracts.py
          python scripts/check_t2_gate6e.py --output artifacts/t2/gate6e/governance/gate6e-governance.json
          python scripts/review_dependency_diff.py 281e98a6b286f1343a012ed289cecb195858dcc7 "$(git rev-parse HEAD)" > artifacts/t2/gate6e/governance/dependency-input-diff.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6e-governance, path: artifacts/t2/gate6e/governance, if-no-files-found: error, retention-days: 30 }

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Execute complete modular-monolith regression and coverage
        working-directory: server
        run: ./mvnw -pl ruoyi-admin -am clean verify -DskipTests=false
      - name: Generate tested aggregate CycloneDX SBOM
        working-directory: server
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6e-server
          path: |
            server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*.xml
            !server/ruoyi-modules/jshpos-*/target/surefire-reports/TEST-*MigrationMySqlIT.xml
            server/ruoyi-admin/target/ruoyi-admin.jar
            server/target/bom.json
            server/target/bom.xml
          if-no-files-found: error
          retention-days: 30

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: synthetic_gate6e_root
          MYSQL_DATABASE: jshpos_gate6e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_gate6e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GATE6B_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/jshpos_gate6e?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GATE6B_MYSQL_USERNAME: root
      GATE6B_MYSQL_PASSWORD: synthetic_gate6e_root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Validate all published MySQL migrations through V42
        working-directory: server
        run: >-
          ./mvnw -pl ruoyi-modules/jshpos-release -am test
          -Dtest=ReleaseMigrationMySqlIT
          -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6e-mysql, path: server/ruoyi-modules/jshpos-release/target/surefire-reports/TEST-*ReleaseMigrationMySqlIT.xml, if-no-files-found: error, retention-days: 30 }

  pos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Analyze test SQLite widget supply chain Kotlin and Android build
        run: |
          mkdir -p artifacts/t2/gate6e/pos-linux
          cd pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app/jshpos_app.dart lib/features/session lib/features/sale lib/features/return_refund test/gate6d test/gate6e test/widget_test.dart
          flutter analyze --fatal-infos
          flutter test --machine --coverage > ../artifacts/t2/gate6e/pos-linux/flutter-tests.jsonl
          cd ..
          python scripts/check_flutter_gate2_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate2-coverage.json
          python scripts/check_flutter_gate5a_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate5a-coverage.json
          python scripts/check_flutter_gate5b_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate5b-coverage.json
          python scripts/check_flutter_gate5c_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate5c-coverage.json
          python scripts/check_flutter_gate6d_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate6d-coverage.json
          python scripts/check_flutter_gate6e_coverage.py --input pos-flutter/coverage/lcov.info --minimum 0.90 --output artifacts/t2/gate6e/pos-linux/flutter-gate6e-coverage.json
          cp pos-flutter/coverage/lcov.info artifacts/t2/gate6e/pos-linux/lcov.info
          cd pos-flutter
          flutter pub deps --json > ../artifacts/t2/gate6e/pos-linux/flutter-dependencies.json
          cd ..
          python scripts/build_flutter_supply_chain.py --deps artifacts/t2/gate6e/pos-linux/flutter-dependencies.json --package-config pos-flutter/.dart_tool/package_config.json --output-dir artifacts/t2/gate6e/pos-linux
          cd pos-flutter/android
          ./gradlew :app:compileDebugKotlin --no-daemon
          cd ..
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/t2/gate6e/pos-linux/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6e-pos-linux, path: artifacts/t2/gate6e/pos-linux, if-no-files-found: error, retention-days: 30 }

  pos-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - name: Execute locked Windows clean-runner complete Flutter regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/t2/gate6e/pos-windows | Out-Null
          Push-Location pos-flutter
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib/app/jshpos_app.dart lib/features/session lib/features/sale lib/features/return_refund test/gate6d test/gate6e test/widget_test.dart
          flutter analyze --fatal-infos
          flutter test --machine | Tee-Object -FilePath ../artifacts/t2/gate6e/pos-windows/flutter-tests.jsonl
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6e-pos-windows, path: artifacts/t2/gate6e/pos-windows, if-no-files-found: error, retention-days: 30 }

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }
      - name: Audit build lint typecheck component regression and licenses
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry https://registry.npmjs.org --audit-level high
          pnpm build:prod
          pnpm lint:eslint
          pnpm typecheck
          pnpm test:gate1:ci
          pnpm licenses list --json > dependency-licenses.json
          node -e "const x=require('./dependency-licenses.json');const bad=Object.keys(x).filter(k=>/(^|[ (])(AGPL|GPL)-?3([.]0)?(-only|-or-later)?($|[ )])/i.test(k));if(bad.length){console.error('Forbidden licenses: '+bad.join(','));process.exit(1)}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-gate6e-web
          path: |
            admin-web/gate1-vitest-junit.xml
            admin-web/dependency-licenses.json
            admin-web/dist/index.html
          if-no-files-found: error
          retention-days: 30

  security:
    needs: [server, pos-linux, admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-server, path: "${{ runner.temp }}/gate6e-security/server" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-pos-linux, path: "${{ runner.temp }}/gate6e-security/pos" }
      - name: Enforce vulnerability license secret and workflow security gates
        run: |
          mkdir -p artifacts/t2/gate6e/security
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
          server_sbom="$(find "$RUNNER_TEMP/gate6e-security/server" -name bom.json -type f -print -quit)"
          flutter_sbom="$(find "$RUNNER_TEMP/gate6e-security/pos" -name flutter-cyclonedx.json -type f -print -quit)"
          test -s "$server_sbom" && test -s "$flutter_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6e/security/trivy-server-vuln.json "$server_sbom"
          /tmp/trivy sbom --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6e/security/trivy-flutter-vuln.json "$flutter_sbom"
          python scripts/check_sbom_licenses.py "$server_sbom" docs/compliance/reviewed-license-allowlist.json | tee artifacts/t2/gate6e/security/server-license-policy.txt
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --format json --output artifacts/t2/gate6e/security/trivy-secret.json .
          /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/t2/gate6e/security/trivy-config.json .github/workflows/t2-gate6e.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: t2-gate6e-security, path: artifacts/t2/gate6e/security, if-no-files-found: error, retention-days: 30 }

  evidence:
    needs: [governance, server, mysql, pos-linux, pos-windows, admin-web, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-governance, path: artifacts/t2/gate6e/bundle/governance }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-server, path: artifacts/t2/gate6e/bundle/server }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-mysql, path: artifacts/t2/gate6e/bundle/mysql }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-pos-linux, path: artifacts/t2/gate6e/bundle/pos-linux }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-pos-windows, path: artifacts/t2/gate6e/bundle/pos-windows }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-web, path: artifacts/t2/gate6e/bundle/web }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: t2-gate6e-security, path: artifacts/t2/gate6e/bundle/security }
      - name: Validate and index independent evidence without duplication
        run: python scripts/build_t2_gate6e_evidence.py --bundle-dir artifacts/t2/gate6e/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: t2-gate6e-evidence-index, path: artifacts/t2/gate6e/bundle/t2-gate6e-evidence-index.json, if-no-files-found: error, retention-days: 90 }
