name: T1 Week 3 Internal STATIC FAKE Gates

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week3.yml"
      - "contracts/poc/t1/**"
      - "docs/governance/**"
      - "docs/t1-week3/**"
      - "poc/t1-week1/**"
      - "poc/t1-week2/**"
      - "poc/t1-week3/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"
  push:
    branches: ["t1/**"]
    paths:
      - "AGENTS.md"
      - ".github/workflows/t1-week3.yml"
      - "contracts/poc/t1/**"
      - "docs/governance/**"
      - "docs/t1-week3/**"
      - "poc/t1-week1/**"
      - "poc/t1-week2/**"
      - "poc/t1-week3/**"
      - "scripts/check_contracts.py"
      - "scripts/check_t1_*.py"

permissions:
  contents: read

concurrency:
  group: t1-week3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify T0 baseline and T1 lifecycle
        run: |
          python scripts/check_t0_structure.py
          python scripts/check_rtm.py
          python scripts/check_t1_prep.py
          python scripts/check_t1_week1.py
          python scripts/check_t1_week2.py --output artifacts/t1/week2/static-regression.json
      - name: Verify all contracts and Week 3 boundary
        run: |
          python scripts/check_contracts.py
          python scripts/check_t1_week3.py --output artifacts/t1/week3/static-evidence.json
      - name: Run isolated model unit tests
        run: python -m unittest discover -s poc/t1-week3/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-static-evidence
          path: artifacts/t1/week3/static-evidence.json
          if-no-files-found: error
          retention-days: 30

  sync-convergence:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Outbox Inbox cross-fault convergence
        run: >-
          python poc/t1-week3/src/t1_week3_harness.py
          --domains sync
          --output artifacts/t1/week3/fake-sync.json
      - name: Validate partial evidence
        run: python scripts/check_t1_week3.py --validate-evidence artifacts/t1/week3/fake-sync.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-sync-evidence
          path: artifacts/t1/week3/fake-sync.json
          if-no-files-found: error
          retention-days: 30

  payment-tenant:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run payment convergence and tenant attack regression
        run: >-
          python poc/t1-week3/src/t1_week3_harness.py
          --domains payment,tenant
          --output artifacts/t1/week3/fake-payment-tenant.json
      - name: Validate partial evidence
        run: python scripts/check_t1_week3.py --validate-evidence artifacts/t1/week3/fake-payment-tenant.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-payment-tenant-evidence
          path: artifacts/t1/week3/fake-payment-tenant.json
          if-no-files-found: error
          retention-days: 30

  package-upgrade:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run package recovery and upgrade compatibility probes
        run: >-
          python poc/t1-week3/src/t1_week3_harness.py
          --domains package,upgrade
          --output artifacts/t1/week3/fake-package-upgrade.json
      - name: Validate partial evidence
        run: python scripts/check_t1_week3.py --validate-evidence artifacts/t1/week3/fake-package-upgrade.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-package-upgrade-evidence
          path: artifacts/t1/week3/fake-package-upgrade.json
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify no third-party dependency manifest was introduced
        run: |
          mkdir -p artifacts/t1/week3
          python scripts/review_dependency_diff.py 04b176f2cd44ae4738a7bfd855548b17fa1bd380 "$GITHUB_SHA" > artifacts/t1/week3/dependency-diff.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/t1/week3/dependency-diff.json").read_text())
          manifests = {"pom.xml", "package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "pubspec.yaml", "pubspec.lock", "build.gradle", "build.gradle.kts", "libs.versions.toml"}
          unexpected = [item for item in data["changed_dependency_inputs"] if Path(item["path"]).name in manifests]
          if unexpected:
              raise SystemExit(f"Week 3 changed dependency manifests: {unexpected}")
          PY
      - name: Install verified Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          test "$(/tmp/trivy --version | awk '/Version:/ {print $2}')" = "0.72.0"
      - name: Scan Week 3 scope for HIGH CRITICAL vulnerabilities and secrets
        run: |
          /tmp/trivy fs --skip-version-check --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 poc/t1-week3
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 contracts/poc/t1/week3
          /tmp/trivy fs --skip-version-check --offline-scan --scanners secret --severity HIGH,CRITICAL --exit-code 1 poc/t1-week3
      - name: Scan Week 3 workflow configuration
        run: /tmp/trivy config --skip-version-check --checks-bundle-repository ghcr.io/aquasecurity/trivy-checks:2 --severity HIGH,CRITICAL --exit-code 1 .github/workflows/t1-week3.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-dependency-evidence
          path: artifacts/t1/week3/dependency-diff.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [governance, sync-convergence, payment-tenant, package-upgrade, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week3-static-evidence
          path: artifacts/t1/week3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week3-sync-evidence
          path: artifacts/t1/week3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week3-payment-tenant-evidence
          path: artifacts/t1/week3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t1-week3-package-upgrade-evidence
          path: artifacts/t1/week3
      - name: Merge levels and build evidence manifest
        run: >-
          python scripts/check_t1_week3.py
          --output artifacts/t1/week3/static-evidence.json
          --merge-evidence
          artifacts/t1/week3/fake-sync.json
          artifacts/t1/week3/fake-payment-tenant.json
          artifacts/t1/week3/fake-package-upgrade.json
          --merged-output artifacts/t1/week3/fake-evidence.json
          --manifest-output artifacts/t1/week3/evidence-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-week3-evidence-bundle
          path: |
            artifacts/t1/week3/static-evidence.json
            artifacts/t1/week3/fake-evidence.json
            artifacts/t1/week3/evidence-manifest.json
          if-no-files-found: error
          retention-days: 30
